<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hair lab</title>
<!-- A developer page: every hairstyle on the real rig (head, face, ears, collar, hair as in the game).
  Query: view=front|three|side|back|top|game, skin=light|tan|mid|brown|dark, hair=<hex>, style=<name> (one big),
  light=day|night, styles=a,b,c (pick and order).
  Faces: face=1 shows six big heads with mixed skins, hair colours and styles (skin=, hair=, style= set them all;
  dist=<m> moves the camera, at=<m> raises what it looks at).
  Bodies: body=1 frames whole players (n=4 side by side, the first is the hero, kits differ) in any view;
  pose=stand|run|shot|cheer|sad freezes a pose made by the real animateRig (kt=<s> picks the moment of the shot,
  ph=<0-1> the moment of the stride, mt=<s> the moment of the cheer). pose also works with view=game. head=1 frames
  the heads (with dist=<m>), to see the face the pose gives (pose=shot: effort, cheer: happy, sad: let down).
  Faces of real players: row=1 shows twelve named players (from js/teams.js, with their own hair and face; names=A,B,..
  picks them, cols=<n> sets the columns). exprs=1 shows one player (name=, default YAMAL) in each face state.
  expr=calm|focus|effort|happy|sad|half|blink freezes every face in that state; look=<round>,<up> turns the eyes
  (degrees, + is his left / up). Each label gives the head's triangles and draw calls. -->
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>
<style>
  html, body { margin: 0; height: 100%; background: #20242c; color: #e8ecf2; font: 600 14px system-ui, sans-serif; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; }
  #labels div { position: absolute; transform: translateX(-50%); padding: 1px 6px; border-radius: 4px; background: rgba(0,0,0,.55); white-space: nowrap; }
  #info { position: fixed; left: 8px; top: 6px; opacity: .7; font-size: 12px; }
</style>
</head>
<body>
<canvas id="c"></canvas><div id="labels"></div><div id="info"></div>
<script type="module">
import * as THREE from 'three';
import { makeRig, RIM } from '../js/pro/rig.js';
import { HAIR_STYLES } from '../js/pro/hair.js';
import { makeEnv } from '../js/pro/light.js';
import { animateRig } from '../js/pro/motion.js';
import { TEAMS } from '../js/teams.js';

const Q = new URLSearchParams(location.search);
// Real players by name, as js/teams.js has them.
const PEOPLE = new Map(TEAMS.flatMap(t => t.players).map(p => [p.name, p]));
const ROW = Q.get('names') ? Q.get('names').split(',') : ['YAMAL', 'MBAPPÉ', 'HAALAND', 'MESSI', 'RONALDO', 'VINI JR', 'BELLINGHAM', 'SALAH', 'DE BRUYNE', 'MODRIĆ', 'KANE', 'SAKA'];
const EXPR = { calm: {}, focus: { focus: 1 }, effort: { effort: 1 }, happy: { happy: 1 }, sad: { sad: 1, look: [0, -2.2] }, half: { blink: .5 }, blink: { blink: 1 } };
const row = Q.get('row') === '1', exprs = Q.get('exprs') === '1', who = Q.get('name') || 'YAMAL';
const freeze = (g, k) => { const o = EXPR[k]; if (!o) return; const l = Q.get('look'); g.userData.faceSet({ ...o, look: o.look || (l ? l.split(',').map(Number) : undefined) }); };
const view = Q.get('view') || 'front', night = Q.get('light') === 'night';
const SKIN = { light: '#f0c8a6', tan: '#d9a37a', mid: '#b07a52', brown: '#8a5a3a', dark: '#6b4429' };   // as in js/teams.js
const HAIR = { light: '#5a4330', tan: '#2a1c12', mid: '#1b1410', brown: '#120c08', dark: '#120c08' };
const skinK = SKIN[Q.get('skin')] ? Q.get('skin') : 'light', skin = SKIN[skinK], hair = Q.get('hair') ? '#' + Q.get('hair').replace('#', '') : HAIR[skinK];
const faces = Q.get('face') === '1';   // [skin, hair, style] for each big head
const FACES = [['light', '#5a4330', 'part'], ['tan', '#1b1410', 'crop'], ['dark', '#120c08', 'fade'], ['mid', '#1b1410', 'curls'], ['light', '#c9a46a', 'quiff'], ['brown', '#120c08', 'buzz']]
  .map(([k, h, s]) => [Q.get('skin') ? skin : SKIN[k], Q.get('hair') ? hair : h, Q.get('style') || s]);
const styles = row ? ROW : exprs ? Object.keys(EXPR) : faces ? FACES.map(f => f[2]) : Q.get('style') ? [Q.get('style')] : Q.get('styles') ? Q.get('styles').split(',') : HAIR_STYLES;
const KITS = [{ pattern: 'stripes', colors: ['#fb090b', '#1b1b1f'], shorts: '#ffffff', socks: '#1b1b1f', num: '#ffffff', trim: '#ffffff' },
  { pattern: 'solid', colors: ['#1e3a8a'], shorts: '#ffffff', socks: '#1e3a8a', num: '#ffffff', trim: '#fcd116' }];
const BODY_KITS = [KITS[0], { pattern: 'solid', colors: ['#fcd116'], shorts: '#1e3a8a', socks: '#fcd116', num: '#1e3a8a', trim: '#1e3a8a' },
  { pattern: 'sleeves', colors: ['#ef0107', '#ffffff'], shorts: '#ffffff', socks: '#ffffff', num: '#ffffff', trim: '#ffffff' },
  { pattern: 'stripes', colors: ['#75aadb', '#ffffff'], shorts: '#1b1b1f', socks: '#ffffff', num: '#1b1b1f', trim: '#c9a227' }];
const body = Q.get('body') === '1', poseK = Q.get('pose'), num = (k, d) => Q.has(k) ? +Q.get(k) : d;

const canvas = document.getElementById('c'), W = innerWidth, H = innerHeight;
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H, false);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = night ? 1.1 : 1.05;
renderer.setScissorTest(true);

// The game's light (js/world.js): by day a hemisphere light and a low warm sun; by night four floodlights.
const scene = new THREE.Scene();
scene.environment = makeEnv(renderer, night ? { top: '#05070f', horizon: '#1a2748', ground: '#0e2a12', lamps: [[-30, -25, 26, '#eaf1ff', 40, 2.5], [30, 25, 26, '#eaf1ff', 40, 2.5]] }
  : { top: '#3f7fd8', horizon: '#f0dcc0', ground: '#3f6a30', lamps: [[10, -28, 15, '#ffe0b0', 60, 3]] });
const hemi = new THREE.HemisphereLight(night ? '#9db0ff' : '#cfe2ff', night ? '#24502a' : '#86a35f', night ? .42 : .8); hemi.position.set(0, 0, 1); scene.add(hemi);
const lamps = night ? [[-30, -25, 26, 1.35], [30, 25, 26, 1.3], [30, -25, 26, 1.3], [-30, 25, 26, 1.3]] : [[10, -28, 15, 3.1]];
lamps.forEach(([x, y, z, k], i) => {
  const l = new THREE.DirectionalLight(night ? '#f2f6ff' : '#ffdcae', k); l.position.set(x, y, z); scene.add(l, l.target);
  if (!i) { l.castShadow = true; l.shadow.mapSize.set(2048, 2048); l.shadow.bias = -.0004; l.shadow.normalBias = .02; Object.assign(l.shadow.camera, { left: -12, right: 12, top: 12, bottom: -12, near: 1, far: 100 }); }
});
RIM.color.value.set(night ? '#d2e2ff' : '#ffe6bd'); RIM.k.value = night ? .55 : .45;

const labels = document.getElementById('labels');
const label = (text, x, y) => { const d = document.createElement('div'); d.textContent = text; d.style.left = x + 'px'; d.style.top = y + 'px'; labels.appendChild(d); };
const NAMES = ['SILVA', 'KANE', 'MBAPPE', 'PEDRI'];
const player = (style, i) => { const g = player0(style, i); freeze(g, exprs ? style : Q.get('expr') || (Q.get('look') ? 'calm' : '')); return g; };
const player0 = (style, i) => row ? makeRig({ ...PEOPLE.get(style) || { name: style, skin: SKIN.tan, hair: HAIR.tan }, num: 7 + i }, KITS[i % 2], false)
  : exprs ? makeRig({ ...PEOPLE.get(who) || { name: who, skin: SKIN.tan, hair: HAIR.tan }, num: 7 }, KITS[0], false)
  : body ? makeRig({ name: NAMES[i % 4], num: [7, 10, 9, 23][i % 4], skin: Object.values(SKIN)[(i * 2) % 5], hair, hairStyle: style }, BODY_KITS[i % 4], i === 0)
  : faces ? makeRig({ name: 'LAB' + i, num: 7 + i, skin: FACES[i % 6][0], hair: FACES[i % 6][1], hairStyle: style }, KITS[i % 2], false)
  : makeRig({ name: 'LAB' + i, num: 7 + i, skin, hair, hairStyle: style }, KITS[i % 2], false);
// Freezes a rig in a pose made by the real animateRig: a fake player and game run frame by frame. Returns how far
// he moved, so the caller can put him back in his place.
function pose(g, kind, i) {
  const a = { id: 'p' + i, x: 0, y: 0, sp: 0, face: [1, 0], dist: 0, kickAt: null, kickKind: 'shot', team: 'us' };
  const ball = { state: 'loose', x: 6, y: 0, z: 0, t: 0, dur: 1, tx: 9, ty: 0, fx: 9, fy: 0, carrier: null };
  const sim = { time: 0, restores: 0, ball, list: [a] }, dt = 1 / 60, run = kind === 'run';
  g.userData.seed = 1.3 + i * .77;
  let k = 0, mood = 0, moodT = 0;
  const step = () => { sim.time = k++ * dt; if (run) { a.sp = Math.min(5.4, sim.time * 4); a.x += a.sp * dt; a.dist += a.sp * dt; } ball.x = a.x + (kind === 'shot' ? .45 : 6); animateRig(g, a, sim, mood, moodT); };
  while (k < 120) step();
  if (run) { const want = num('ph', 0); for (let n = 0; n < 200 && Math.abs(((g.userData.m.ph + .04 - want) % 1 + 1.5) % 1 - .5) > .012; n++) step(); }
  if (kind === 'shot') { a.kickAt = sim.time; const end = sim.time + num('kt', .3); while (sim.time < end - 1e-6) step(); }
  if (kind === 'sad') { mood = -1; const end = num('mt', .95); while (moodT < end) { moodT += dt; step(); } }
  if (kind === 'cheer') { mood = 1; const end = num('mt', .95); while (moodT < end) { moodT += dt; step(); } }
  return a.x;
}
const cam = new THREE.PerspectiveCamera(30, 1, .01, 200); cam.up.set(0, 0, 1);
document.getElementById('info').textContent = `view=${view} skin=${skinK} hair=${hair}${night ? ' night' : ''}`;

// The hair is every part built on the head after the head itself, the nose and the two ears (the parts as built,
// before pro/rig.js merges them into four meshes).
function triCount(g) { const hair = g.userData.made.filter(p => p.head).slice(4); return [hair.reduce((n, p) => n + p.tris, 0), hair.length]; }

if (view === 'game') {
  // Whole players from a high camera behind play, small enough that a head is about 25-30 px tall.
  const grass = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), new THREE.MeshStandardMaterial({ color: '#3f9a3c', roughness: .95 })); grass.receiveShadow = true; scene.add(grass);
  for (let k = 0; k < 18; k++) { const s = new THREE.Mesh(new THREE.PlaneGeometry(3, 80), new THREE.MeshStandardMaterial({ color: '#368634', roughness: .95 })); s.position.set(-40 + k * 6, 0, .002); s.receiveShadow = true; scene.add(s); }
  const n = styles.length, gap = .95, rows = [[-1.2, Math.PI * .85], [1, 0], [3.2, Math.PI / 2]];   // [x, yaw]: facing the camera, facing away, side on
  const rigs = [];
  rows.forEach(([x, yaw], r) => styles.forEach((s, i) => {
    const g = player(s, i + r), yw = yaw + (r === 0 ? (i % 3 - 1) * .3 : 0);
    if (poseK) { const dx = pose(g, poseK, i + r), h = new THREE.Group(); h.add(g); g.position.x -= dx; h.position.set(x, ((n - 1) / 2 - i) * gap, 0); h.rotation.z = yw; scene.add(h); }
    else { g.position.set(x, ((n - 1) / 2 - i) * gap, 0); g.rotation.z = yw; scene.add(g); }
    rigs.push([g, s, r]);
  }));
  cam.fov = 21; cam.aspect = W / H; cam.position.set(-15, 0, 13); cam.lookAt(1, 0, .9); cam.updateProjectionMatrix(); cam.updateMatrixWorld();
  renderer.setViewport(0, 0, W, H); renderer.setScissor(0, 0, W, H); renderer.setClearColor('#3f9a3c');
  scene.updateMatrixWorld(true);
  const v = new THREE.Vector3(), top = new THREE.Vector3();
  for (const [g, s, r] of rigs) {
    g.userData.head.getWorldPosition(v); top.copy(v); top.z += .17; v.z -= .15;
    const a = v.clone().project(cam), b = top.clone().project(cam);
    if (r === 0) label(s, (a.x + 1) / 2 * W, (1 - a.y) / 2 * H + 112);
    if (r === 1 && s === styles[0]) document.getElementById('info').textContent += ` · head about ${Math.round(Math.abs(b.y - a.y) / 2 * H)} px`;
  }
  draw(() => renderer.render(scene, cam));
} else if (body) {
  // Whole players, one per cell, framed the same way: the hero first, then other kits and skins.
  const n = num('n', 4), cw = W / n, ch = H - 24, cells = [];
  const dir = { front: [1, 0, .08], three: [.75, .62, .2], side: [0, 1, .1], back: [-1, -.15, .15], top: [.45, .2, 1] }[view] || [1, 0, .08];
  const d = new THREE.Vector3(...dir).normalize();
  for (let i = 0; i < n; i++) {
    const s = styles[i % styles.length], g = player(s, i), h = new THREE.Group(); h.add(g); h.position.x = i * 4; scene.add(h);
    if (poseK) { const dx = pose(g, poseK, i); g.position.x -= dx; }
    cells.push({ g, h, x: i * cw, y: 24 });
    let tris = 0, meshes = 0, bt = 0, bm = 0;
    for (const p of g.userData.made) { tris += p.tris; meshes++; if (!p.head) { bt += p.tris; bm++; } }
    label(`${i ? '' : 'hero · '}${tris} tris, ${meshes} parts (body ${bt}, ${bm})`, i * cw + cw / 2, 28);
  }
  scene.updateMatrixWorld(true);
  const c0 = new THREE.Vector3();
  draw(() => {
    renderer.setClearColor('#20242c'); renderer.setViewport(0, 0, W, H); renderer.setScissor(0, 0, W, H); renderer.clear();
    for (const c of cells) {
      for (const o of cells) o.h.visible = o === c;
      if (Q.get('head') === '1') c.g.userData.head.getWorldPosition(c0); else { c.h.getWorldPosition(c0); c0.z = poseK === 'cheer' ? 1.02 : .86; }
      cam.aspect = cw / ch; cam.fov = 28; cam.position.copy(c0).addScaledVector(d, num('dist', 4.4)); cam.lookAt(c0); cam.updateProjectionMatrix();
      renderer.setViewport(c.x, H - c.y - ch, cw, ch); renderer.setScissor(c.x, H - c.y - ch, cw, ch);
      renderer.setClearColor(night ? '#141a2c' : '#2b313b'); renderer.clear(); renderer.render(scene, cam);
    }
  });
} else {
  // One head per cell, framed the same way, each drawn in its own part of the canvas.
  const n = styles.length, cols = num('cols', 0) || (n === 1 ? 1 : faces ? 3 : row ? 6 : exprs ? 4 : Math.ceil(Math.sqrt(n * W / H * .8))), rowsN = Math.ceil(n / cols), cw = W / cols, ch = (H - 24) / rowsN;
  const dir = { front: [1, 0, .08], three: [.75, .62, .2], side: [0, 1, .1], back: [-1, -.15, .15], top: [.45, .2, 1] }[view] || [1, 0, .08];
  const d = new THREE.Vector3(...dir).normalize(), cells = [];
  styles.forEach((s, i) => {
    const g = player(s, i); g.position.set(i * 3, 0, 0); scene.add(g);   // apart, so each cell shows one head
    const c = i % cols, r = Math.floor(i / cols);
    cells.push({ g, s, x: c * cw, y: 24 + r * ch });
    const [tris, calls] = triCount(g);
    label(`${s}  ·  ${tris} tris, ${calls} call${calls > 1 ? 's' : ''}`, c * cw + cw / 2, 24 + r * ch + 4);
  });
  scene.updateMatrixWorld(true);
  const h = new THREE.Vector3();
  draw(() => {
    renderer.setClearColor('#20242c'); renderer.setViewport(0, 0, W, H); renderer.setScissor(0, 0, W, H); renderer.clear();
    for (const c of cells) {
      for (const o of cells) o.g.visible = o === c;   // only this cell's player, so no one stands behind him
      c.g.userData.head.getWorldPosition(h); h.z += num('at', faces || row || exprs ? .01 : .03);
      cam.aspect = cw / ch; cam.fov = n === 1 ? 24 : 28; cam.position.copy(h).addScaledVector(d, num('dist', faces || exprs ? .8 : .95)); cam.lookAt(h); cam.updateProjectionMatrix();
      renderer.setViewport(c.x, H - c.y - ch, cw, ch); renderer.setScissor(c.x, H - c.y - ch, cw, ch);
      renderer.setClearColor(night ? '#141a2c' : '#2b313b'); renderer.clear(); renderer.render(scene, cam);
    }
  });
}
function draw(f) { let k = 0; const loop = () => { f(); if (++k < 4) requestAnimationFrame(loop); }; loop(); }
</script>
</body>
</html>
