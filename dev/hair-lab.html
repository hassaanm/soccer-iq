<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hair lab</title>
<!-- A developer page: every hairstyle on the real rig (head, face, ears, collar, hair as in the game).
  Query: view=front|three|side|back|top|game, skin=light|tan|mid|brown|dark, hair=<hex>, style=<name> (one big),
  light=day|night, styles=a,b,c (pick and order). -->
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>
<style>
  html, body { margin: 0; height: 100%; background: #20242c; color: #e8ecf2; font: 600 14px system-ui, sans-serif; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; }
  #labels div { position: absolute; transform: translateX(-50%); padding: 1px 6px; border-radius: 4px; background: rgba(0,0,0,.55); white-space: nowrap; }
  #info { position: fixed; left: 8px; top: 6px; opacity: .7; font-size: 12px; }
</style>
</head>
<body>
<canvas id="c"></canvas><div id="labels"></div><div id="info"></div>
<script type="module">
import * as THREE from 'three';
import { makeRig, RIM } from '../js/pro/rig.js';
import { HAIR_STYLES } from '../js/pro/hair.js';
import { makeEnv } from '../js/pro/light.js';

const Q = new URLSearchParams(location.search);
const view = Q.get('view') || 'front', night = Q.get('light') === 'night';
const SKIN = { light: '#f0c8a6', tan: '#d9a37a', mid: '#b07a52', brown: '#8a5a3a', dark: '#6b4429' };   // as in js/teams.js
const HAIR = { light: '#5a4330', tan: '#2a1c12', mid: '#1b1410', brown: '#120c08', dark: '#120c08' };
const skinK = SKIN[Q.get('skin')] ? Q.get('skin') : 'light', skin = SKIN[skinK], hair = Q.get('hair') ? '#' + Q.get('hair').replace('#', '') : HAIR[skinK];
const styles = Q.get('style') ? [Q.get('style')] : Q.get('styles') ? Q.get('styles').split(',') : HAIR_STYLES;
const KITS = [{ pattern: 'stripes', colors: ['#fb090b', '#1b1b1f'], shorts: '#ffffff', socks: '#1b1b1f', num: '#ffffff', trim: '#ffffff' },
  { pattern: 'solid', colors: ['#1e3a8a'], shorts: '#ffffff', socks: '#1e3a8a', num: '#ffffff', trim: '#fcd116' }];

const canvas = document.getElementById('c'), W = innerWidth, H = innerHeight;
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H, false);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = night ? 1.1 : 1.05;
renderer.setScissorTest(true);

// The game's light (js/world.js): by day a hemisphere light and a low warm sun; by night four floodlights.
const scene = new THREE.Scene();
scene.environment = makeEnv(renderer, night ? { top: '#05070f', horizon: '#1a2748', ground: '#0e2a12', lamps: [[-30, -25, 26, '#eaf1ff', 40, 2.5], [30, 25, 26, '#eaf1ff', 40, 2.5]] }
  : { top: '#3f7fd8', horizon: '#f0dcc0', ground: '#3f6a30', lamps: [[10, -28, 15, '#ffe0b0', 60, 3]] });
const hemi = new THREE.HemisphereLight(night ? '#9db0ff' : '#cfe2ff', night ? '#24502a' : '#86a35f', night ? .42 : .8); hemi.position.set(0, 0, 1); scene.add(hemi);
const lamps = night ? [[-30, -25, 26, 1.35], [30, 25, 26, 1.3], [30, -25, 26, 1.3], [-30, 25, 26, 1.3]] : [[10, -28, 15, 3.1]];
lamps.forEach(([x, y, z, k], i) => {
  const l = new THREE.DirectionalLight(night ? '#f2f6ff' : '#ffdcae', k); l.position.set(x, y, z); scene.add(l, l.target);
  if (!i) { l.castShadow = true; l.shadow.mapSize.set(2048, 2048); l.shadow.bias = -.0004; l.shadow.normalBias = .02; Object.assign(l.shadow.camera, { left: -12, right: 12, top: 12, bottom: -12, near: 1, far: 100 }); }
});
RIM.color.value.set(night ? '#d2e2ff' : '#ffe6bd'); RIM.k.value = night ? .55 : .45;

const labels = document.getElementById('labels');
const label = (text, x, y) => { const d = document.createElement('div'); d.textContent = text; d.style.left = x + 'px'; d.style.top = y + 'px'; labels.appendChild(d); };
const player = (style, i) => makeRig({ name: 'LAB' + i, num: 7 + i, skin, hair, hairStyle: style }, KITS[i % 2], false);
const cam = new THREE.PerspectiveCamera(30, 1, .01, 200); cam.up.set(0, 0, 1);
document.getElementById('info').textContent = `view=${view} skin=${skinK} hair=${hair}${night ? ' night' : ''}`;

// The hair is every mesh in the head after the head itself and the two ears.
function triCount(g) { let n = 0, calls = 0, k = 0; g.userData.head.traverse(o => { if (o.isMesh && ++k > 3) { calls++; n += (o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count) / 3; } }); return [n, calls]; }

if (view === 'game') {
  // Whole players from a high camera behind play, small enough that a head is about 25-30 px tall.
  const grass = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), new THREE.MeshStandardMaterial({ color: '#3f9a3c', roughness: .95 })); grass.receiveShadow = true; scene.add(grass);
  for (let k = 0; k < 18; k++) { const s = new THREE.Mesh(new THREE.PlaneGeometry(3, 80), new THREE.MeshStandardMaterial({ color: '#368634', roughness: .95 })); s.position.set(-40 + k * 6, 0, .002); s.receiveShadow = true; scene.add(s); }
  const n = styles.length, gap = .95, rows = [[-1.2, Math.PI * .85], [1, 0], [3.2, Math.PI / 2]];   // [x, yaw]: facing the camera, facing away, side on
  const rigs = [];
  rows.forEach(([x, yaw], r) => styles.forEach((s, i) => {
    const g = player(s, i + r); g.position.set(x, ((n - 1) / 2 - i) * gap, 0); g.rotation.z = yaw + (r === 0 ? (i % 3 - 1) * .3 : 0); scene.add(g); rigs.push([g, s, r]);
  }));
  cam.fov = 21; cam.aspect = W / H; cam.position.set(-15, 0, 13); cam.lookAt(1, 0, .9); cam.updateProjectionMatrix(); cam.updateMatrixWorld();
  renderer.setViewport(0, 0, W, H); renderer.setScissor(0, 0, W, H); renderer.setClearColor('#3f9a3c');
  scene.updateMatrixWorld(true);
  const v = new THREE.Vector3(), top = new THREE.Vector3();
  for (const [g, s, r] of rigs) {
    g.userData.head.getWorldPosition(v); top.copy(v); top.z += .17; v.z -= .15;
    const a = v.clone().project(cam), b = top.clone().project(cam);
    if (r === 0) label(s, (a.x + 1) / 2 * W, (1 - a.y) / 2 * H + 112);
    if (r === 1 && s === styles[0]) document.getElementById('info').textContent += ` · head about ${Math.round(Math.abs(b.y - a.y) / 2 * H)} px`;
  }
  draw(() => renderer.render(scene, cam));
} else {
  // One head per cell, framed the same way, each drawn in its own part of the canvas.
  const n = styles.length, cols = n === 1 ? 1 : Math.ceil(Math.sqrt(n * W / H * .8)), rowsN = Math.ceil(n / cols), cw = W / cols, ch = (H - 24) / rowsN;
  const dir = { front: [1, 0, .08], three: [.75, .62, .2], side: [0, 1, .1], back: [-1, -.15, .15], top: [.45, .2, 1] }[view] || [1, 0, .08];
  const d = new THREE.Vector3(...dir).normalize(), cells = [];
  styles.forEach((s, i) => {
    const g = player(s, i); g.position.set(i * 3, 0, 0); scene.add(g);   // apart, so each cell shows one head
    const c = i % cols, r = Math.floor(i / cols);
    cells.push({ g, s, x: c * cw, y: 24 + r * ch });
    const [tris, calls] = triCount(g);
    label(`${s}  ·  ${tris} tris, ${calls} call${calls > 1 ? 's' : ''}`, c * cw + cw / 2, 24 + r * ch + 4);
  });
  scene.updateMatrixWorld(true);
  const h = new THREE.Vector3();
  draw(() => {
    renderer.setClearColor('#20242c'); renderer.setViewport(0, 0, W, H); renderer.setScissor(0, 0, W, H); renderer.clear();
    for (const c of cells) {
      for (const o of cells) o.g.visible = o === c;   // only this cell's player, so no one stands behind him
      c.g.userData.head.getWorldPosition(h); h.z += .03;
      cam.aspect = cw / ch; cam.fov = n === 1 ? 24 : 28; cam.position.copy(h).addScaledVector(d, .95); cam.lookAt(h); cam.updateProjectionMatrix();
      renderer.setViewport(c.x, H - c.y - ch, cw, ch); renderer.setScissor(c.x, H - c.y - ch, cw, ch);
      renderer.setClearColor(night ? '#141a2c' : '#2b313b'); renderer.clear(); renderer.render(scene, cam);
    }
  });
}
function draw(f) { let k = 0; const loop = () => { f(); if (++k < 4) requestAnimationFrame(loop); }; loop(); }
</script>
</body>
</html>
