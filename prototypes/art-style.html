<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soccer IQ Art Lab</title>
<style>
:root{--bg:#0e1116;--text:#e8ecf1;--muted:#8a94a3;--gold:#ffd23f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,sans-serif}
header{padding:20px 16px 0;max-width:1060px;margin:0 auto}
h1{font-size:20px;margin:0 0 4px}
h2{font-size:16px;margin:0 0 12px}
header p,.note{margin:0;color:var(--muted)}
.stage{display:flex;flex-wrap:wrap;gap:28px;justify-content:center;align-items:flex-start;padding:20px 16px;max-width:1060px;margin:0 auto}
.col{display:flex;flex-direction:column;gap:28px;width:min(660px,100%)}
figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:10px;width:100%}
figure.p{width:min(320px,100%)}
figcaption{color:var(--muted);font-size:13px;text-align:center;max-width:340px}
figcaption b{color:var(--text)}
.phone{position:relative;background:#000;border-radius:42px;padding:11px;box-shadow:0 0 0 2px #2a2f38,0 20px 50px rgba(0,0,0,.5);width:100%}
.phone.portrait{aspect-ratio:320/660}
.phone.landscape{aspect-ratio:660/320}
.screen{position:relative;width:100%;height:100%;border-radius:32px;overflow:hidden;background:#2e7d32;touch-action:manipulation;cursor:pointer;user-select:none;-webkit-user-select:none}
.screen canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.portrait .screen::after{content:"";position:absolute;top:9px;left:50%;width:84px;height:24px;margin-left:-42px;background:#000;border-radius:14px}
.landscape .screen::after{content:"";position:absolute;left:9px;top:50%;width:24px;height:84px;margin-top:-42px;background:#000;border-radius:14px}
.hud{position:absolute;inset:0;pointer-events:none;font-weight:800;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.score{position:absolute;top:42px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:7px;background:rgba(10,14,30,.78);padding:5px 10px;border-radius:10px;font-size:13px;white-space:nowrap}
.landscape .score{top:10px}
.badge{width:16px;height:16px;border-radius:50%;display:inline-block;border:2px solid rgba(255,255,255,.8)}
.badge.barca{background:linear-gradient(90deg,#a50044 50%,#004d98 50%)}
.badge.madrid{background:#f4f4f2;border-color:#c9a227}
.ask,.look,.banner{position:absolute;left:50%;transform:translateX(-50%);display:none}
.ask{top:84px;background:#fff;color:#1b2340;text-shadow:none;padding:8px 14px;border-radius:16px;font-size:15px;white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.landscape .ask{top:48px}
.look{bottom:56px;pointer-events:auto;border:0;background:var(--gold);color:#1b2340;text-shadow:none;font:800 16px system-ui;padding:12px 22px;border-radius:999px;align-items:center;gap:8px;box-shadow:0 6px 16px rgba(0,0,0,.35);animation:pulse 1s ease-in-out infinite;cursor:pointer}
.look span{font-size:28px;line-height:1}
.landscape .look{bottom:22px}
.banner{top:42%;font-size:26px;padding:10px 20px;border-radius:16px;white-space:nowrap;animation:pop .35s ease-out}
.banner.goal{background:#17a34a}.banner.stolen{background:#dc2626}.banner.trapped{background:#ea7a0c}
body[data-phase=look] .look,body[data-phase=decide] .ask{display:flex}
body.show-banner .banner{display:block}
@keyframes pulse{50%{transform:translateX(-50%) scale(1.07)}}
@keyframes pop{from{transform:translateX(-50%) scale(.6);opacity:0}}
.gallery{max-width:1060px;margin:0 auto;padding:8px 16px 40px}
.kits{display:flex;flex-wrap:wrap;gap:12px}
.kit{background:#171b22;border-radius:14px;padding:8px 8px 10px;text-align:center;font-size:12px;color:var(--muted);width:128px}
.kit canvas{width:112px;height:130px;display:block;margin:0 auto 4px}
.kit b{color:var(--text);display:block;font-size:13px}
.controls{display:flex;gap:10px;margin-top:10px}
.controls button{background:#232a35;color:var(--text);border:1px solid #333b48;border-radius:10px;padding:7px 12px;font:600 13px system-ui;cursor:pointer}
</style>
</head>
<body data-phase="play">
<header>
  <h1>Soccer IQ: art style lab</h1>
  <p>The same 3v3 moment from three cameras. Tap 👀 to look up, then tap a teammate or the gold arrow. If you wait, it picks for you.</p>
  <div class="controls"><button id="replay">↺ Replay</button><button id="pause">⏸ Pause</button></div>
</header>

<div class="stage">
  <figure class="p">
    <div class="phone portrait"><div class="screen" data-view="behind"><canvas></canvas></div></div>
    <figcaption><b>A. Behind the player, portrait.</b> It starts at his eye level. Looking up lifts the camera so he can see his passes.</figcaption>
  </figure>
  <div class="col">
    <figure>
      <div class="phone landscape"><div class="screen" data-view="behind"><canvas></canvas></div></div>
      <figcaption><b>B. Behind the player, landscape.</b> Same idea with a wider view.</figcaption>
    </figure>
    <figure>
      <div class="phone landscape"><div class="screen" data-view="broadcast"><canvas></canvas></div></div>
      <figcaption><b>C. TV camera.</b> A FIFA-style side view with a radar. Everyone is always visible.</figcaption>
    </figure>
  </div>
</div>

<section class="gallery">
  <h2>Kits: close enough to recognize, with no real logos</h2>
  <div class="kits" id="kits"></div>
</section>

<script>
// ---------- math ----------
const lerp=(a,b,t)=>a+(b-a)*t;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const smooth=t=>{t=clamp(t,0,1);return t*t*(3-2*t)};
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]];
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const norm=a=>{const l=Math.hypot(a[0],a[1],a[2])||1;return[a[0]/l,a[1]/l,a[2]/l]};

// ---------- kits & players ----------
const KITS={
  barca:{label:'Barça',pattern:'stripes',colors:['#a50044','#004d98'],shorts:'#0b2a6b',socks:'#0b2a6b',num:'#f6c344',trim:'#f6c344'},
  madrid:{label:'Real Madrid',pattern:'solid',colors:['#f4f4f2'],shorts:'#f4f4f2',socks:'#f4f4f2',num:'#22306b',trim:'#c9a227'},
  city:{label:'Man City',pattern:'solid',colors:['#7cc0ea'],shorts:'#ffffff',socks:'#7cc0ea',num:'#14213d',trim:'#14213d'},
  psg:{label:'PSG',pattern:'band',colors:['#0e1d40','#d81e2c'],shorts:'#0e1d40',socks:'#0e1d40',num:'#ffffff',trim:'#d81e2c'},
  bayern:{label:'Bayern',pattern:'solid',colors:['#dc052d'],shorts:'#dc052d',socks:'#dc052d',num:'#ffffff',trim:'#ffffff'},
  liverpool:{label:'Liverpool',pattern:'solid',colors:['#c8102e'],shorts:'#c8102e',socks:'#c8102e',num:'#ffffff',trim:'#f6eb61'},
  arsenal:{label:'Arsenal',pattern:'sleeves',colors:['#ef0107','#ffffff'],shorts:'#ffffff',socks:'#ffffff',num:'#ffffff',trim:'#ffffff'},
  atleti:{label:'Atlético',pattern:'stripes',colors:['#cb3524','#ffffff'],shorts:'#1c2c5b',socks:'#cb3524',num:'#1c2c5b',trim:'#1c2c5b'},
  united:{label:'Man United',pattern:'solid',colors:['#da291c'],shorts:'#ffffff',socks:'#111111',num:'#ffffff',trim:'#111111'},
};
const PLAYERS=[
  {id:'hero',name:'YAMAL',num:19,team:'barca',skin:'#b07a52',hair:'#1b1410'},
  {id:'raph',name:'RAPHINHA',num:11,team:'barca',skin:'#a8714b',hair:'#2a1c12'},
  {id:'lewy',name:'LEWANDOWSKI',num:9,team:'barca',skin:'#f0c8a6',hair:'#5a4330'},
  {id:'vini',name:'VINI JR',num:7,team:'madrid',skin:'#6b4429',hair:'#120c08'},
  {id:'bell',name:'BELLINGHAM',num:5,team:'madrid',skin:'#9a6a46',hair:'#1a120c'},
  {id:'mbap',name:'MBAPPÉ',num:10,team:'madrid',skin:'#7a4e30',hair:'#120c08'},
];
const TEAM_DIR={barca:1,madrid:-1};

// ---------- scenario (pitch 36 x 24 m, we attack toward x=36) ----------
const T_PRE=2.6,T_OUT=3.0;
const PRE={tracks:{
  hero:[[0,9,15],[2.6,16,14.5]], raph:[[0,13,6],[2.6,19,4]], lewy:[[0,20,12],[2.6,23.5,11.5]],
  vini:[[0,24,17],[2.6,19,15.2]], bell:[[0,23,11],[2.6,20.5,12.9]], mbap:[[0,30,10],[2.6,27,9]]},
  ball:[{t0:0,t1:99,carry:'hero'}]};
const OUT={
  raph:{event:2.45,result:'goal',say:'GOAL! ⭐⭐⭐',tracks:{
    hero:[[0,16,14.5],[3,24,13]], raph:[[0,19,4],[0.8,19.4,4.3],[2.0,28,8]], lewy:[[0,23.5,11.5],[3,29,14]],
    vini:[[0,19,15.2],[3,22,11]], bell:[[0,20.5,12.9],[3,25.5,8]], mbap:[[0,27,9],[2.0,30.5,9.5]]},
    ball:[{t0:0,t1:0.8,fly:[16.5,14.4,19.4,4.7],arc:0.4},{t0:0.8,t1:2.0,carry:'raph'},
          {t0:2.0,t1:2.45,fly:[28.5,8.2,36.2,11.4],arc:0.7},{t0:2.45,t1:3.2,fly:[36.2,11.4,36.9,11.6],arc:0}]},
  lewy:{event:0.45,result:'stolen',say:'Stolen! 😮',tracks:{
    hero:[[0,16,14.5],[0.5,16.3,14.4],[3,12,12.5]], raph:[[0,19,4],[3,16,6]], lewy:[[0,23.5,11.5],[3,18.5,10.5]],
    vini:[[0,19,15.2],[0.5,19,15.2],[3,12,15]], bell:[[0,20.5,12.9],[0.45,20.6,13],[3,10.5,10]], mbap:[[0,27,9],[3,22,10]]},
    ball:[{t0:0,t1:0.45,fly:[16.5,14.4,20.1,13],arc:0.1},{t0:0.45,t1:99,carry:'bell'}]},
  drib:{event:1.1,result:'trapped',say:'Trapped! 😬',tracks:{
    hero:[[0,16,14.5],[1.1,18.3,14.3],[3,17.6,14.8]], raph:[[0,19,4],[3,21.5,4.2]], lewy:[[0,23.5,11.5],[3,24,11.5]],
    vini:[[0,19,15.2],[1.1,18.9,14.7],[3,12,15.5]], bell:[[0,20.5,12.9],[1.1,19.3,13.8],[3,19,14]], mbap:[[0,27,9],[3,25,10]]},
    ball:[{t0:0,t1:1.1,carry:'hero'},{t0:1.1,t1:99,carry:'vini'}]},
};

function track(keys,t){
  if(t<=keys[0][0]) return[keys[0][1],keys[0][2]];
  for(let i=1;i<keys.length;i++){
    if(t<=keys[i][0]){const[t0,x0,y0]=keys[i-1],[t1,x1,y1]=keys[i];const u=smooth((t-t0)/(t1-t0||1));return[lerp(x0,x1,u),lerp(y0,y1,u)]}
  }
  const k=keys[keys.length-1];return[k[1],k[2]];
}

// ---------- game state ----------
const S={phase:'play',pt:0,crane:0,choice:null,auto:0,time:0,paused:false,banner:false};
const AUTO=['raph','lewy','drib'];
const bannerEls=[];
function setPhase(p){S.phase=p;S.pt=0;document.body.dataset.phase=p}
function reset(){setPhase('play');S.crane=0;S.choice=null;showBanner(false);views.forEach(v=>v.focus=null)}
function doLook(){if(S.phase==='look')setPhase('crane')}
function choose(id){if(S.phase!=='decide')return;S.choice=id;setPhase('outcome')}
function showBanner(on){
  S.banner=on;document.body.classList.toggle('show-banner',on);
  if(on){const o=OUT[S.choice];bannerEls.forEach(b=>{b.className='banner '+o.result;b.textContent=o.say;b.style.animation='none';b.offsetWidth;b.style.animation=''})}
}
function update(dt){
  if(S.paused)return;
  S.time+=dt;S.pt+=dt;
  switch(S.phase){
    case'play':if(S.pt>=T_PRE)setPhase('look');break;
    case'look':if(S.pt>2.2)doLook();break;
    case'crane':S.crane=Math.min(1,S.crane+dt/0.8);if(S.crane>=1)setPhase('decide');break;
    case'decide':if(S.pt>3.2)choose(AUTO[S.auto++%AUTO.length]);break;
    case'outcome':if(!S.banner&&S.pt>=OUT[S.choice].event)showBanner(true);if(S.pt>=T_OUT)setPhase('result');break;
    case'result':if(S.pt>1.6)reset();break;
  }
}

function snapshot(){
  let src=PRE,t=T_PRE;
  if(S.phase==='play')t=S.pt;
  else if(S.phase==='outcome'||S.phase==='result'){src=OUT[S.choice];t=Math.min(S.phase==='outcome'?S.pt:T_OUT,T_OUT)}
  const P={};
  for(const p of PLAYERS){
    const k=src.tracks[p.id];const pos=track(k,t),a=track(k,t-0.05),b=track(k,t+0.05);
    const vx=(b[0]-a[0])/0.1,vy=(b[1]-a[1])/0.1,sp=Math.hypot(vx,vy);
    P[p.id]={x:pos[0],y:pos[1],sp,face:sp>0.5?[vx/sp,vy/sp]:null};
  }
  const seg=src.ball.find(s=>t>=s.t0&&t<s.t1)||src.ball[src.ball.length-1];
  let ball;
  if(seg.carry){
    const c=P[seg.carry];const f=c.face||[TEAM_DIR[PLAYERS.find(p=>p.id===seg.carry).team],0];c.face=f;
    const wob=0.55+0.12*Math.sin(S.time*14)*Math.min(1,c.sp/3);
    ball={x:c.x+f[0]*wob,y:c.y+f[1]*wob,z:0};
  }else{
    const[x0,y0,x1,y1]=seg.fly;const u=clamp((t-seg.t0)/(seg.t1-seg.t0),0,1),e=1-Math.pow(1-u,1.6);
    ball={x:lerp(x0,x1,e),y:lerp(y0,y1,e),z:seg.arc*4*u*(1-u)};
  }
  for(const id in P){const p=P[id];if(!p.face){const dx=ball.x-p.x,dy=ball.y-p.y,l=Math.hypot(dx,dy)||1;p.face=[dx/l,dy/l]}}
  return{P,ball};
}

// ---------- 3D camera ----------
const NEAR=0.3;
function makeCam(eye,target,F,W,H){const f=norm(sub(target,eye)),r=norm(cross(f,[0,0,1])),u=cross(r,f);return{eye,f,r,u,F,W,H}}
function toCam(c,p){const d=sub(p,c.eye);return[dot(d,c.r),dot(d,c.u),dot(d,c.f)]}
function scr(c,q){return[c.W/2+c.F*q[0]/q[2],c.H/2-c.F*q[1]/q[2]]}
function project(c,p){const q=toCam(c,p);return q[2]<NEAR?null:[...scr(c,q),q[2]]}
function clipPoly(qs){
  const out=[];
  for(let i=0;i<qs.length;i++){
    const a=qs[i],b=qs[(i+1)%qs.length],ai=a[2]>=NEAR,bi=b[2]>=NEAR;
    if(ai)out.push(a);
    if(ai!==bi){const t=(NEAR-a[2])/(b[2]-a[2]);out.push([lerp(a[0],b[0],t),lerp(a[1],b[1],t),NEAR])}
  }
  return out;
}
function poly(ctx,c,pts,fill){
  const q=clipPoly(pts.map(p=>toCam(c,p)));if(q.length<3)return;
  ctx.beginPath();q.forEach((p,i)=>{const s=scr(c,p);i?ctx.lineTo(s[0],s[1]):ctx.moveTo(s[0],s[1])});ctx.closePath();
  ctx.fillStyle=fill;ctx.fill();
}
function groundLine(ctx,c,a,b,w=0.14,fill='rgba(255,255,255,.92)'){
  const dx=b[0]-a[0],dy=b[1]-a[1],l=Math.hypot(dx,dy),nx=-dy/l*w/2,ny=dx/l*w/2;
  poly(ctx,c,[[a[0]+nx,a[1]+ny,0.01],[b[0]+nx,b[1]+ny,0.01],[b[0]-nx,b[1]-ny,0.01],[a[0]-nx,a[1]-ny,0.01]],fill);
}
function line3(ctx,c,a,b,wm,color){
  let qa=toCam(c,a),qb=toCam(c,b);
  if(qa[2]<NEAR&&qb[2]<NEAR)return;
  if(qa[2]<NEAR){const t=(NEAR-qa[2])/(qb[2]-qa[2]);qa=qa.map((v,i)=>lerp(v,qb[i],t))}
  if(qb[2]<NEAR){const t=(NEAR-qb[2])/(qa[2]-qb[2]);qb=qb.map((v,i)=>lerp(v,qa[i],t))}
  const sa=scr(c,qa),sb=scr(c,qb);
  ctx.strokeStyle=color;ctx.lineCap='round';ctx.lineWidth=Math.max(1.5,c.F*wm/((qa[2]+qb[2])/2));
  ctx.beginPath();ctx.moveTo(sa[0],sa[1]);ctx.lineTo(sb[0],sb[1]);ctx.stroke();
}

// ---------- world drawing ----------
let crowd;
function crowdPattern(ctx){
  if(crowd)return crowd;
  const cv=document.createElement('canvas');cv.width=cv.height=48;const g=cv.getContext('2d');
  g.fillStyle='#2a2f3d';g.fillRect(0,0,48,48);
  const cols=['#a50044','#004d98','#f4f4f2','#f6c344','#d8d8d8','#6b7280','#e11d48'];
  for(let i=0;i<70;i++){g.fillStyle=cols[i%cols.length];g.globalAlpha=.55+Math.random()*.4;g.beginPath();g.arc(Math.random()*48,Math.random()*48,1.2+Math.random()*1.3,0,7);g.fill()}
  return crowd=ctx.createPattern(cv,'repeat');
}
const WALLS=[{a:[42,-6],b:[42,30],o:[1,0]},{a:[-6,30],b:[-6,-6],o:[-1,0]},{a:[42,30],b:[-6,30],o:[0,1]},{a:[-6,-6],b:[42,-6],o:[0,-1]}];
const ADS=['#1e88e5','#fdd835','#ffffff','#e53935','#00a86b'];
function drawWalls(ctx,c){
  const vis=WALLS.filter(w=>(c.eye[0]-w.a[0])*w.o[0]+(c.eye[1]-w.a[1])*w.o[1]<0)
    .map(w=>({...w,d:Math.hypot((w.a[0]+w.b[0])/2-c.eye[0],(w.a[1]+w.b[1])/2-c.eye[1])})).sort((x,y)=>y.d-x.d);
  for(const w of vis){
    const N=8;
    for(let i=0;i<N;i++){
      const p0=[lerp(w.a[0],w.b[0],i/N),lerp(w.a[1],w.b[1],i/N)],p1=[lerp(w.a[0],w.b[0],(i+1)/N),lerp(w.a[1],w.b[1],(i+1)/N)];
      poly(ctx,c,[[...p0,0],[...p1,0],[...p1,0.9],[...p0,0.9]],ADS[i%ADS.length]);
    }
    const o=w.o,A=w.a,B=w.b;
    poly(ctx,c,[[...A,0.9],[...B,0.9],[B[0]+o[0]*9,B[1]+o[1]*9,8],[A[0]+o[0]*9,A[1]+o[1]*9,8]],crowdPattern(ctx));
    poly(ctx,c,[[A[0]+o[0]*9,A[1]+o[1]*9,8],[B[0]+o[0]*9,B[1]+o[1]*9,8],[B[0]+o[0]*9,B[1]+o[1]*9,9.5],[A[0]+o[0]*9,A[1]+o[1]*9,9.5]],'#1b1f2a');
  }
}
function drawPitch(ctx,c){
  const g=ctx.createLinearGradient(0,0,0,c.H);g.addColorStop(0,'#5fb2ef');g.addColorStop(1,'#cfe9fb');
  ctx.fillStyle=g;ctx.fillRect(0,0,c.W,c.H);
  poly(ctx,c,[[-6,-6,0],[42,-6,0],[42,30,0],[-6,30,0]],'#2f8034');
  for(let i=0;i<12;i++)poly(ctx,c,[[i*3,0,0],[i*3+3,0,0],[i*3+3,24,0],[i*3,24,0]],i%2?'#4caf50':'#43a047');
  const L=(a,b)=>groundLine(ctx,c,a,b);
  L([0,0],[36,0]);L([36,0],[36,24]);L([36,24],[0,24]);L([0,24],[0,0]);L([18,0],[18,24]);
  for(const gx of[0,36]){const d=gx?-1:1;L([gx,8],[gx+4*d,8]);L([gx+4*d,8],[gx+4*d,16]);L([gx+4*d,16],[gx,16])}
  for(let i=0;i<32;i++){const a=i/32*Math.PI*2,b=(i+1)/32*Math.PI*2;L([18+3*Math.cos(a),12+3*Math.sin(a)],[18+3*Math.cos(b),12+3*Math.sin(b)])}
  drawWalls(ctx,c);
}
function drawGoal(ctx,c,gx,dir){
  const y0=9.5,y1=14.5,h=1.8,bx=gx+1.3*dir,net='rgba(255,255,255,.22)';
  poly(ctx,c,[[bx,y0,0],[bx,y1,0],[bx,y1,h*.7],[bx,y0,h*.7]],net);
  poly(ctx,c,[[gx,y0,h],[gx,y1,h],[bx,y1,h*.7],[bx,y0,h*.7]],net);
  poly(ctx,c,[[gx,y0,0],[bx,y0,0],[bx,y0,h*.7],[gx,y0,h]],net);
  poly(ctx,c,[[gx,y1,0],[bx,y1,0],[bx,y1,h*.7],[gx,y1,h]],net);
  for(const[a,b]of[[[gx,y0,0],[gx,y0,h]],[[gx,y1,0],[gx,y1,h]],[[gx,y0,h],[gx,y1,h]]])line3(ctx,c,a,b,0.12,'#fff');
}

// ---------- sprites ----------
function seg(ctx,x1,y1,x2,y2,w,col){ctx.strokeStyle=col;ctx.lineWidth=w;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}
function drawPlayer(ctx,x,y,h,p,kit,back,swing,o={}){
  const u=h/110,body=kit.colors[0];
  ctx.fillStyle='rgba(0,0,0,.28)';ctx.beginPath();ctx.ellipse(x,y,20*u,5.5*u,0,0,7);ctx.fill();
  if(o.ring){ctx.strokeStyle=o.ring;ctx.lineWidth=Math.max(2.5,3.5*u);ctx.beginPath();ctx.ellipse(x,y,27*u*(o.ringScale||1),8.5*u*(o.ringScale||1),0,0,7);ctx.stroke()}
  const hipY=y-36*u-Math.abs(swing)*2*u;
  for(const s of[-1,1]){
    const a=swing*0.55*s,hx=x+s*6*u,fx=hx+Math.sin(a)*34*u,fy=hipY+Math.cos(a)*34*u;
    seg(ctx,hx,hipY,fx,fy,8*u,p.skin);
    seg(ctx,lerp(hx,fx,.45),lerp(hipY,fy,.45),fx,fy-2*u,9*u,kit.socks);
    ctx.fillStyle=o.boots||'#15171c';ctx.beginPath();ctx.ellipse(fx,fy,6*u,3.6*u,0,0,7);ctx.fill();
  }
  ctx.fillStyle=kit.shorts;ctx.beginPath();ctx.roundRect(x-16*u,hipY-12*u,32*u,16*u,4*u);ctx.fill();
  const sleeve=kit.pattern==='sleeves'?kit.colors[1]:body;
  for(const s of[-1,1]){
    const a=-swing*0.6*s,sx=x+s*15*u,sy=hipY-34*u,ex=sx+s*5*u+Math.sin(a)*22*u,ey=sy+Math.cos(a)*22*u;
    seg(ctx,sx,sy,ex,ey,8*u,p.skin);seg(ctx,sx,sy,lerp(sx,ex,.42),lerp(sy,ey,.42),10*u,sleeve);
  }
  const tx=x-17*u,ty=hipY-40*u,tw=34*u,th=31*u;
  ctx.save();ctx.beginPath();ctx.roundRect(tx,ty,tw,th,7*u);ctx.clip();
  ctx.fillStyle=body;ctx.fillRect(tx,ty,tw,th);
  if(kit.pattern==='stripes'){ctx.fillStyle=kit.colors[1];for(let i=1;i<5;i+=2)ctx.fillRect(tx+i*tw/5,ty,tw/5,th)}
  if(kit.pattern==='band'){ctx.fillStyle='#fff';ctx.fillRect(x-6*u,ty,12*u,th);ctx.fillStyle=kit.colors[1];ctx.fillRect(x-4*u,ty,8*u,th)}
  ctx.restore();
  ctx.fillStyle=p.skin;ctx.fillRect(x-4*u,ty-5*u,8*u,7*u);
  seg(ctx,x-6*u,ty+1*u,x+6*u,ty+1*u,2.4*u,kit.trim);
  if(back&&u>0.32){
    ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineJoin='round';
    ctx.font=`900 ${15*u}px system-ui,sans-serif`;ctx.lineWidth=2.4*u;ctx.strokeStyle='rgba(0,0,0,.45)';
    ctx.strokeText(p.num,x,ty+19*u);ctx.fillStyle=kit.num;ctx.fillText(p.num,x,ty+19*u);
    ctx.font=`800 ${Math.min(6*u,52*u/p.name.length*1.7)}px system-ui,sans-serif`;ctx.lineWidth=1.6*u;
    ctx.strokeText(p.name,x,ty+7*u);ctx.fillText(p.name,x,ty+7*u);
  }else if(!back){ctx.fillStyle=kit.trim;ctx.beginPath();ctx.arc(x+7*u,ty+9*u,2.6*u,0,7);ctx.fill()}
  const hy=ty-19*u,r=17*u;
  ctx.fillStyle=p.skin;
  ctx.beginPath();ctx.arc(x-r,hy+2*u,3.5*u,0,7);ctx.arc(x+r,hy+2*u,3.5*u,0,7);ctx.fill();
  ctx.beginPath();ctx.arc(x,hy,r,0,7);ctx.fill();
  ctx.fillStyle=p.hair;ctx.beginPath();
  if(back)ctx.arc(x,hy,r*1.04,Math.PI*0.82,Math.PI*2.18);else ctx.arc(x,hy-2.5*u,r*1.04,Math.PI*1.04,Math.PI*1.96);
  ctx.fill();
  if(!back){
    ctx.fillStyle='#1d1410';ctx.beginPath();ctx.arc(x-6*u,hy+2*u,2.3*u,0,7);ctx.arc(x+6*u,hy+2*u,2.3*u,0,7);ctx.fill();
    ctx.strokeStyle='#5a2a1c';ctx.lineWidth=1.6*u;ctx.beginPath();ctx.arc(x,hy+6*u,4.5*u,Math.PI*.2,Math.PI*.8);ctx.stroke();
  }
  if(o.marker){
    const my=hy-r-10*u-Math.abs(Math.sin(S.time*4))*5*u,m=Math.max(7,8*u);
    ctx.fillStyle='#ffd23f';ctx.strokeStyle='#1b2340';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(x-m,my-m*1.1);ctx.lineTo(x+m,my-m*1.1);ctx.lineTo(x,my+m*.4);ctx.closePath();ctx.fill();ctx.stroke();
  }
  return{top:hy-r};
}
function drawBall(ctx,x,y,r){
  ctx.fillStyle='#fff';ctx.strokeStyle='#222';ctx.lineWidth=Math.max(1,r*.12);
  ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();ctx.stroke();
  ctx.fillStyle='#222';const a=S.time*3;
  ctx.beginPath();ctx.arc(x+Math.cos(a)*r*.25,y+Math.sin(a)*r*.25,r*.32,0,7);ctx.fill();
  for(let i=0;i<5;i++){const b=a+i*1.2566;ctx.beginPath();ctx.arc(x+Math.cos(b)*r*.78,y+Math.sin(b)*r*.78,r*.14,0,7);ctx.fill()}
}
function bubble(ctx,x,y,r,emoji){
  ctx.fillStyle='#fff';ctx.strokeStyle='#ffd23f';ctx.lineWidth=3;
  ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();ctx.stroke();
  ctx.font=`${r*1.15}px system-ui`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(emoji,x,y+1);
}

// ---------- views ----------
const views=[...document.querySelectorAll('.screen')].map(el=>{
  const hud=document.createElement('div');hud.className='hud';
  hud.innerHTML=`<div class="score"><span class="badge barca"></span>BAR <span class="sc">0 – 0</span> RMA<span class="badge madrid"></span></div>
    <button class="look"><span>👀</span>Look up!</button><div class="ask">What should Yamal do?</div><div class="banner"></div>`;
  el.appendChild(hud);bannerEls.push(hud.querySelector('.banner'));
  hud.querySelector('.look').addEventListener('pointerdown',e=>{e.stopPropagation();doLook()});
  const v={el,kind:el.dataset.view,canvas:el.querySelector('canvas'),focus:null,hits:[],sc:hud.querySelector('.sc')};
  v.ctx=v.canvas.getContext('2d');
  el.addEventListener('pointerdown',e=>{
    if(S.phase==='look'){doLook();return}
    if(S.phase!=='decide')return;
    const r=el.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
    let best=null,bd=1e9;for(const h of v.hits){const d=Math.hypot(h.x-x,h.y-y);if(d<h.r&&d<bd){bd=d;best=h}}
    if(best)choose(best.id);
  });
  return v;
});

function camFor(v,W,H,snap){
  const[fx,fy]=v.focus;
  if(v.kind==='broadcast'){const cx=clamp(fx,10,26);return makeCam([cx,-14,11],[cx,12,0],H*1.55,W,H)}
  // Looking up centers the camera on our whole team so every pass option is on screen.
  const mates=PLAYERS.filter(p=>p.team==='barca'),teamY=mates.reduce((s,p)=>s+snap.P[p.id].y,0)/mates.length;
  const k=smooth(S.crane),ey=lerp(lerp(fy,12,.3),lerp(fy,teamY,.85),k);
  return makeCam([lerp(fx-5,fx-7,k),ey,lerp(2.2,10,k)],[lerp(fx+8,fx+6,k),ey,lerp(.5,0,k)],Math.min(W,H)*lerp(.95,.85,k),W,H);
}

function render(v,snap,dt){
  const cv=v.canvas,dpr=Math.min(devicePixelRatio||1,2),W=cv.clientWidth,H=cv.clientHeight;
  if(cv.width!==Math.round(W*dpr)||cv.height!==Math.round(H*dpr)){cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr)}
  const ctx=v.ctx;ctx.setTransform(dpr,0,0,dpr,0,0);
  const following=S.phase==='outcome'||S.phase==='result';
  const tgt=following?[snap.ball.x,snap.ball.y]:[snap.P.hero.x,snap.P.hero.y];
  if(!v.focus)v.focus=tgt.slice();else{const k=1-Math.exp(-dt*3);v.focus[0]=lerp(v.focus[0],tgt[0],k);v.focus[1]=lerp(v.focus[1],tgt[1],k)}
  const c=camFor(v,W,H,snap);
  drawPitch(ctx,c);

  const deciding=S.phase==='decide';v.hits=[];
  const pulse=1+0.12*Math.sin(S.time*6);
  if(deciding){
    const h=snap.P.hero,a=0.55+0.3*Math.sin(S.time*6),col=`rgba(255,210,63,${a})`;
    poly(ctx,c,[[h.x+1,h.y-.35,.02],[h.x+3.3,h.y-.35,.02],[h.x+3.3,h.y+.35,.02],[h.x+1,h.y+.35,.02]],col);
    poly(ctx,c,[[h.x+3.3,h.y-.9,.02],[h.x+4.6,h.y,.02],[h.x+3.3,h.y+.9,.02]],col);
    const tip=project(c,[h.x+4,h.y,0]);if(tip)v.hits.push({id:'drib',x:tip[0],y:tip[1],r:40,emoji:'💨'});
  }

  const objs=[];
  for(const p of PLAYERS){const s=snap.P[p.id],q=project(c,[s.x,s.y,0]);if(q)objs.push({z:q[2],draw:()=>{
    const h=c.F*1.6/q[2],kit=KITS[p.team];
    const back=s.face[0]*c.f[0]+s.face[1]*c.f[1]>0;
    const swing=Math.sin(S.time*11+p.num)*clamp(s.sp/4,0,1);
    const opt=deciding&&(p.id==='raph'||p.id==='lewy');
    const r=drawPlayer(ctx,q[0],q[1],h,p,kit,back,swing,{ring:p.id==='hero'?'#ffd23f':opt?'rgba(255,255,255,.95)':null,ringScale:opt?pulse:1,marker:p.id==='hero',boots:p.id==='hero'?'#f59e0b':null});
    if(opt){const br=Math.max(13,h*.13),by=r.top-br-8;bubble(ctx,q[0],by,br,'⚽');v.hits.push({id:p.id,x:q[0],y:q[1]-h*.45,r:Math.max(36,h*.6)})}
  }})}
  const b=snap.ball,bq=project(c,[b.x,b.y,b.z+0.22]),bs=project(c,[b.x,b.y,0]);
  if(bq&&bs)objs.push({z:bq[2]-0.05,draw:()=>{const r=c.F*0.22/bq[2];ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(bs[0],bs[1],r,r*.35,0,0,7);ctx.fill();drawBall(ctx,bq[0],bq[1],r)}});
  for(const[gx,d]of[[36,1],[0,-1]]){const q=project(c,[gx,12,0]);if(q)objs.push({z:q[2],draw:()=>drawGoal(ctx,c,gx,d)})}
  objs.sort((a,b)=>b.z-a.z).forEach(o=>o.draw());
  for(const h of v.hits)if(h.emoji)bubble(ctx,h.x,h.y-30,15,h.emoji);

  if(v.kind==='broadcast')radar(ctx,snap,W,H);
  v.sc.textContent=S.banner&&OUT[S.choice].result==='goal'?'1 – 0':'0 – 0';
}

function radar(ctx,snap,W,H){
  const s=3.1,w=36*s,h=24*s,x0=(W-w)/2,y0=H-h-12;
  ctx.fillStyle='rgba(10,30,15,.65)';ctx.strokeStyle='rgba(255,255,255,.7)';ctx.lineWidth=1;
  ctx.beginPath();ctx.roundRect(x0,y0,w,h,6);ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.moveTo(x0+w/2,y0);ctx.lineTo(x0+w/2,y0+h);ctx.stroke();
  for(const p of PLAYERS){const q=snap.P[p.id];ctx.fillStyle=p.team==='barca'?(p.id==='hero'?'#ffd23f':'#e0245e'):'#ffffff';
    ctx.beginPath();ctx.arc(x0+q.x*s,y0+(24-q.y)*s,p.id==='hero'?4.5:3.5,0,7);ctx.fill()}
  ctx.fillStyle='#111';ctx.beginPath();ctx.arc(x0+snap.ball.x*s,y0+(24-snap.ball.y)*s,2,0,7);ctx.fill();
}

// ---------- kit gallery ----------
const STARS={barca:['YAMAL',19],madrid:['VINI JR',7],city:['HAALAND',9],psg:['DEMBÉLÉ',10],bayern:['KANE',9],liverpool:['SALAH',11],arsenal:['SAKA',7],atleti:['JULIÁN',19],united:['BRUNO',8]};
const kitWrap=document.getElementById('kits');
for(const id in KITS){
  const d=document.createElement('div');d.className='kit';
  const[name,num]=STARS[id];d.innerHTML=`<canvas></canvas><b>${KITS[id].label}</b>${name[0]+name.slice(1).toLowerCase()} ${num}`;
  kitWrap.appendChild(d);
  const cv=d.querySelector('canvas'),dpr=Math.min(devicePixelRatio||1,2);cv.width=112*dpr;cv.height=130*dpr;
  const g=cv.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);
  const p={name,num,skin:['#b07a52','#7a4e30','#f0c8a6','#9a6a46'][num%4],hair:'#1b1410'};
  drawPlayer(g,32,122,108,p,KITS[id],false,0);drawPlayer(g,82,122,108,p,KITS[id],true,0);
}

// ---------- loop ----------
document.getElementById('replay').onclick=()=>{S.paused=false;document.getElementById('pause').textContent='⏸ Pause';reset()};
document.getElementById('pause').onclick=e=>{S.paused=!S.paused;e.target.textContent=S.paused?'▶ Play':'⏸ Pause'};
let last=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  update(dt);const snap=snapshot();views.forEach(v=>render(v,snap,S.paused?0:dt));
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
