<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soccer IQ Art Styles 3</title>
<style>
:root{--bg:#0e1116;--text:#e8ecf1;--muted:#8a94a3;--gold:#ffd23f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,sans-serif}
header{padding:20px 16px 0;max-width:1400px;margin:0 auto}
h1{font-size:20px;margin:0 0 4px}
header p{margin:0;color:var(--muted);max-width:900px}
.controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
.controls .lbl{color:var(--muted);font-size:13px;margin-left:6px}
.controls button{background:#232a35;color:var(--text);border:1px solid #333b48;border-radius:10px;padding:7px 12px;font:600 13px system-ui;cursor:pointer}
.controls button.on{background:var(--gold);color:#1b2340;border-color:var(--gold)}
h2{max-width:1400px;margin:18px auto 0;padding:0 16px;font-size:15px;color:var(--muted);font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,520px),1fr));gap:28px;padding:14px 16px 20px;max-width:1400px;margin:0 auto}
figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:8px}
figcaption{color:var(--muted);font-size:13px;text-align:center;max-width:520px}
figcaption b{color:var(--text)}
.phone{position:relative;background:#000;border-radius:38px;padding:10px;box-shadow:0 0 0 2px #2a2f38,0 20px 50px rgba(0,0,0,.5);width:100%;aspect-ratio:660/320}
.screen{position:relative;width:100%;height:100%;border-radius:29px;overflow:hidden;background:#2e7d32;touch-action:none;user-select:none;-webkit-user-select:none}
.screen canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.screen[data-style=pixel] canvas{image-rendering:pixelated}
.screen[data-style=hd2d] .hud::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 55%,rgba(255,240,200,0) 55%,rgba(40,20,60,.35) 100%)}
.screen::after{content:"";position:absolute;left:8px;top:50%;width:22px;height:78px;margin-top:-39px;background:#000;border-radius:12px}
.hud{position:absolute;inset:0;pointer-events:none;color:#fff;font-family:system-ui,sans-serif}
.score{position:absolute;top:9px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:7px;background:rgba(10,14,30,.78);padding:4px 10px;border-radius:10px;font:800 12px system-ui;white-space:nowrap}
.badge{width:14px;height:14px;border-radius:50%;display:inline-block;border:2px solid rgba(255,255,255,.8)}
.badge.barca{background:linear-gradient(90deg,#a50044 50%,#004d98 50%)}
.badge.madrid{background:#f4f4f2;border-color:#c9a227}
.prompt{position:absolute;top:40px;left:50%;transform:translateX(-50%);background:#fff;color:#1b2340;padding:6px 13px;border-radius:14px;font:800 13px system-ui;white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.prompt:empty{display:none}
.toast{position:absolute;top:42%;left:50%;transform:translateX(-50%);background:#17a34a;color:#fff;padding:8px 18px;border-radius:16px;font:900 20px system-ui;white-space:nowrap;box-shadow:0 6px 18px rgba(0,0,0,.35);display:none}
.toast.warn{background:#ea7a0c}
body.toasting .toast{display:block}
/* chunky game buttons */
.gbtn{position:absolute;pointer-events:auto;border:0;border-radius:50%;width:66px;height:66px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer;
  color:#fff;font:900 10px system-ui;letter-spacing:.06em;text-shadow:0 1px 0 rgba(0,0,0,.35);
  box-shadow:inset 0 3px 0 rgba(255,255,255,.35),inset 0 -6px 0 rgba(0,0,0,.25),0 5px 0 var(--edge),0 9px 14px rgba(0,0,0,.35);
  transition:transform .06s,box-shadow .06s;touch-action:none}
.gbtn i{font-style:normal;font-size:26px;line-height:1;text-shadow:none}
.gbtn:active,.gbtn.held{transform:translateY(4px);box-shadow:inset 0 3px 0 rgba(255,255,255,.3),inset 0 -3px 0 rgba(0,0,0,.25),0 1px 0 var(--edge),0 3px 6px rgba(0,0,0,.35)}
.gbtn.eye{left:40px;bottom:16px;background:radial-gradient(circle at 50% 35%,#ffe680,#f5b800);--edge:#a87400;color:#4a3300;text-shadow:none}
.gbtn.pass{right:96px;bottom:16px;background:radial-gradient(circle at 50% 35%,#6aa8ff,#1e63e6);--edge:#123f99}
.gbtn.drib{right:18px;bottom:34px;background:radial-gradient(circle at 50% 35%,#6ee08a,#16a34a);--edge:#0d6b30}
.gbtn.back{right:18px;bottom:16px;width:44px;height:44px;background:radial-gradient(circle at 50% 35%,#9aa3b2,#5b6575);--edge:#353c48}
.gbtn.back i{font-size:18px}
.pass,.drib,.back{display:none!important}
body.decide.mode-none .pass,body.decide.mode-none .drib,body.mode-pass .back,body.mode-dribble .back{display:flex!important}
body.closeup .gbtn,body.closeup.decide.mode-none .gbtn,body.closeup .prompt{display:none!important}
.err{position:absolute;inset:0;display:grid;place-items:center;background:#1d2530;color:var(--muted);font-weight:600}
</style>
</head>
<body class="mode-none">
<header>
  <h1>Soccer IQ: art styles, round 3</h1>
  <p>Every style is based on a real game. <b>Hold 👀 or the field and drag</b> to look around: you can only pass to teammates you've seen. Then tap <b>PASS</b> or <b>DRIBBLE</b>, then pick where.</p>
  <div class="controls">
    <button id="demo" class="on">▶ Auto demo</button><button id="replay">↺ Replay</button><button id="closeBtn">🔍 Meet the players</button>
    <span class="lbl">Background</span>
    <button data-env="park" class="on">Park</button><button data-env="empty">Empty stadium</button><button data-env="crowd">Small crowd</button>
  </div>
</header>

<h2>3D</h2>
<div class="grid">
  <figure><div class="phone"><div class="screen" data-style="ww"><canvas></canvas></div></div><figcaption><b>1. Wind Waker.</b> Hard two-tone shading, bright sky, puffy clouds, big painted eyes.</figcaption></figure>
  <figure><div class="phone"><div class="screen" data-style="ac"><canvas></canvas></div></div><figcaption><b>2. Animal Crossing.</b> Soft matte toys, big round heads, dot eyes, rosy cheeks, flowers in the grass.</figcaption></figure>
  <figure><div class="phone"><div class="screen" data-style="strikers"><canvas></canvas></div></div><figcaption><b>3. Mario Strikers.</b> Chunky hero bodies, big boots, a night arena with an electric fence and rim light.</figcaption></figure>
  <figure><div class="phone"><div class="screen" data-style="fifa"><canvas></canvas></div></div><figcaption><b>4. FIFA-inspired.</b> Real body proportions, small heads, a mown grass pattern, afternoon sun.</figcaption></figure>
  <figure><div class="phone"><div class="screen" data-style="lowpoly"><canvas></canvas></div></div><figcaption><b>5. A Short Hike.</b> Low-poly facets in warm evening light (from round 2).</figcaption></figure>
</div>
<h2>2.5D</h2>
<div class="grid">
  <figure><div class="phone"><div class="screen" data-style="paper"><canvas></canvas></div></div><figcaption><b>6. Paper Mario.</b> Flat paper-cutout players with white borders, turning to face you in a 3D craft world.</figcaption></figure>
  <figure><div class="phone"><div class="screen" data-style="hd2d"><canvas></canvas></div></div><figcaption><b>7. Octopath Traveler (HD-2D).</b> Pixel-art sprites in a smooth 3D world (from round 2).</figcaption></figure>
</div>
<h2>2D</h2>
<div class="grid">
  <figure><div class="phone"><div class="screen" data-style="pixel"><canvas></canvas></div></div><figcaption><b>8. Stardew Valley / Eastward.</b> Hand-placed hi-bit pixel art on a 32-color palette (from round 2).</figcaption></figure>
</div>

<script>
// ---------- math ----------
const lerp=(a,b,t)=>a+(b-a)*t;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const smooth=t=>{t=clamp(t,0,1);return t*t*(3-2*t)};
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]];
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const norm=a=>{const l=Math.hypot(a[0],a[1],a[2])||1;return[a[0]/l,a[1]/l,a[2]/l]};
const rot=(x,y,a)=>[x*Math.cos(a)-y*Math.sin(a),x*Math.sin(a)+y*Math.cos(a)];
let seed=7;const rand=()=>(seed=(seed*16807)%2147483647)/2147483647;
const hexRgb=h=>{h=h.replace('#','');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]};
const shadeHex=(h,f)=>{const c=hexRgb(h).map(v=>clamp(Math.round(f<1?v*f:v+(255-v)*(f-1)),0,255));return`rgb(${c[0]},${c[1]},${c[2]})`};

// ---------- kits & players ----------
const KITS={
  barca:{pattern:'stripes',colors:['#a50044','#004d98'],shorts:'#0b2a6b',socks:'#0b2a6b',num:'#f6c344',trim:'#f6c344'},
  madrid:{pattern:'solid',colors:['#f4f4f2'],shorts:'#f4f4f2',socks:'#f4f4f2',num:'#22306b',trim:'#c9a227'},
};
const PLAYERS=[
  {id:'hero',name:'YAMAL',short:'Yamal',num:19,team:'barca',skin:'#b07a52',hair:'#1b1410'},
  {id:'raph',name:'RAPHINHA',short:'Raphinha',num:11,team:'barca',skin:'#a8714b',hair:'#2a1c12'},
  {id:'lewy',name:'LEWANDOWSKI',short:'Lewandowski',num:9,team:'barca',skin:'#f0c8a6',hair:'#5a4330'},
  {id:'vini',name:'VINI JR',short:'Vini',num:7,team:'madrid',skin:'#6b4429',hair:'#120c08'},
  {id:'bell',name:'BELLINGHAM',short:'Bellingham',num:5,team:'madrid',skin:'#9a6a46',hair:'#1a120c'},
  {id:'mbap',name:'MBAPPÉ',short:'Mbappé',num:10,team:'madrid',skin:'#7a4e30',hair:'#120c08'},
];
const MATES=['raph','lewy'];
const DRIB=[{id:'fwd',a:0,label:'Dribble forward!'},{id:'left',a:.6,label:'Dribble left!'},{id:'right',a:-.6,label:'Dribble right!'}];

// ---------- scenario (pitch 36 x 24 m, we attack toward x=36) ----------
const T_PRE=2.6;
const TRACKS={
  hero:[[0,9,15],[2.6,16,14.5]], raph:[[0,13,6],[2.6,19,4]], lewy:[[0,20,12],[2.6,23.5,11.5]],
  vini:[[0,24,17],[2.6,19,15.2]], bell:[[0,23,11],[2.6,20.5,12.9]], mbap:[[0,30,10],[2.6,27,9]]};
function track(keys,t){
  if(t<=keys[0][0])return[keys[0][1],keys[0][2]];
  for(let i=1;i<keys.length;i++)if(t<=keys[i][0]){const[t0,x0,y0]=keys[i-1],[t1,x1,y1]=keys[i];const u=smooth((t-t0)/(t1-t0||1));return[lerp(x0,x1,u),lerp(y0,y1,u)]}
  const k=keys[keys.length-1];return[k[1],k[2]];
}

// ---------- world props ----------
const WALLS=[{a:[42,-6],b:[42,30],o:[1,0]},{a:[-6,30],b:[-6,-6],o:[-1,0]},{a:[42,30],b:[-6,30],o:[0,1]},{a:[-6,-6],b:[42,-6],o:[0,-1]}];
const ROWS=6,rowOff=r=>1.5+r*1.1,rowZ=r=>1.0+r*0.9;
const SHIRTS=['#a50044','#004d98','#f4f4f2','#f6c344','#e11d48','#22306b','#7cc0ea','#f97316'];
const SKINS=['#f0c8a6','#b07a52','#7a4e30','#d9a37a','#5a3a22'];
const SEATS=[];
WALLS.forEach((w,wi)=>{
  const L=Math.hypot(w.b[0]-w.a[0],w.b[1]-w.a[1]),n=Math.floor(L/0.9);
  for(let r=0;r<ROWS;r++)for(let i=0;i<n;i++){const t=(i+.5)/n;
    SEATS.push({wall:wi,r,x:lerp(w.a[0],w.b[0],t)+w.o[0]*rowOff(r),y:lerp(w.a[1],w.b[1],t)+w.o[1]*rowOff(r),z:rowZ(r),
      color:r%2?'#2a62c4':'#1e4fa3',occ:rand()<0.28,shirt:SHIRTS[Math.floor(rand()*SHIRTS.length)],skin:SKINS[Math.floor(rand()*SKINS.length)]})}
});
const TREES=[];
for(let x=-14;x<=50;x+=4.5){TREES.push({x:x+rand()*2,y:-13-rand()*3,s:4+rand()*2.5});TREES.push({x:x+rand()*2,y:37+rand()*3,s:4+rand()*2.5})}
for(let y=-8;y<=32;y+=4.5){TREES.push({x:-16-rand()*3,y:y+rand()*2,s:4+rand()*2.5});TREES.push({x:52+rand()*3,y:y+rand()*2,s:4+rand()*2.5})}
const CLOUDS=[];
for(let i=0;i<10;i++){const a=i/10*Math.PI*2+rand()*.4;CLOUDS.push({x:18+Math.cos(a)*150,y:12+Math.sin(a)*150,z:32+rand()*18,s:12+rand()*8})}

// ---------- pixel-art sprites (24x32, hand-placed pixels) ----------
const DIGITS={0:'111101101101111',1:'010110010010111',2:'111001111100111',3:'111001111001111',4:'101101111001001',5:'111100111001111',6:'111100111101111',7:'111001010010010',8:'111101111101111',9:'111101111001111'};
function finishSprite(g,W,H){
  const im=g.getImageData(0,0,W,H),d=im.data,src=new Uint8ClampedArray(d),a=(x,y)=>x>=0&&y>=0&&x<W&&y<H&&src[(y*W+x)*4+3]>128;
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const i=(y*W+x)*4;
    if(src[i+3]>128){d[i+3]=255;continue}
    if(a(x-1,y)||a(x+1,y)||a(x,y-1)||a(x,y+1)){d[i]=26;d[i+1]=20;d[i+2]=32;d[i+3]=255}else d[i+3]=0}
  g.putImageData(im,0,0);
}
const spriteCache={};
function pixelSprite(p,kit,back,frame){
  const key=p.id+back+frame;if(spriteCache[key])return spriteCache[key];
  const W=24,H=32,cv=document.createElement('canvas');cv.width=W;cv.height=H;const g=cv.getContext('2d');
  const R=(x,y,w,h,c)=>{g.fillStyle=c;g.fillRect(x,y,w,h)};
  const step=[0,1,-1][frame],boots=p.id==='hero'?'#f59e0b':'#262b44';
  for(const[lx,o]of[[8,step],[13,-step]]){const bot=30-Math.max(0,o);R(lx,23,3,2,p.skin);R(lx,25,3,bot-26,kit.socks);R(lx,bot-1,4,2,boots)}
  R(7,20,10,3,kit.shorts);R(16,20,1,3,shadeHex(kit.shorts,.75));
  for(let x=7;x<17;x++){const c=kit.pattern==='stripes'&&((x-7)>>1)%2?kit.colors[1]:kit.colors[0];R(x,12,1,8,x===16?shadeHex(c,.72):x===7?shadeHex(c,1.12):c)}
  R(10,12,4,1,kit.trim);
  for(const[ax,o]of[[5,-step],[17,step]]){R(ax,12,2,2,kit.colors[0]);R(ax,14+o,2,3,p.skin)}
  if(back){const s=String(p.num),w=s.length*4-1;let x0=12-Math.floor(w/2);
    for(const ch of s){const m=DIGITS[ch];for(let i=0;i<15;i++)if(m[i]==='1')R(x0+i%3,14+Math.floor(i/3),1,1,kit.num);x0+=4}}
  else R(14,14,1,1,kit.trim);
  R(11,11,2,1,p.skin);
  for(let y=1;y<12;y++)for(let x=6;x<18;x++){
    if((x-11.5)**2+(y-6)**2>31)continue;
    const hair=back?y<=9:(y<=3||((x<=7||x>=16)&&y<=6));
    R(x,y,1,1,hair?(x<=8&&y<=4?shadeHex(p.hair,1.35):p.hair):(x>=16?shadeHex(p.skin,.85):p.skin));
  }
  if(!back){R(9,6,1,2,'#181425');R(14,6,1,2,'#181425');R(11,9,2,1,shadeHex(p.skin,.7))}
  finishSprite(g,W,H);
  return spriteCache[key]=cv;
}
let treeSprite;
function pixelTree(){
  if(treeSprite)return treeSprite;
  const W=32,H=40,cv=document.createElement('canvas');cv.width=W;cv.height=H;const g=cv.getContext('2d');
  g.fillStyle='#733e39';g.fillRect(14,26,4,13);g.fillStyle='#3e2731';g.fillRect(17,26,1,13);
  for(let y=1;y<30;y++)for(let x=2;x<30;x++){
    const d=((x-16)/13.5)**2+((y-14)/13)**2;if(d>1)continue;
    const l=(x-11)+(y-9),c=l<-4?'#63c74d':l<10?'#3e8948':'#265c42';
    g.fillStyle=(l>-6&&l<-2&&(x+y)%2)?'#3e8948':(l>8&&l<12&&(x+y)%2)?'#265c42':c;g.fillRect(x,y,1,1);
  }
  finishSprite(g,W,H);return treeSprite=cv;
}

// ---------- paper cutouts (Paper Mario) ----------
function paperBorder(src,pad){
  const cv=document.createElement('canvas');cv.width=src.width;cv.height=src.height;const g=cv.getContext('2d');
  for(let i=0;i<16;i++){const a=i/16*Math.PI*2;g.drawImage(src,Math.cos(a)*pad,Math.sin(a)*pad)}
  g.globalCompositeOperation='source-in';g.fillStyle='#fffdf4';g.fillRect(0,0,cv.width,cv.height);
  g.globalCompositeOperation='source-over';g.drawImage(src,0,0);return cv;
}
const paperCache={};
function paperFigure(p,kit,back,frame){
  const key=p.id+back+frame;if(paperCache[key])return paperCache[key];
  const W=256,H=384,cv=document.createElement('canvas');cv.width=W;cv.height=H;const g=cv.getContext('2d');
  const u=3.1,cx=128,foot=370,OL='#2a2238',ow=2.2*u,step=[0,1,-1][frame];
  const limb=(x1,y1,x2,y2,w,c)=>{g.lineCap='round';g.strokeStyle=OL;g.lineWidth=w+ow*2;g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke();g.strokeStyle=c;g.lineWidth=w;g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke()};
  const shape=(f,c)=>{g.beginPath();f();g.fillStyle=c;g.fill();g.strokeStyle=OL;g.lineWidth=ow;g.stroke()};
  const hip=foot-36*u;
  for(const s of[-1,1]){const a=step*.38*s,hx=cx+s*7*u,fx=hx+Math.sin(a)*32*u,fy=hip+Math.cos(a)*32*u;
    limb(hx,hip,fx,fy,9*u,p.skin);limb(lerp(hx,fx,.5),lerp(hip,fy,.5),fx,fy-3*u,10*u,kit.socks);
    shape(()=>g.ellipse(fx+(back?0:2*u),fy,7.5*u,4.5*u,0,0,7),p.id==='hero'?'#f59e0b':'#1d1f26')}
  shape(()=>g.roundRect(cx-17*u,hip-13*u,34*u,17*u,5*u),kit.shorts);
  const ty=hip-42*u;
  for(const s of[-1,1]){const a=-step*.5*s,sx=cx+s*16*u,sy=ty+6*u,ex=sx+s*6*u+Math.sin(a)*20*u,ey=sy+Math.cos(a)*20*u;
    limb(sx,sy,ex,ey,8.5*u,p.skin);limb(sx,sy,lerp(sx,ex,.4),lerp(sy,ey,.4),11*u,kit.colors[0])}
  const tx=cx-18*u,tw=36*u,th=32*u;
  g.save();g.beginPath();g.roundRect(tx,ty,tw,th,8*u);g.clip();g.fillStyle=kit.colors[0];g.fillRect(tx,ty,tw,th);
  if(kit.pattern==='stripes'){g.fillStyle=kit.colors[1];for(let i=1;i<5;i+=2)g.fillRect(tx+i*tw/5,ty,tw/5,th)}
  g.fillStyle='rgba(0,0,0,.12)';g.fillRect(cx+8*u,ty,tw,th);g.restore();
  g.beginPath();g.roundRect(tx,ty,tw,th,8*u);g.strokeStyle=OL;g.lineWidth=ow;g.stroke();
  if(back){g.textAlign='center';g.textBaseline='middle';g.lineJoin='round';g.font=`900 ${17*u}px system-ui`;g.lineWidth=2*u;g.strokeStyle=OL;
    g.strokeText(p.num,cx,ty+20*u);g.fillStyle=kit.num;g.fillText(p.num,cx,ty+20*u);g.font=`800 ${5.5*u}px system-ui`;g.lineWidth=1.2*u;g.strokeText(p.name,cx,ty+7*u,30*u);g.fillText(p.name,cx,ty+7*u,30*u)}
  const hy=ty-18*u,r=19*u;
  shape(()=>g.arc(cx,hy,r,0,7),p.skin);
  g.fillStyle=p.hair;g.beginPath();
  if(back)g.arc(cx,hy,r+1,Math.PI*.8,Math.PI*2.2);else{g.arc(cx,hy-2*u,r+1,Math.PI*1.02,Math.PI*1.98);g.quadraticCurveTo(cx+8*u,hy-10*u,cx-r,hy-4*u)}
  g.fill();g.strokeStyle=OL;g.lineWidth=ow;g.stroke();
  if(!back){for(const s of[-1,1]){g.fillStyle=OL;g.beginPath();g.ellipse(cx+s*7*u,hy+2*u,2.8*u,4.2*u,0,0,7);g.fill();g.fillStyle='#fff';g.beginPath();g.arc(cx+s*7*u-.9*u,hy+.4*u,1.1*u,0,7);g.fill();
      g.fillStyle='rgba(255,110,110,.35)';g.beginPath();g.ellipse(cx+s*12*u,hy+8*u,3.5*u,2*u,0,0,7);g.fill()}
    g.strokeStyle=OL;g.lineWidth=1.6*u;g.beginPath();g.arc(cx,hy+8*u,4*u,.15*Math.PI,.85*Math.PI);g.stroke()}
  return paperCache[key]=paperBorder(cv,7);
}

}

    const spec=camSpec(snap),F=Math.min(W,H)*spec.Ff;
    camera.aspect=W/H;camera.fov=2*Math.atan(H/2/F)*180/Math.PI;camera.updateProjectionMatrix();
    camera.position.set(...spec.eye);camera.lookAt(...spec.tgt);camera.getWorldDirection(camDir);
    const camYaw=Math.atan2(-camDir.y,-camDir.x);
    people.forEach(g=>{
      const u=g.userData,s=snap.P[u.p.id];g.position.set(s.x,s.y,0);
      if(u.flat){const back=s.face[0]*camDir.x+s.face[1]*camDir.y>0,f=s.sp>.5?1+Math.floor(S.time*8+u.p.num)%2:0;u.fig.material.map=u.get(back,f);
        if(u.flat==='paper')u.fig.rotation.z=camYaw+Math.PI/2;return}
      g.rotation.z=Math.atan2(s.face[1],s.face[0]);
      const sw=Math.sin(S.time*11+u.p.num)*clamp(s.sp/4,0,1);
      u.legs.forEach((l,i)=>l.rotation.y=sw*.6*(i?1:-1));u.arms.forEach((a,i)=>a.rotation.y=-sw*.7*(i?1:-1));
    });
    park.children.forEach(m=>{if(m.userData.billboard)m.rotation.z=camYaw+Math.PI/2});
    ball.position.set(snap.ball.x,snap.ball.y,.2);ball.rotation.y=snap.ball.x*3;
    const h=snap.P.hero,pulse=1+.12*Math.sin(S.time*6),tg=targets(snap);
    heroRing.position.set(h.x,h.y,.02);heroRing.visible=!S.closeup;
    passMarks.forEach(m=>{const on=tg.some(t=>t.id===m.id),q=snap.P[m.id];m.ring.visible=m.b.visible=on;m.ring.position.set(q.x,q.y,.02);m.ring.scale.setScalar(pulse);m.b.position.set(q.x,q.y,2.15)});
    arrows.forEach(a=>{a.visible=S.mode==='dribble';a.position.set(h.x,h.y,.03);a.material.opacity=.6+.3*Math.sin(S.time*6)});
    renderer.render(scene,camera);
  };
}

const worlds=SIM.views.filter(v=>STYLES[v.style]).map(v=>({v,render:makeWorld(v,STYLES[v.style])})).filter(w=>w.render);
function frame(){if(SIM.snap)worlds.forEach(w=>{if(w.v.visible)w.render(SIM.snap)});requestAnimationFrame(frame)}
requestAnimationFrame(frame);
</script>
