<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soccer IQ Art Styles</title>
<style>
:root{--bg:#0e1116;--text:#e8ecf1;--muted:#8a94a3;--gold:#ffd23f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,sans-serif}
header{padding:20px 16px 0;max-width:1400px;margin:0 auto}
h1{font-size:20px;margin:0 0 4px}
header p{margin:0;color:var(--muted)}
.controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
.controls .lbl{color:var(--muted);font-size:13px;margin-left:6px}
.controls button{background:#232a35;color:var(--text);border:1px solid #333b48;border-radius:10px;padding:7px 12px;font:600 13px system-ui;cursor:pointer}
.controls button.on{background:var(--gold);color:#1b2340;border-color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,520px),1fr));gap:28px;padding:20px 16px 40px;max-width:1400px;margin:0 auto}
figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:8px}
figcaption{color:var(--muted);font-size:13px;text-align:center}
figcaption b{color:var(--text)}
.phone{position:relative;background:#000;border-radius:38px;padding:10px;box-shadow:0 0 0 2px #2a2f38,0 20px 50px rgba(0,0,0,.5);width:100%;aspect-ratio:660/320}
.screen{position:relative;width:100%;height:100%;border-radius:29px;overflow:hidden;background:#2e7d32;touch-action:manipulation;cursor:pointer;user-select:none;-webkit-user-select:none}
.screen canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.screen::after{content:"";position:absolute;left:8px;top:50%;width:22px;height:78px;margin-top:-39px;background:#000;border-radius:12px}
.hud{position:absolute;inset:0;pointer-events:none;font-weight:800;color:#fff}
.score{position:absolute;top:9px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:7px;background:rgba(10,14,30,.78);padding:4px 10px;border-radius:10px;font-size:12px;white-space:nowrap}
.badge{width:14px;height:14px;border-radius:50%;display:inline-block;border:2px solid rgba(255,255,255,.8)}
.badge.barca{background:linear-gradient(90deg,#a50044 50%,#004d98 50%)}
.badge.madrid{background:#f4f4f2;border-color:#c9a227}
.ask,.look{position:absolute;left:50%;transform:translateX(-50%);display:none}
.ask{top:42px;background:#fff;color:#1b2340;padding:6px 12px;border-radius:14px;font-size:14px;white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.look{bottom:16px;border:0;background:var(--gold);color:#1b2340;font:800 15px system-ui;padding:9px 18px;border-radius:999px;align-items:center;gap:8px;box-shadow:0 6px 16px rgba(0,0,0,.35);animation:pulse 1s ease-in-out infinite}
.look span{font-size:24px;line-height:1}
body.waiting .look,body.asking .ask{display:flex}
.err{position:absolute;inset:0;display:grid;place-items:center;background:#1d2530;color:var(--muted);font-weight:600}
@keyframes pulse{50%{transform:translateX(-50%) scale(1.07)}}
</style>
</head>
<body>
<header>
  <h1>Soccer IQ: art styles</h1>
  <p>The same moment in five styles, all from behind Yamal in landscape. With his head down he sees only the ball. Tap 👀 or a phone to look up.</p>
  <div class="controls">
    <span class="lbl">Background</span>
    <button data-env="park" class="on">Park</button><button data-env="empty">Empty stadium</button><button data-env="crowd">Small crowd</button>
    <span class="lbl">Head</span>
    <button id="lookBtn">👀 Look up</button><button id="pause">⏸ Pause</button>
  </div>
</header>

<div class="grid">
  <figure><div class="phone"><div class="screen" data-style="cartoon"><canvas></canvas></div></div><figcaption><b>1. Cartoon.</b> Chunky, friendly figures with big heads.</figcaption></figure>
  <figure><div class="phone"><div class="screen" data-style="3d"><canvas></canvas></div></div><figcaption><b>2. Real 3D, toy look.</b> Simple 3D players with real light and shadows.</figcaption></figure>
  <figure><div class="phone"><div class="screen" data-style="anime"><canvas></canvas></div></div><figcaption><b>3. Anime.</b> Bold outlines, spiky hair, speed lines when he runs.</figcaption></figure>
  <figure><div class="phone"><div class="screen" data-style="toy"><canvas></canvas></div></div><figcaption><b>4. Shaded figures.</b> 2D sprites with soft 3D shading, like vinyl toys.</figcaption></figure>
  <figure><div class="phone"><div class="screen" data-style="pixel"><canvas></canvas></div></div><figcaption><b>5. Pixel art.</b> Retro arcade look, drawn at low resolution.</figcaption></figure>
</div>

<script>
// ---------- math ----------
const lerp=(a,b,t)=>a+(b-a)*t;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const smooth=t=>{t=clamp(t,0,1);return t*t*(3-2*t)};
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]];
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const norm=a=>{const l=Math.hypot(a[0],a[1],a[2])||1;return[a[0]/l,a[1]/l,a[2]/l]};
let seed=7;const rand=()=>(seed=(seed*16807)%2147483647)/2147483647;

// ---------- kits & players ----------
const KITS={
  barca:{pattern:'stripes',colors:['#a50044','#004d98'],shorts:'#0b2a6b',socks:'#0b2a6b',num:'#f6c344',trim:'#f6c344'},
  madrid:{pattern:'solid',colors:['#f4f4f2'],shorts:'#f4f4f2',socks:'#f4f4f2',num:'#22306b',trim:'#c9a227'},
};
const PLAYERS=[
  {id:'hero',name:'YAMAL',num:19,team:'barca',skin:'#b07a52',hair:'#1b1410'},
  {id:'raph',name:'RAPHINHA',num:11,team:'barca',skin:'#a8714b',hair:'#2a1c12'},
  {id:'lewy',name:'LEWANDOWSKI',num:9,team:'barca',skin:'#f0c8a6',hair:'#5a4330'},
  {id:'vini',name:'VINI JR',num:7,team:'madrid',skin:'#6b4429',hair:'#120c08'},
  {id:'bell',name:'BELLINGHAM',num:5,team:'madrid',skin:'#9a6a46',hair:'#1a120c'},
  {id:'mbap',name:'MBAPPÉ',num:10,team:'madrid',skin:'#7a4e30',hair:'#120c08'},
];
const TEAM_DIR={barca:1,madrid:-1};

// ---------- scenario (pitch 36 x 24 m, we attack toward x=36) ----------
const T_PRE=2.6,LOOP=10;
const TRACKS={
  hero:[[0,9,15],[2.6,16,14.5]], raph:[[0,13,6],[2.6,19,4]], lewy:[[0,20,12],[2.6,23.5,11.5]],
  vini:[[0,24,17],[2.6,19,15.2]], bell:[[0,23,11],[2.6,20.5,12.9]], mbap:[[0,30,10],[2.6,27,9]]};
function track(keys,t){
  if(t<=keys[0][0])return[keys[0][1],keys[0][2]];
  for(let i=1;i<keys.length;i++)if(t<=keys[i][0]){const[t0,x0,y0]=keys[i-1],[t1,x1,y1]=keys[i];const u=smooth((t-t0)/(t1-t0||1));return[lerp(x0,x1,u),lerp(y0,y1,u)]}
  const k=keys[keys.length-1];return[k[1],k[2]];
}

// ---------- world props (shared with the 3D view) ----------
const WALLS=[{a:[42,-6],b:[42,30],o:[1,0]},{a:[-6,30],b:[-6,-6],o:[-1,0]},{a:[42,30],b:[-6,30],o:[0,1]},{a:[-6,-6],b:[42,-6],o:[0,-1]}];
const ROWS=6,rowOff=r=>1.5+r*1.1,rowZ=r=>1.0+r*0.9;
const SHIRTS=['#a50044','#004d98','#f4f4f2','#f6c344','#e11d48','#22306b','#7cc0ea','#f97316'];
const SKINS=['#f0c8a6','#b07a52','#7a4e30','#d9a37a','#5a3a22'];
const SEATS=[];
WALLS.forEach((w,wi)=>{
  const L=Math.hypot(w.b[0]-w.a[0],w.b[1]-w.a[1]),n=Math.floor(L/0.9);
  for(let r=0;r<ROWS;r++)for(let i=0;i<n;i++){
    const t=(i+.5)/n;
    SEATS.push({wall:wi,r,x:lerp(w.a[0],w.b[0],t)+w.o[0]*rowOff(r),y:lerp(w.a[1],w.b[1],t)+w.o[1]*rowOff(r),z:rowZ(r),
      color:r%2?'#2a62c4':'#1e4fa3',occ:rand()<0.28,shirt:SHIRTS[Math.floor(rand()*SHIRTS.length)],skin:SKINS[Math.floor(rand()*SKINS.length)]});
  }
});
const TREES=[];
for(let x=-14;x<=50;x+=4.5){TREES.push({x:x+rand()*2,y:-13-rand()*3,s:4+rand()*2.5});TREES.push({x:x+rand()*2,y:37+rand()*3,s:4+rand()*2.5})}
for(let y=-8;y<=32;y+=4.5){TREES.push({x:-16-rand()*3,y:y+rand()*2,s:4+rand()*2.5});TREES.push({x:52+rand()*3,y:y+rand()*2,s:4+rand()*2.5})}
const CLOUDS=[];
for(let i=0;i<10;i++){const a=i/10*Math.PI*2+rand()*.4;CLOUDS.push({x:18+Math.cos(a)*150,y:12+Math.sin(a)*150,z:32+rand()*18,s:12+rand()*8})}

// ---------- state ----------
const S={t:0,look:0,lookTarget:0,manual:false,time:0,paused:false,env:'park'};
function setLook(v){S.lookTarget=v;S.manual=true}
function update(dt){
  if(S.paused)return;
  S.time+=dt;S.t+=dt;
  if(S.t>=LOOP){S.t=0;S.lookTarget=0;S.manual=false}
  if(!S.manual&&S.t>4.2)S.lookTarget=1;
  S.look=clamp(S.look+clamp(S.lookTarget-S.look,-dt/0.7,dt/0.7),0,1);
  document.body.classList.toggle('waiting',S.t>=T_PRE&&S.lookTarget===0);
  document.body.classList.toggle('asking',S.look>0.95);
  document.getElementById('lookBtn').textContent=S.lookTarget?'⬇ Look at ball':'👀 Look up';
}
function snapshot(){
  const t=Math.min(S.t,T_PRE),P={};
  for(const p of PLAYERS){
    const k=TRACKS[p.id],pos=track(k,t),a=track(k,t-0.05),b=track(k,t+0.05);
    const vx=(b[0]-a[0])/0.1,vy=(b[1]-a[1])/0.1,sp=Math.hypot(vx,vy);
    P[p.id]={x:pos[0],y:pos[1],sp,face:sp>0.5?[vx/sp,vy/sp]:null};
  }
  const c=P.hero;c.face=c.face||[1,0];
  const wob=0.55+0.12*Math.sin(S.time*14)*Math.min(1,c.sp/3);
  const ball={x:c.x+c.face[0]*wob,y:c.y+c.face[1]*wob,z:0};
  for(const id in P){const p=P[id];if(!p.face){const dx=ball.x-p.x,dy=ball.y-p.y,l=Math.hypot(dx,dy)||1;p.face=[dx/l,dy/l]}}
  return{P,ball};
}
// Head down: close over-the-shoulder view aimed at the ball. Head up: eye-level view across the field.
function camSpec(snap,look){
  const h=snap.P.hero,b=snap.ball,k=smooth(look);
  const mates=PLAYERS.filter(p=>p.team==='barca'),teamY=mates.reduce((s,p)=>s+snap.P[p.id].y,0)/mates.length;
  return{
    eye:[h.x-lerp(2.4,4.5,k),h.y+lerp(1.1,0.4,k),lerp(3.0,2.0,k)],
    tgt:[lerp(b.x+0.9,h.x+8,k),lerp(b.y,lerp(h.y,teamY,.6),k),lerp(0,0.9,k)],
    Ff:lerp(1.3,0.85,k)};
}

// ---------- 3D projection ----------
const NEAR=0.3;
function makeCam(eye,target,F,W,H){const f=norm(sub(target,eye)),r=norm(cross(f,[0,0,1])),u=cross(r,f);return{eye,f,r,u,F,W,H}}
function toCam(c,p){const d=sub(p,c.eye);return[dot(d,c.r),dot(d,c.u),dot(d,c.f)]}
function scr(c,q){return[c.W/2+c.F*q[0]/q[2],c.H/2-c.F*q[1]/q[2]]}
function project(c,p){const q=toCam(c,p);return q[2]<NEAR?null:[...scr(c,q),q[2]]}
function clipPoly(qs){
  const out=[];
  for(let i=0;i<qs.length;i++){
    const a=qs[i],b=qs[(i+1)%qs.length],ai=a[2]>=NEAR,bi=b[2]>=NEAR;
    if(ai)out.push(a);
    if(ai!==bi){const t=(NEAR-a[2])/(b[2]-a[2]);out.push([lerp(a[0],b[0],t),lerp(a[1],b[1],t),NEAR])}
  }
  return out;
}
function poly(ctx,c,pts,fill,stroke){
  const q=clipPoly(pts.map(p=>toCam(c,p)));if(q.length<3)return;
  ctx.beginPath();q.forEach((p,i)=>{const s=scr(c,p);i?ctx.lineTo(s[0],s[1]):ctx.moveTo(s[0],s[1])});ctx.closePath();
  ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1.5;ctx.stroke()}
}
function groundLine(ctx,c,a,b,w=0.14){
  const dx=b[0]-a[0],dy=b[1]-a[1],l=Math.hypot(dx,dy),nx=-dy/l*w/2,ny=dx/l*w/2;
  poly(ctx,c,[[a[0]+nx,a[1]+ny,0.01],[b[0]+nx,b[1]+ny,0.01],[b[0]-nx,b[1]-ny,0.01],[a[0]-nx,a[1]-ny,0.01]],'rgba(255,255,255,.92)');
}
function line3(ctx,c,a,b,wm,color){
  let qa=toCam(c,a),qb=toCam(c,b);
  if(qa[2]<NEAR&&qb[2]<NEAR)return;
  if(qa[2]<NEAR){const t=(NEAR-qa[2])/(qb[2]-qa[2]);qa=qa.map((v,i)=>lerp(v,qb[i],t))}
  if(qb[2]<NEAR){const t=(NEAR-qb[2])/(qa[2]-qb[2]);qb=qb.map((v,i)=>lerp(v,qa[i],t))}
  const sa=scr(c,qa),sb=scr(c,qb);
  ctx.strokeStyle=color;ctx.lineCap='round';ctx.lineWidth=Math.max(1.2,c.F*wm/((qa[2]+qb[2])/2));
  ctx.beginPath();ctx.moveTo(sa[0],sa[1]);ctx.lineTo(sb[0],sb[1]);ctx.stroke();
}

// ---------- per-style look ----------
const STYLE={
  cartoon:{sky:['#5fb2ef','#cfe9fb'],grass:['#4caf50','#43a047'],park:'#5aa04a',stand:'#59606e'},
  anime:{sky:['#1f6fe5','#a8dcff'],grass:['#3cc24a','#2fae3e'],park:'#4fb544',stand:'#4a5170',outline:'#15131f'},
  toy:{sky:['#9fd2f2','#f1f7fb'],grass:['#7cc576','#72bb6c'],park:'#88c27a',stand:'#8a90a0'},
  pixel:{sky:['#3fa9f5','#9bd8ff'],grass:['#4fbf3f','#3fa832'],park:'#3a9a33',stand:'#4b4f63',scale:5},
};

function drawSky(ctx,c,st){
  const g=ctx.createLinearGradient(0,0,0,c.H);g.addColorStop(0,st.sky[0]);g.addColorStop(1,st.sky[1]);
  ctx.fillStyle=g;ctx.fillRect(0,0,c.W,c.H);
  for(const cl of CLOUDS){
    const q=project(c,[cl.x,cl.y,cl.z]);if(!q)continue;const r=c.F*cl.s/q[2];
    ctx.fillStyle='rgba(255,255,255,.95)';
    if(st.outline){ctx.strokeStyle='#cfe3f7';ctx.lineWidth=2}
    ctx.beginPath();
    [[-.9,.1,.55],[-.3,-.25,.7],[.4,-.1,.6],[1,.15,.45]].forEach(([dx,dy,s])=>{ctx.moveTo(q[0]+dx*r+s*r,q[1]+dy*r);ctx.arc(q[0]+dx*r,q[1]+dy*r,s*r,0,7)});
    ctx.fill();
  }
}
function drawTree(ctx,c,t,st){
  const base=project(c,[t.x,t.y,0]);if(!base)return;
  line3(ctx,c,[t.x,t.y,0],[t.x,t.y,t.s*.45],0.45,'#6b4a2b');
  const blobs=[[0,0,.62,.36,'#2e7d32'],[-.22,.1,.5,.26,'#388e3c'],[.22,.05,.52,.27,'#33873a'],[0,0,.8,.24,'#43a047']];
  for(const[dx,dy,hz,rr,col]of blobs){
    const q=project(c,[t.x+dx*t.s*.5,t.y+dy*t.s*.5,t.s*hz]);if(!q)continue;const r=c.F*t.s*rr/q[2];
    if(st===STYLE.toy){const g=ctx.createRadialGradient(q[0]-r*.35,q[1]-r*.4,r*.1,q[0],q[1],r);g.addColorStop(0,'#8fd18a');g.addColorStop(1,col);ctx.fillStyle=g}else ctx.fillStyle=col;
    ctx.beginPath();ctx.arc(q[0],q[1],r,0,7);ctx.fill();
    if(st.outline){ctx.strokeStyle=st.outline;ctx.lineWidth=Math.max(1,r*.06);ctx.stroke()}
  }
}
function drawStands(ctx,c,st,crowd){
  const vis=WALLS.map((w,i)=>({w,i,d:Math.hypot((w.a[0]+w.b[0])/2-c.eye[0],(w.a[1]+w.b[1])/2-c.eye[1])}))
    .filter(({w})=>(c.eye[0]-w.a[0])*w.o[0]+(c.eye[1]-w.a[1])*w.o[1]<0).sort((x,y)=>y.d-x.d);
  for(const{w,i}of vis){
    const o=w.o,A=w.a,B=w.b,off=(d,z)=>[[A[0]+o[0]*d,A[1]+o[1]*d,z],[B[0]+o[0]*d,B[1]+o[1]*d,z]];
    const[a0,b0]=off(0,0),[a1,b1]=off(0,0.9),[a2,b2]=off(rowOff(ROWS)+.5,rowZ(ROWS)+.4);
    poly(ctx,c,[a1,b1,b2,a2],st.stand,st.outline);
    poly(ctx,c,[a2,b2,[b2[0],b2[1],b2[2]+1.2],[a2[0],a2[1],a2[2]+1.2]],'#2b2f3a');
    const N=8,ADS=['#1e88e5','#fdd835','#ffffff','#e53935','#00a86b'];
    for(let k=0;k<N;k++){const p0=[lerp(A[0],B[0],k/N),lerp(A[1],B[1],k/N)],p1=[lerp(A[0],B[0],(k+1)/N),lerp(A[1],B[1],(k+1)/N)];
      poly(ctx,c,[[...p0,0],[...p1,0],[...p1,.9],[...p0,.9]],ADS[k%ADS.length],st.outline)}
    for(let r=ROWS-1;r>=0;r--)for(const s of SEATS){
      if(s.wall!==i||s.r!==r)continue;
      const q=project(c,[s.x,s.y,s.z]);if(!q)continue;const k=c.F/q[2];
      ctx.fillStyle=s.color;ctx.fillRect(q[0]-.22*k,q[1]-.3*k,.44*k,.3*k);
      if(crowd&&s.occ){
        ctx.fillStyle=s.shirt;ctx.beginPath();ctx.ellipse(q[0],q[1]-.42*k,.2*k,.26*k,0,0,7);ctx.fill();
        ctx.fillStyle=s.skin;ctx.beginPath();ctx.arc(q[0],q[1]-.8*k,.13*k,0,7);ctx.fill();
      }
    }
  }
}
function drawPitch(ctx,c,st,env){
  drawSky(ctx,c,st);
  const R=env==='park'?[-80,120,-80,104]:[-6,42,-6,30];
  poly(ctx,c,[[R[0],R[2],0],[R[1],R[2],0],[R[1],R[3],0],[R[0],R[3],0]],env==='park'?st.park:'#2f8034');
  for(let i=0;i<12;i++)poly(ctx,c,[[i*3,0,0],[i*3+3,0,0],[i*3+3,24,0],[i*3,24,0]],st.grass[i%2]);
  const L=(a,b)=>groundLine(ctx,c,a,b);
  L([0,0],[36,0]);L([36,0],[36,24]);L([36,24],[0,24]);L([0,24],[0,0]);L([18,0],[18,24]);
  for(const gx of[0,36]){const d=gx?-1:1;L([gx,8],[gx+4*d,8]);L([gx+4*d,8],[gx+4*d,16]);L([gx+4*d,16],[gx,16])}
  for(let i=0;i<32;i++){const a=i/32*Math.PI*2,b=(i+1)/32*Math.PI*2;L([18+3*Math.cos(a),12+3*Math.sin(a)],[18+3*Math.cos(b),12+3*Math.sin(b)])}
  if(env==='park')TREES.map(t=>({t,d:Math.hypot(t.x-c.eye[0],t.y-c.eye[1])})).sort((a,b)=>b.d-a.d).forEach(({t})=>drawTree(ctx,c,t,st));
  else drawStands(ctx,c,st,env==='crowd');
}
function drawGoal(ctx,c,gx,dir){
  const y0=9.5,y1=14.5,h=1.8,bx=gx+1.3*dir,net='rgba(255,255,255,.22)';
  poly(ctx,c,[[bx,y0,0],[bx,y1,0],[bx,y1,h*.7],[bx,y0,h*.7]],net);
  poly(ctx,c,[[gx,y0,h],[gx,y1,h],[bx,y1,h*.7],[bx,y0,h*.7]],net);
  poly(ctx,c,[[gx,y0,0],[bx,y0,0],[bx,y0,h*.7],[gx,y0,h]],net);
  poly(ctx,c,[[gx,y1,0],[bx,y1,0],[bx,y1,h*.7],[gx,y1,h]],net);
  for(const[a,b]of[[[gx,y0,0],[gx,y0,h]],[[gx,y1,0],[gx,y1,h]],[[gx,y0,h],[gx,y1,h]]])line3(ctx,c,a,b,0.12,'#fff');
}

// ---------- sprites ----------
function seg(ctx,x1,y1,x2,y2,w,col){ctx.strokeStyle=col;ctx.lineWidth=w;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}
function shade(ctx,x,y,w,h){const g=ctx.createLinearGradient(x,y,x+w,y+h*.3);g.addColorStop(0,'rgba(255,255,255,.28)');g.addColorStop(.5,'rgba(255,255,255,0)');g.addColorStop(1,'rgba(0,0,0,.28)');return g}
function drawPlayer(ctx,x,y,h,p,kit,back,swing,o={}){
  const st=o.style||'cartoon',u=h/110,body=kit.colors[0];
  const OL=st==='anime'?'#15131f':null,ow=1.5*u;
  const headR=st==='anime'?14*u:st==='toy'?19*u:17*u,legL=st==='anime'?38*u:st==='toy'?30*u:34*u,th=st==='anime'?33*u:st==='toy'?28*u:31*u;
  const limb=(x1,y1,x2,y2,w,col)=>{if(OL)seg(ctx,x1,y1,x2,y2,w+2*ow,OL);seg(ctx,x1,y1,x2,y2,w,col)};
  ctx.fillStyle='rgba(0,0,0,.28)';ctx.beginPath();ctx.ellipse(x,y,20*u,5.5*u,0,0,7);ctx.fill();
  if(o.ring){ctx.strokeStyle=o.ring;ctx.lineWidth=Math.max(2.5,3.5*u);ctx.beginPath();ctx.ellipse(x,y,27*u*(o.ringScale||1),8.5*u*(o.ringScale||1),0,0,7);ctx.stroke()}
  const hipY=y-legL-2*u-Math.abs(swing)*2*u;
  for(const s of[-1,1]){
    const a=swing*0.55*s,hx=x+s*6*u,fx=hx+Math.sin(a)*legL,fy=hipY+Math.cos(a)*legL;
    limb(hx,hipY,fx,fy,8*u,p.skin);
    seg(ctx,lerp(hx,fx,.45),lerp(hipY,fy,.45),fx,fy-2*u,9*u,kit.socks);
    ctx.fillStyle=o.boots||'#15171c';ctx.beginPath();ctx.ellipse(fx,fy,6*u,3.6*u,0,0,7);ctx.fill();if(OL){ctx.strokeStyle=OL;ctx.lineWidth=ow;ctx.stroke()}
  }
  ctx.fillStyle=kit.shorts;ctx.beginPath();ctx.roundRect(x-16*u,hipY-12*u,32*u,16*u,4*u);ctx.fill();if(OL){ctx.strokeStyle=OL;ctx.lineWidth=ow;ctx.stroke()}
  const sleeve=kit.pattern==='sleeves'?kit.colors[1]:body,ty=hipY-9*u-th;
  for(const s of[-1,1]){
    const a=-swing*0.6*s,sx=x+s*15*u,sy=ty+6*u,ex=sx+s*5*u+Math.sin(a)*22*u,ey=sy+Math.cos(a)*22*u;
    limb(sx,sy,ex,ey,8*u,p.skin);seg(ctx,sx,sy,lerp(sx,ex,.42),lerp(sy,ey,.42),10*u,sleeve);
  }
  const tx=x-17*u,tw=34*u;
  ctx.save();ctx.beginPath();ctx.roundRect(tx,ty,tw,th,7*u);ctx.clip();
  ctx.fillStyle=body;ctx.fillRect(tx,ty,tw,th);
  if(kit.pattern==='stripes'){ctx.fillStyle=kit.colors[1];for(let i=1;i<5;i+=2)ctx.fillRect(tx+i*tw/5,ty,tw/5,th)}
  if(kit.pattern==='band'){ctx.fillStyle='#fff';ctx.fillRect(x-6*u,ty,12*u,th);ctx.fillStyle=kit.colors[1];ctx.fillRect(x-4*u,ty,8*u,th)}
  if(st==='toy'){ctx.fillStyle=shade(ctx,tx,ty,tw,th);ctx.fillRect(tx,ty,tw,th)}
  if(st==='anime'){ctx.fillStyle='rgba(20,20,60,.22)';ctx.fillRect(x+5*u,ty,tw,th)}
  ctx.restore();
  if(OL){ctx.strokeStyle=OL;ctx.lineWidth=ow;ctx.beginPath();ctx.roundRect(tx,ty,tw,th,7*u);ctx.stroke()}
  ctx.fillStyle=p.skin;ctx.fillRect(x-4*u,ty-5*u,8*u,7*u);
  seg(ctx,x-6*u,ty+1*u,x+6*u,ty+1*u,2.4*u,kit.trim);
  if(back&&u>0.3){
    ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineJoin='round';
    ctx.font=`900 ${15*u}px system-ui,sans-serif`;ctx.lineWidth=2.4*u;ctx.strokeStyle='rgba(0,0,0,.45)';
    ctx.strokeText(p.num,x,ty+th*.62);ctx.fillStyle=kit.num;ctx.fillText(p.num,x,ty+th*.62);
    ctx.font=`800 ${Math.min(6*u,52*u/p.name.length*1.7)}px system-ui,sans-serif`;ctx.lineWidth=1.6*u;
    ctx.strokeText(p.name,x,ty+th*.24);ctx.fillText(p.name,x,ty+th*.24);
  }
  const hy=ty-3*u-headR,r=headR;
  ctx.fillStyle=p.skin;
  ctx.beginPath();ctx.arc(x-r,hy+2*u,3.5*u,0,7);ctx.arc(x+r,hy+2*u,3.5*u,0,7);ctx.fill();
  ctx.beginPath();ctx.arc(x,hy,r,0,7);ctx.fill();if(OL){ctx.strokeStyle=OL;ctx.lineWidth=ow;ctx.stroke()}
  if(st==='toy'){const g=ctx.createRadialGradient(x-r*.4,hy-r*.45,r*.05,x,hy,r);g.addColorStop(0,'rgba(255,255,255,.45)');g.addColorStop(.45,'rgba(255,255,255,0)');g.addColorStop(1,'rgba(0,0,0,.22)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,hy,r,0,7);ctx.fill()}
  ctx.fillStyle=p.hair;ctx.beginPath();
  if(st==='anime'){
    const a0=back?Math.PI*.78:Math.PI*1.0,a1=back?Math.PI*2.22:Math.PI*2.0,n=9;
    for(let i=0;i<=n*2;i++){const a=lerp(a0,a1,i/(n*2)),rr=i%2?r*1.42:r*1.02;const px=x+Math.cos(a)*rr,py=hy-2*u+Math.sin(a)*rr;i?ctx.lineTo(px,py):ctx.moveTo(px,py)}
    ctx.closePath();ctx.fill();ctx.strokeStyle=OL;ctx.lineWidth=ow;ctx.stroke();
  }else{
    if(back)ctx.arc(x,hy,r*1.04,Math.PI*0.82,Math.PI*2.18);else ctx.arc(x,hy-2.5*u,r*1.04,Math.PI*1.04,Math.PI*1.96);
    ctx.fill();
  }
  if(!back){
    if(st==='anime'){
      for(const s of[-1,1]){ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(x+s*5.5*u,hy+2*u,3.4*u,4.4*u,0,0,7);ctx.fill();
        ctx.fillStyle='#2b1d14';ctx.beginPath();ctx.arc(x+s*5.5*u,hy+2.6*u,2.6*u,0,7);ctx.fill();
        ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x+s*5.5*u-.9*u,hy+1.4*u,1*u,0,7);ctx.fill()}
    }else{
      const er=st==='toy'?3*u:2.3*u;ctx.fillStyle='#1d1410';ctx.beginPath();ctx.arc(x-6*u,hy+2*u,er,0,7);ctx.arc(x+6*u,hy+2*u,er,0,7);ctx.fill();
      if(st==='toy'){ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x-6.8*u,hy+1.1*u,.9*u,0,7);ctx.arc(x+5.2*u,hy+1.1*u,.9*u,0,7);ctx.fill()}
    }
    ctx.strokeStyle='#5a2a1c';ctx.lineWidth=1.6*u;ctx.beginPath();ctx.arc(x,hy+6*u,4.5*u,Math.PI*.2,Math.PI*.8);ctx.stroke();
  }
  if(o.marker){
    const my=hy-r-10*u-Math.abs(Math.sin(S.time*4))*5*u,m=Math.max(6,7*u);
    ctx.fillStyle='#ffd23f';ctx.strokeStyle='#1b2340';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(x-m,my-m*1.1);ctx.lineTo(x+m,my-m*1.1);ctx.lineTo(x,my+m*.4);ctx.closePath();ctx.fill();ctx.stroke();
  }
  return{top:hy-r};
}
function drawBall(ctx,x,y,r,OL){
  ctx.fillStyle='#fff';ctx.strokeStyle=OL||'#222';ctx.lineWidth=Math.max(1,r*.12);
  ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();ctx.stroke();
  ctx.fillStyle='#222';const a=S.time*3;
  ctx.beginPath();ctx.arc(x+Math.cos(a)*r*.25,y+Math.sin(a)*r*.25,r*.32,0,7);ctx.fill();
  for(let i=0;i<5;i++){const b=a+i*1.2566;ctx.beginPath();ctx.arc(x+Math.cos(b)*r*.78,y+Math.sin(b)*r*.78,r*.14,0,7);ctx.fill()}
}
function bubble(ctx,x,y,r,emoji){
  ctx.fillStyle='#fff';ctx.strokeStyle='#ffd23f';ctx.lineWidth=3;
  ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();ctx.stroke();
  ctx.font=`${r*1.15}px system-ui`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(emoji,x,y+1);
}

// ---------- 2D views ----------
function renderScene(ctx,W,H,style,snap){
  const st=STYLE[style],spec=camSpec(snap,S.look),c=makeCam(spec.eye,spec.tgt,Math.min(W,H)*spec.Ff,W,H);
  drawPitch(ctx,c,st,S.env);
  const opts=S.look>0.9,pulse=1+0.12*Math.sin(S.time*6);
  if(opts){
    const h=snap.P.hero,col=`rgba(255,210,63,${0.55+0.3*Math.sin(S.time*6)})`;
    poly(ctx,c,[[h.x+1,h.y-.35,.02],[h.x+3.3,h.y-.35,.02],[h.x+3.3,h.y+.35,.02],[h.x+1,h.y+.35,.02]],col);
    poly(ctx,c,[[h.x+3.3,h.y-.9,.02],[h.x+4.6,h.y,.02],[h.x+3.3,h.y+.9,.02]],col);
  }
  const objs=[];
  for(const p of PLAYERS){const s=snap.P[p.id],q=project(c,[s.x,s.y,0]);if(q)objs.push({z:q[2],draw:()=>{
    const h=c.F*1.6/q[2],back=s.face[0]*c.f[0]+s.face[1]*c.f[1]>0,swing=Math.sin(S.time*11+p.num)*clamp(s.sp/4,0,1);
    const opt=opts&&(p.id==='raph'||p.id==='lewy');
    if(p.id==='hero')ctx.globalAlpha=lerp(.6,1,smooth(S.look));
    const r=drawPlayer(ctx,q[0],q[1],h,p,KITS[p.team],back,swing,{style,ring:p.id==='hero'?'#ffd23f':opt?'rgba(255,255,255,.95)':null,ringScale:opt?pulse:1,marker:p.id==='hero'&&S.look>.5,boots:p.id==='hero'?'#f59e0b':null});
    ctx.globalAlpha=1;
    if(opt)bubble(ctx,q[0],r.top-Math.max(12,h*.12)-8,Math.max(12,h*.12),'⚽');
  }})}
  const b=snap.ball,bq=project(c,[b.x,b.y,b.z+0.22]),bs=project(c,[b.x,b.y,0]);
  if(bq&&bs)objs.push({z:bq[2]-0.05,draw:()=>{const r=c.F*0.22/bq[2];ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(bs[0],bs[1],r,r*.35,0,0,7);ctx.fill();drawBall(ctx,bq[0],bq[1],r,st.outline)}});
  for(const[gx,d]of[[36,1],[0,-1]]){const q=project(c,[gx,12,0]);if(q)objs.push({z:q[2],draw:()=>drawGoal(ctx,c,gx,d)})}
  objs.sort((a,b)=>b.z-a.z).forEach(o=>o.draw());
  if(opts){const h=snap.P.hero,t=project(c,[h.x+4,h.y,0]);if(t)bubble(ctx,t[0],t[1]-26,14,'💨')}
  // Head down: dark edges sell "tunnel vision".
  const down=1-smooth(S.look);
  if(down>0.01){const g=ctx.createRadialGradient(W/2,H*.6,Math.min(W,H)*.25,W/2,H*.6,Math.max(W,H)*.65);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,`rgba(0,0,0,${.6*down})`);ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}
  if(style==='anime'&&down>.5&&snap.P.hero.sp>1){
    ctx.strokeStyle='rgba(255,255,255,.55)';ctx.lineWidth=2;const k=Math.floor(S.time*20);
    for(let i=0;i<22;i++){const a=((i*137.5+k*53)%360)*Math.PI/180,r0=Math.max(W,H)*.42,r1=Math.max(W,H)*.75;
      ctx.beginPath();ctx.moveTo(W/2+Math.cos(a)*r0,H/2+Math.sin(a)*r0);ctx.lineTo(W/2+Math.cos(a)*r1,H/2+Math.sin(a)*r1);ctx.stroke()}
  }
}

const views=[...document.querySelectorAll('.screen')].map(el=>{
  const hud=document.createElement('div');hud.className='hud';
  hud.innerHTML=`<div class="score"><span class="badge barca"></span>BAR 0 – 0 RMA<span class="badge madrid"></span></div>
    <div class="look"><span>👀</span>Look up!</div><div class="ask">What should Yamal do?</div>`;
  el.appendChild(hud);
  el.addEventListener('pointerdown',()=>setLook(S.lookTarget?0:1));
  const canvas=el.querySelector('canvas'),style=el.dataset.style;
  return{el,style,canvas,ctx:style==='3d'?null:canvas.getContext('2d'),off:style==='pixel'?document.createElement('canvas'):null};
});
function render2D(v,snap){
  const cv=v.canvas,W=cv.clientWidth,H=cv.clientHeight;
  if(v.off){
    const s=STYLE.pixel.scale,w=Math.ceil(W/s),h=Math.ceil(H/s);
    if(cv.width!==w){cv.width=w;cv.height=h;v.off.width=w;v.off.height=h;cv.style.imageRendering='pixelated'}
    const g=v.ctx;g.setTransform(1/s,0,0,1/s,0,0);g.imageSmoothingEnabled=false;renderScene(g,W,H,'pixel',snap);return;
  }
  const dpr=Math.min(devicePixelRatio||1,2);
  if(cv.width!==Math.round(W*dpr)){cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr)}
  v.ctx.setTransform(dpr,0,0,dpr,0,0);renderScene(v.ctx,W,H,v.style,snap);
}

// ---------- controls & loop ----------
document.querySelectorAll('[data-env]').forEach(b=>b.onclick=()=>{S.env=b.dataset.env;document.querySelectorAll('[data-env]').forEach(x=>x.classList.toggle('on',x===b));window.SIM.onEnv?.()});
document.getElementById('lookBtn').onclick=()=>setLook(S.lookTarget?0:1);
document.getElementById('pause').onclick=e=>{S.paused=!S.paused;e.target.textContent=S.paused?'▶ Play':'⏸ Pause'};
window.SIM={S,snapshot,camSpec,PLAYERS,KITS,TREES,SEATS,WALLS,ROWS,rowOff,rowZ,smooth,clamp};
let last=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  update(dt);const snap=snapshot();window.SIM.snap=snap;
  views.forEach(v=>{if(v.ctx)render2D(v,snap)});
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const SIM=window.SIM,{S,camSpec,PLAYERS,KITS,TREES,SEATS,WALLS,ROWS,rowOff,rowZ,clamp}=SIM;
const el=document.querySelector('.screen[data-style="3d"]'),canvas=el.querySelector('canvas');
let renderer;
try{renderer=new THREE.WebGLRenderer({canvas,antialias:true})}catch(e){el.insertAdjacentHTML('beforeend','<div class="err">WebGL is not available here</div>')}
if(renderer){
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();scene.background=new THREE.Color('#8ccdf5');scene.fog=new THREE.Fog('#cfeafb',70,190);
const camera=new THREE.PerspectiveCamera(40,2,0.1,500);camera.up.set(0,0,1);
const hemi=new THREE.HemisphereLight(0xffffff,0x4a7a3a,1.1);hemi.position.set(0,0,1);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffffff,1.8);sun.position.set(34,-18,40);sun.target.position.set(18,12,0);scene.add(sun.target);
sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-32,right:32,top:32,bottom:-32,near:1,far:140});scene.add(sun);

const M=(c,o={})=>new THREE.MeshStandardMaterial({color:c,roughness:.6,...o});
const canvasTex=(w,h,draw)=>{const cv=document.createElement('canvas');cv.width=w;cv.height=h;draw(cv.getContext('2d'));const t=new THREE.CanvasTexture(cv);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;return t};
const shadowed=o=>{o.traverse(m=>{if(m.isMesh){m.castShadow=true;m.receiveShadow=true}});return o};

// pitch
const S_=40;
const pitchTex=canvasTex(48*S_,36*S_,g=>{
  const X=x=>(x+6)*S_,Y=y=>(30-y)*S_;
  g.fillStyle='#3f9a3f';g.fillRect(0,0,48*S_,36*S_);
  for(let i=0;i<12;i++){g.fillStyle=i%2?'#4caf50':'#43a047';g.fillRect(X(i*3),Y(24),3*S_,24*S_)}
  g.strokeStyle='rgba(255,255,255,.95)';g.lineWidth=.14*S_;
  g.strokeRect(X(0),Y(24),36*S_,24*S_);g.beginPath();g.moveTo(X(18),Y(0));g.lineTo(X(18),Y(24));g.stroke();
  g.beginPath();g.arc(X(18),Y(12),3*S_,0,7);g.stroke();
  g.strokeRect(X(0),Y(16),4*S_,8*S_);g.strokeRect(X(32),Y(16),4*S_,8*S_);
});
const pitch=new THREE.Mesh(new THREE.PlaneGeometry(48,36),new THREE.MeshStandardMaterial({map:pitchTex,roughness:.95}));
pitch.position.set(18,12,0);pitch.receiveShadow=true;scene.add(pitch);
const outer=new THREE.Mesh(new THREE.PlaneGeometry(400,400),M('#5a9e4a',{roughness:1}));outer.position.set(18,12,-.02);outer.receiveShadow=true;scene.add(outer);

// goals
for(const[gx,dir]of[[36,1],[0,-1]]){
  const g=new THREE.Group(),white=M('#ffffff'),net=new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.25,side:THREE.DoubleSide,depthWrite:false});
  const post=()=>new THREE.Mesh(new THREE.CylinderGeometry(.06,.06,1.8,12).rotateX(Math.PI/2),white);
  const p1=post();p1.position.set(gx,9.5,.9);const p2=post();p2.position.set(gx,14.5,.9);
  const bar=new THREE.Mesh(new THREE.CylinderGeometry(.06,.06,5,12),white);bar.position.set(gx,12,1.8);
  const back=new THREE.Mesh(new THREE.PlaneGeometry(5,1.3).rotateX(Math.PI/2).rotateZ(Math.PI/2),net);back.position.set(gx+1.3*dir,12,.65);
  g.add(p1,p2,bar,back);scene.add(shadowed(g));
}

// players
const cap=(r,l)=>new THREE.CapsuleGeometry(r,l,4,12).rotateX(Math.PI/2);
function kitTex(kit,p){
  return canvasTex(512,256,g=>{
    g.fillStyle=kit.colors[0];g.fillRect(0,0,512,256);
    if(kit.pattern==='stripes'){g.fillStyle=kit.colors[1];for(let i=0;i<16;i+=2)g.fillRect(i*32+16,0,32,256)}
    g.save();g.translate(384,0);g.textAlign='center';g.textBaseline='middle';g.lineJoin='round';
    g.font='900 120px system-ui,sans-serif';g.lineWidth=12;g.strokeStyle='rgba(0,0,0,.45)';g.strokeText(p.num,0,150);g.fillStyle=kit.num;g.fillText(p.num,0,150);
    g.font='800 34px system-ui,sans-serif';g.lineWidth=6;g.strokeText(p.name,0,58,170);g.fillText(p.name,0,58,170);g.restore();
    g.fillStyle=kit.trim;g.beginPath();g.arc(150,70,14,0,7);g.fill();
  });
}
function makePlayer(p){
  const kit=KITS[p.team],g=new THREE.Group(),skin=M(p.skin),sock=M(kit.socks),legs=[],arms=[];
  for(const s of[-1,1]){
    const piv=new THREE.Group();piv.position.set(0,s*.1,.56);
    const up=new THREE.Mesh(cap(.065,.14),skin);up.position.z=-.12;
    const low=new THREE.Mesh(cap(.072,.16),sock);low.position.z=-.32;
    const boot=new THREE.Mesh(new THREE.BoxGeometry(.22,.12,.09),M(p.id==='hero'?'#f59e0b':'#15171c'));boot.position.set(.04,0,-.5);
    piv.add(up,low,boot);g.add(piv);legs.push(piv);
  }
  const shorts=new THREE.Mesh(new THREE.BoxGeometry(.28,.42,.2),M(kit.shorts));shorts.position.z=.6;g.add(shorts);
  const torso=new THREE.Mesh(new THREE.CylinderGeometry(.21,.18,.46,28).rotateX(Math.PI/2),M('#fff',{map:kitTex(kit,p)}));torso.position.z=.9;torso.scale.x=.75;g.add(torso);
  for(const s of[-1,1]){
    const piv=new THREE.Group();piv.position.set(0,s*.26,1.07);
    const sl=new THREE.Mesh(cap(.07,.08),M(kit.colors[0]));sl.position.z=-.06;
    const fa=new THREE.Mesh(cap(.052,.16),skin);fa.position.z=-.22;
    piv.add(sl,fa);g.add(piv);arms.push(piv);
  }
  const head=new THREE.Mesh(new THREE.SphereGeometry(.25,28,20),skin);head.position.z=1.38;g.add(head);
  const hair=new THREE.Mesh(new THREE.SphereGeometry(.262,28,14,0,Math.PI*2,0,Math.PI*.5).rotateX(Math.PI/2).rotateY(-.35),M(p.hair,{roughness:.8}));hair.position.set(-.01,0,1.4);g.add(hair);
  for(const s of[-1,1]){const e=new THREE.Mesh(new THREE.SphereGeometry(.035,10,8),M('#1d1410',{roughness:.2}));e.position.set(.235,s*.08,1.4);g.add(e)}
  g.userData={legs,arms,p};return shadowed(g);
}
const people=PLAYERS.map(p=>{const g=makePlayer(p);scene.add(g);return g});
const ball=new THREE.Mesh(new THREE.SphereGeometry(.2,24,18),M('#fff',{roughness:.4,map:canvasTex(256,128,g=>{g.fillStyle='#fff';g.fillRect(0,0,256,128);g.fillStyle='#222';for(let i=0;i<10;i++){g.beginPath();g.arc((i*53)%256,(i*37)%128,14,0,7);g.fill()}})}));
ball.castShadow=true;scene.add(ball);

// option markers
const gold=new THREE.MeshBasicMaterial({color:0xffd23f,transparent:true,opacity:.9,depthWrite:false});
const heroRing=new THREE.Mesh(new THREE.RingGeometry(.48,.62,40),gold);scene.add(heroRing);
const optRings=['raph','lewy'].map(()=>{const m=new THREE.Mesh(new THREE.RingGeometry(.5,.66,40),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,depthWrite:false}));scene.add(m);return m});
const bubbleTex=e=>canvasTex(128,128,g=>{g.fillStyle='#fff';g.strokeStyle='#ffd23f';g.lineWidth=10;g.beginPath();g.arc(64,64,56,0,7);g.fill();g.stroke();g.font='64px system-ui';g.textAlign='center';g.textBaseline='middle';g.fillText(e,64,68)});
const optBubbles=['raph','lewy'].map(()=>{const s=new THREE.Sprite(new THREE.SpriteMaterial({map:bubbleTex('⚽'),depthTest:false}));s.scale.set(.7,.7,1);scene.add(s);return s});
const dribBubble=new THREE.Sprite(new THREE.SpriteMaterial({map:bubbleTex('💨'),depthTest:false}));dribBubble.scale.set(.6,.6,1);scene.add(dribBubble);
const arrowShape=new THREE.Shape();arrowShape.moveTo(1,-.35);arrowShape.lineTo(3.3,-.35);arrowShape.lineTo(3.3,-.9);arrowShape.lineTo(4.6,0);arrowShape.lineTo(3.3,.9);arrowShape.lineTo(3.3,.35);arrowShape.lineTo(1,.35);
const arrow=new THREE.Mesh(new THREE.ShapeGeometry(arrowShape),gold.clone());scene.add(arrow);

// environment
const park=new THREE.Group(),stands=new THREE.Group(),crowd=new THREE.Group();
const trunkG=new THREE.CylinderGeometry(.18,.25,1,8).rotateX(Math.PI/2),leafG=new THREE.IcosahedronGeometry(1,1);
const trunkM=M('#6b4a2b'),leafM=[M('#2e7d32',{flatShading:true}),M('#388e3c',{flatShading:true})];
TREES.forEach((t,i)=>{const tr=new THREE.Mesh(trunkG,trunkM);tr.scale.z=t.s*.45;tr.position.set(t.x,t.y,t.s*.225);
  const lf=new THREE.Mesh(leafG,leafM[i%2]);lf.scale.setScalar(t.s*.34);lf.position.set(t.x,t.y,t.s*.68);park.add(tr,lf)});
const stepM=M('#7b8190'),ADS=['#1e88e5','#fdd835','#ffffff','#e53935','#00a86b'];
WALLS.forEach(w=>{
  const along=w.o[0]?'y':'x',L=Math.hypot(w.b[0]-w.a[0],w.b[1]-w.a[1]),mid=[(w.a[0]+w.b[0])/2,(w.a[1]+w.b[1])/2];
  for(let r=0;r<ROWS;r++){
    const h=rowZ(r)-.18,box=along==='y'?new THREE.BoxGeometry(1.1,L+2*rowOff(r),h):new THREE.BoxGeometry(L+2*rowOff(r),1.1,h);
    const m=new THREE.Mesh(box,stepM);m.position.set(mid[0]+w.o[0]*rowOff(r),mid[1]+w.o[1]*rowOff(r),h/2);stands.add(m);
  }
  for(let k=0;k<8;k++){const t=(k+.5)/8,len=L/8,b=new THREE.Mesh(along==='y'?new THREE.BoxGeometry(.1,len,.9):new THREE.BoxGeometry(len,.1,.9),M(ADS[k%ADS.length]));
    b.position.set(lerp(w.a[0],w.b[0],t)+w.o[0]*.2,lerp(w.a[1],w.b[1],t)+w.o[1]*.2,.45);stands.add(b)}
});
function lerp(a,b,t){return a+(b-a)*t}
const seatMesh=new THREE.InstancedMesh(new THREE.BoxGeometry(.45,.45,.3),M('#fff'),SEATS.length),mtx=new THREE.Matrix4(),col=new THREE.Color();
SEATS.forEach((s,i)=>{mtx.makeTranslation(s.x,s.y,s.z);seatMesh.setMatrixAt(i,mtx);seatMesh.setColorAt(i,col.set(s.color))});stands.add(seatMesh);
const fans=SEATS.filter(s=>s.occ),bodyMesh=new THREE.InstancedMesh(cap(.2,.3),M('#fff'),fans.length),headMesh=new THREE.InstancedMesh(new THREE.SphereGeometry(.14,10,8),M('#fff'),fans.length);
fans.forEach((s,i)=>{mtx.makeTranslation(s.x,s.y,s.z+.45);bodyMesh.setMatrixAt(i,mtx);bodyMesh.setColorAt(i,col.set(s.shirt));mtx.makeTranslation(s.x,s.y,s.z+.85);headMesh.setMatrixAt(i,mtx);headMesh.setColorAt(i,col.set(s.skin))});
crowd.add(bodyMesh,headMesh);
scene.add(park,stands,crowd);
SIM.onEnv=()=>{park.visible=S.env==='park';stands.visible=S.env!=='park';crowd.visible=S.env==='crowd';outer.material.color.set(S.env==='park'?'#5a9e4a':'#2f8034')};
SIM.onEnv();

function frame(){
  const snap=SIM.snap;
  if(snap){
    const W=canvas.clientWidth,H=canvas.clientHeight;
    if(canvas.width!==Math.round(W*renderer.getPixelRatio()))renderer.setSize(W,H,false);
    people.forEach(g=>{
      const{p,legs,arms}=g.userData,s=snap.P[p.id];
      g.position.set(s.x,s.y,0);g.rotation.z=Math.atan2(s.face[1],s.face[0]);
      const sw=Math.sin(S.time*11+p.num)*clamp(s.sp/4,0,1);
      legs.forEach((l,i)=>l.rotation.y=sw*.6*(i?1:-1));arms.forEach((a,i)=>a.rotation.y=-sw*.7*(i?1:-1));
    });
    ball.position.set(snap.ball.x,snap.ball.y,.2);ball.rotation.y=snap.ball.x*3;
    const h=snap.P.hero,opts=S.look>.9,pulse=1+.12*Math.sin(S.time*6);
    heroRing.position.set(h.x,h.y,.02);
    ['raph','lewy'].forEach((id,i)=>{const q=snap.P[id];optRings[i].visible=optBubbles[i].visible=opts;optRings[i].position.set(q.x,q.y,.02);optRings[i].scale.setScalar(pulse);optBubbles[i].position.set(q.x,q.y,2.1)});
    arrow.visible=dribBubble.visible=opts;arrow.position.set(h.x,h.y,.03);arrow.material.opacity=.55+.3*Math.sin(S.time*6);dribBubble.position.set(h.x+4,h.y,.9);
    const spec=camSpec(snap,S.look),F=Math.min(W,H)*spec.Ff;
    camera.aspect=W/H;camera.fov=2*Math.atan(H/2/F)*180/Math.PI;camera.updateProjectionMatrix();
    camera.position.set(...spec.eye);camera.lookAt(...spec.tgt);
    renderer.render(scene,camera);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
}
</script>
</body>
