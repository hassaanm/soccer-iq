<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soccer IQ Art Styles 2</title>
<style>
:root{--bg:#0e1116;--text:#e8ecf1;--muted:#8a94a3;--gold:#ffd23f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,sans-serif}
header{padding:20px 16px 0;max-width:1400px;margin:0 auto}
h1{font-size:20px;margin:0 0 4px}
header p{margin:0;color:var(--muted)}
.controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
.controls .lbl{color:var(--muted);font-size:13px;margin-left:6px}
.controls button{background:#232a35;color:var(--text);border:1px solid #333b48;border-radius:10px;padding:7px 12px;font:600 13px system-ui;cursor:pointer}
.controls button.on{background:var(--gold);color:#1b2340;border-color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,520px),1fr));gap:28px;padding:20px 16px 40px;max-width:1400px;margin:0 auto}
figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:8px}
figcaption{color:var(--muted);font-size:13px;text-align:center;max-width:520px}
figcaption b{color:var(--text)}
.phone{position:relative;background:#000;border-radius:38px;padding:10px;box-shadow:0 0 0 2px #2a2f38,0 20px 50px rgba(0,0,0,.5);width:100%;aspect-ratio:660/320}
.screen{position:relative;width:100%;height:100%;border-radius:29px;overflow:hidden;background:#2e7d32;touch-action:manipulation;cursor:pointer;user-select:none;-webkit-user-select:none}
.screen canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.screen[data-style=pixel] canvas{image-rendering:pixelated}
.screen[data-style=hd2d] .hud::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 55%,rgba(255,240,200,0) 55%,rgba(40,20,60,.35) 100%)}
.screen::after{content:"";position:absolute;left:8px;top:50%;width:22px;height:78px;margin-top:-39px;background:#000;border-radius:12px}
.hud{position:absolute;inset:0;pointer-events:none;font-weight:800;color:#fff}
.score{position:absolute;top:9px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:7px;background:rgba(10,14,30,.78);padding:4px 10px;border-radius:10px;font-size:12px;white-space:nowrap}
.badge{width:14px;height:14px;border-radius:50%;display:inline-block;border:2px solid rgba(255,255,255,.8)}
.badge.barca{background:linear-gradient(90deg,#a50044 50%,#004d98 50%)}
.badge.madrid{background:#f4f4f2;border-color:#c9a227}
.ask,.look{position:absolute;left:50%;transform:translateX(-50%);display:none}
.ask{top:42px;background:#fff;color:#1b2340;padding:6px 12px;border-radius:14px;font-size:14px;white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.look{bottom:16px;background:var(--gold);color:#1b2340;font:800 15px system-ui;padding:9px 18px;border-radius:999px;align-items:center;gap:8px;box-shadow:0 6px 16px rgba(0,0,0,.35);animation:pulse 1s ease-in-out infinite}
.look span{font-size:24px;line-height:1}
body.waiting .look,body.asking .ask{display:flex}
.err{position:absolute;inset:0;display:grid;place-items:center;background:#1d2530;color:var(--muted);font-weight:600}
@keyframes pulse{50%{transform:translateX(-50%) scale(1.07)}}
</style>
</head>
<body>
<header>
  <h1>Soccer IQ: art styles, round 2</h1>
  <p>Each style is modeled on games that are known for it. Tap a phone or 👀 to switch between head down and looking up.</p>
  <div class="controls">
    <span class="lbl">Background</span>
    <button data-env="park" class="on">Park</button><button data-env="empty">Empty stadium</button><button data-env="crowd">Small crowd</button>
    <span class="lbl">Head</span>
    <button id="lookBtn">👀 Look up</button><button id="closeBtn">🔍 Close-up</button><button id="pause">⏸ Pause</button>
  </div>
</header>

<div class="grid">
  <figure><div class="phone"><div class="screen" data-style="anime3d"><canvas></canvas></div></div><figcaption><b>1. Anime, cel-shaded 3D.</b> Like Captain Tsubasa and Inazuma Eleven: flat shading bands, ink outlines, big eyes, spiky hair.</figcaption></figure>
  <figure><div class="phone"><div class="screen" data-style="toy3d"><canvas></canvas></div></div><figcaption><b>2. 3D toy, smoothed.</b> Like Fall Guys and Animal Crossing, now with a one-piece rounded body.</figcaption></figure>
  <figure><div class="phone"><div class="screen" data-style="hd2d"><canvas></canvas></div></div><figcaption><b>3. HD-2D.</b> Like Octopath Traveler: pixel-art players and trees standing in a smooth 3D world.</figcaption></figure>
  <figure><div class="phone"><div class="screen" data-style="pixel"><canvas></canvas></div></div><figcaption><b>4. Hi-bit pixel art.</b> Like Stardew Valley, Eastward and Sensible Soccer: hand-placed sprites, a 32-color palette, dithered sky.</figcaption></figure>
  <figure><div class="phone"><div class="screen" data-style="lowpoly"><canvas></canvas></div></div><figcaption><b>5. Low-poly pastel.</b> Like A Short Hike and Alto's Adventure: faceted shapes and a warm evening palette.</figcaption></figure>
  <figure><div class="phone"><div class="screen" data-style="cartoon"><canvas></canvas></div></div><figcaption><b>6. 2D cartoon.</b> Last round's style, kept here to compare.</figcaption></figure>
</div>

<script>
// ---------- math ----------
const lerp=(a,b,t)=>a+(b-a)*t;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const smooth=t=>{t=clamp(t,0,1);return t*t*(3-2*t)};
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]];
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const norm=a=>{const l=Math.hypot(a[0],a[1],a[2])||1;return[a[0]/l,a[1]/l,a[2]/l]};
let seed=7;const rand=()=>(seed=(seed*16807)%2147483647)/2147483647;
const hexRgb=h=>{h=h.replace('#','');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]};
const shadeHex=(h,f)=>{const c=hexRgb(h).map(v=>clamp(Math.round(f<1?v*f:v+(255-v)*(f-1)),0,255));return`rgb(${c[0]},${c[1]},${c[2]})`};

// ---------- kits & players ----------
const KITS={
  barca:{pattern:'stripes',colors:['#a50044','#004d98'],shorts:'#0b2a6b',socks:'#0b2a6b',num:'#f6c344',trim:'#f6c344'},
  madrid:{pattern:'solid',colors:['#f4f4f2'],shorts:'#f4f4f2',socks:'#f4f4f2',num:'#22306b',trim:'#c9a227'},
};
const PLAYERS=[
  {id:'hero',name:'YAMAL',num:19,team:'barca',skin:'#b07a52',hair:'#1b1410'},
  {id:'raph',name:'RAPHINHA',num:11,team:'barca',skin:'#a8714b',hair:'#2a1c12'},
  {id:'lewy',name:'LEWANDOWSKI',num:9,team:'barca',skin:'#f0c8a6',hair:'#5a4330'},
  {id:'vini',name:'VINI JR',num:7,team:'madrid',skin:'#6b4429',hair:'#120c08'},
  {id:'bell',name:'BELLINGHAM',num:5,team:'madrid',skin:'#9a6a46',hair:'#1a120c'},
  {id:'mbap',name:'MBAPPÉ',num:10,team:'madrid',skin:'#7a4e30',hair:'#120c08'},
];

// ---------- scenario (pitch 36 x 24 m, we attack toward x=36) ----------
const T_PRE=2.6,LOOP=10;
const TRACKS={
  hero:[[0,9,15],[2.6,16,14.5]], raph:[[0,13,6],[2.6,19,4]], lewy:[[0,20,12],[2.6,23.5,11.5]],
  vini:[[0,24,17],[2.6,19,15.2]], bell:[[0,23,11],[2.6,20.5,12.9]], mbap:[[0,30,10],[2.6,27,9]]};
function track(keys,t){
  if(t<=keys[0][0])return[keys[0][1],keys[0][2]];
  for(let i=1;i<keys.length;i++)if(t<=keys[i][0]){const[t0,x0,y0]=keys[i-1],[t1,x1,y1]=keys[i];const u=smooth((t-t0)/(t1-t0||1));return[lerp(x0,x1,u),lerp(y0,y1,u)]}
  const k=keys[keys.length-1];return[k[1],k[2]];
}

// ---------- world props (shared with the 3D views) ----------
const WALLS=[{a:[42,-6],b:[42,30],o:[1,0]},{a:[-6,30],b:[-6,-6],o:[-1,0]},{a:[42,30],b:[-6,30],o:[0,1]},{a:[-6,-6],b:[42,-6],o:[0,-1]}];
const ROWS=6,rowOff=r=>1.5+r*1.1,rowZ=r=>1.0+r*0.9;
const SHIRTS=['#a50044','#004d98','#f4f4f2','#f6c344','#e11d48','#22306b','#7cc0ea','#f97316'];
const SKINS=['#f0c8a6','#b07a52','#7a4e30','#d9a37a','#5a3a22'];
const SEATS=[];
WALLS.forEach((w,wi)=>{
  const L=Math.hypot(w.b[0]-w.a[0],w.b[1]-w.a[1]),n=Math.floor(L/0.9);
  for(let r=0;r<ROWS;r++)for(let i=0;i<n;i++){
    const t=(i+.5)/n;
    SEATS.push({wall:wi,r,x:lerp(w.a[0],w.b[0],t)+w.o[0]*rowOff(r),y:lerp(w.a[1],w.b[1],t)+w.o[1]*rowOff(r),z:rowZ(r),
      color:r%2?'#2a62c4':'#1e4fa3',occ:rand()<0.28,shirt:SHIRTS[Math.floor(rand()*SHIRTS.length)],skin:SKINS[Math.floor(rand()*SKINS.length)]});
  }
});
const TREES=[];
for(let x=-14;x<=50;x+=4.5){TREES.push({x:x+rand()*2,y:-13-rand()*3,s:4+rand()*2.5});TREES.push({x:x+rand()*2,y:37+rand()*3,s:4+rand()*2.5})}
for(let y=-8;y<=32;y+=4.5){TREES.push({x:-16-rand()*3,y:y+rand()*2,s:4+rand()*2.5});TREES.push({x:52+rand()*3,y:y+rand()*2,s:4+rand()*2.5})}
const CLOUDS=[];
for(let i=0;i<10;i++){const a=i/10*Math.PI*2+rand()*.4;CLOUDS.push({x:18+Math.cos(a)*150,y:12+Math.sin(a)*150,z:32+rand()*18,s:12+rand()*8})}

// ---------- pixel-art sprites (24x32, hand-placed pixels) ----------
const DIGITS={0:'111101101101111',1:'010110010010111',2:'111001111100111',3:'111001111001111',4:'101101111001001',5:'111100111001111',6:'111100111101111',7:'111001010010010',8:'111101111101111',9:'111101111001111'};
const OUTLINE='#1a1420';
function finishSprite(g,W,H){
  const im=g.getImageData(0,0,W,H),d=im.data,src=new Uint8ClampedArray(d),a=(x,y)=>x>=0&&y>=0&&x<W&&y<H&&src[(y*W+x)*4+3]>128;
  const[or,og,ob]=hexRgb(OUTLINE);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const i=(y*W+x)*4;
    if(src[i+3]>128){d[i+3]=255;continue}
    if(a(x-1,y)||a(x+1,y)||a(x,y-1)||a(x,y+1)){d[i]=or;d[i+1]=og;d[i+2]=ob;d[i+3]=255}else d[i+3]=0}
  g.putImageData(im,0,0);
}
const spriteCache={};
function pixelSprite(p,kit,back,frame){
  const key=p.id+back+frame;if(spriteCache[key])return spriteCache[key];
  const W=24,H=32,cv=document.createElement('canvas');cv.width=W;cv.height=H;const g=cv.getContext('2d');
  const R=(x,y,w,h,c)=>{g.fillStyle=c;g.fillRect(x,y,w,h)};
  const step=[0,1,-1][frame],boots=p.id==='hero'?'#f59e0b':'#262b44';
  for(const[lx,o]of[[8,step],[13,-step]]){const bot=30-Math.max(0,o);R(lx,23,3,2,p.skin);R(lx,25,3,bot-26,kit.socks);R(lx,bot-1,4,2,boots)}
  R(7,20,10,3,kit.shorts);R(16,20,1,3,shadeHex(kit.shorts,.75));
  for(let x=7;x<17;x++){const c=kit.pattern==='stripes'&&((x-7)>>1)%2?kit.colors[1]:kit.colors[0];R(x,12,1,8,x===16?shadeHex(c,.72):x===7?shadeHex(c,1.12):c)}
  R(10,12,4,1,kit.trim);
  for(const[ax,o]of[[5,-step],[17,step]]){R(ax,12,2,2,kit.colors[0]);R(ax,14+o,2,3,p.skin)}
  if(back){const s=String(p.num),w=s.length*4-1;let x0=12-Math.floor(w/2);
    for(const ch of s){const m=DIGITS[ch];for(let i=0;i<15;i++)if(m[i]==='1')R(x0+i%3,14+Math.floor(i/3),1,1,kit.num);x0+=4}}
  else R(14,14,1,1,kit.trim);
  R(11,11,2,1,p.skin);
  for(let y=1;y<12;y++)for(let x=6;x<18;x++){
    if((x-11.5)**2+(y-6)**2>31)continue;
    const hair=back?y<=9:(y<=3||((x<=7||x>=16)&&y<=6));
    R(x,y,1,1,hair?(x<=8&&y<=4?shadeHex(p.hair,1.35):p.hair):(x>=16?shadeHex(p.skin,.85):p.skin));
  }
  if(!back){R(9,6,1,2,'#181425');R(14,6,1,2,'#181425');R(11,9,2,1,shadeHex(p.skin,.7))}
  finishSprite(g,W,H);
  return spriteCache[key]=cv;
}
let treeSprite;
function pixelTree(){
  if(treeSprite)return treeSprite;
  const W=32,H=40,cv=document.createElement('canvas');cv.width=W;cv.height=H;const g=cv.getContext('2d');
  g.fillStyle='#733e39';g.fillRect(14,26,4,13);g.fillStyle='#3e2731';g.fillRect(17,26,1,13);
  for(let y=1;y<30;y++)for(let x=2;x<30;x++){
    const d=((x-16)/13.5)**2+((y-14)/13)**2;if(d>1)continue;
    const l=(x-11)+(y-9),c=l<-4?'#63c74d':l<10?'#3e8948':'#265c42';
    g.fillStyle=(l>-6&&l<-2&&(x+y)%2)?'#3e8948':(l>8&&l<12&&(x+y)%2)?'#265c42':c;g.fillRect(x,y,1,1);
  }
  finishSprite(g,W,H);return treeSprite=cv;
}

// ---------- state ----------
const S={t:0,look:0,lookTarget:0,manual:false,time:0,paused:false,env:'park'};
function setLook(v){S.lookTarget=v;S.manual=true}
function update(dt){
  if(S.paused)return;
  S.time+=dt;S.t+=dt;
  if(S.t>=LOOP){S.t=0;S.lookTarget=0;S.manual=false}
  if(!S.manual&&S.t>4.2)S.lookTarget=1;
  S.look=clamp(S.look+clamp(S.lookTarget-S.look,-dt/0.7,dt/0.7),0,1);
  document.body.classList.toggle('waiting',S.t>=T_PRE&&S.lookTarget===0);
  document.body.classList.toggle('asking',S.look>0.95);
  document.getElementById('lookBtn').textContent=S.lookTarget?'⬇ Look at ball':'👀 Look up';
}
function snapshot(){
  const t=Math.min(S.t,T_PRE),P={};
  for(const p of PLAYERS){
    const k=TRACKS[p.id],pos=track(k,t),a=track(k,t-0.05),b=track(k,t+0.05);
    const vx=(b[0]-a[0])/0.1,vy=(b[1]-a[1])/0.1,sp=Math.hypot(vx,vy);
    P[p.id]={x:pos[0],y:pos[1],sp,face:sp>0.5?[vx/sp,vy/sp]:null};
  }
  const c=P.hero;c.face=c.face||[1,0];
  const wob=0.55+0.12*Math.sin(S.time*14)*Math.min(1,c.sp/3);
  const ball={x:c.x+c.face[0]*wob,y:c.y+c.face[1]*wob,z:0};
  for(const id in P){const p=P[id];if(!p.face){const dx=ball.x-p.x,dy=ball.y-p.y,l=Math.hypot(dx,dy)||1;p.face=[dx/l,dy/l]}}
  return{P,ball};
}
// Head down: aimed at the ball, but wide enough to see the nearest players' legs about 6–8 m ahead.
// Head up: eye-level view across the field.
function camSpec(snap,look){
  const h=snap.P.hero,b=snap.ball,k=smooth(look);
  if(S.closeup){const v=snap.P.vini;return{eye:[v.x-2.4,v.y-1.2,1.45],tgt:[v.x-.6,v.y-.6,.95],Ff:1.1}}
  const mates=PLAYERS.filter(p=>p.team==='barca'),teamY=mates.reduce((s,p)=>s+snap.P[p.id].y,0)/mates.length;
  return{
    eye:[h.x-lerp(3.2,4.5,k),h.y+lerp(0.9,0.4,k),lerp(2.6,2.0,k)],
    tgt:[lerp(b.x+0.6,h.x+8,k),lerp(b.y-.3,lerp(h.y,teamY,.6),k),lerp(0,0.9,k)],
    Ff:lerp(1.0,0.85,k)};
}

// ---------- 2D projection ----------
const NEAR=0.3;
function makeCam(eye,target,F,W,H){const f=norm(sub(target,eye)),r=norm(cross(f,[0,0,1])),u=cross(r,f);return{eye,f,r,u,F,W,H}}
function toCam(c,p){const d=sub(p,c.eye);return[dot(d,c.r),dot(d,c.u),dot(d,c.f)]}
function scr(c,q){return[c.W/2+c.F*q[0]/q[2],c.H/2-c.F*q[1]/q[2]]}
function project(c,p){const q=toCam(c,p);return q[2]<NEAR?null:[...scr(c,q),q[2]]}
function clipPoly(qs){
  const out=[];
  for(let i=0;i<qs.length;i++){
    const a=qs[i],b=qs[(i+1)%qs.length],ai=a[2]>=NEAR,bi=b[2]>=NEAR;
    if(ai)out.push(a);
    if(ai!==bi){const t=(NEAR-a[2])/(b[2]-a[2]);out.push([lerp(a[0],b[0],t),lerp(a[1],b[1],t),NEAR])}
  }
  return out;
}
function poly(ctx,c,pts,fill){
  const q=clipPoly(pts.map(p=>toCam(c,p)));if(q.length<3)return;
  ctx.beginPath();q.forEach((p,i)=>{const s=scr(c,p);i?ctx.lineTo(s[0],s[1]):ctx.moveTo(s[0],s[1])});ctx.closePath();
  ctx.fillStyle=fill;ctx.fill();
}
function groundLine(ctx,c,a,b,w){
  const dx=b[0]-a[0],dy=b[1]-a[1],l=Math.hypot(dx,dy),nx=-dy/l*w/2,ny=dx/l*w/2;
  poly(ctx,c,[[a[0]+nx,a[1]+ny,0.01],[b[0]+nx,b[1]+ny,0.01],[b[0]-nx,b[1]-ny,0.01],[a[0]-nx,a[1]-ny,0.01]],'#ffffff');
}
function line3(ctx,c,a,b,wm,color){
  let qa=toCam(c,a),qb=toCam(c,b);
  if(qa[2]<NEAR&&qb[2]<NEAR)return;
  if(qa[2]<NEAR){const t=(NEAR-qa[2])/(qb[2]-qa[2]);qa=qa.map((v,i)=>lerp(v,qb[i],t))}
  if(qb[2]<NEAR){const t=(NEAR-qb[2])/(qa[2]-qb[2]);qb=qb.map((v,i)=>lerp(v,qa[i],t))}
  const sa=scr(c,qa),sb=scr(c,qb);
  ctx.strokeStyle=color;ctx.lineCap='round';ctx.lineWidth=Math.max(1,c.F*wm/((qa[2]+qb[2])/2));
  ctx.beginPath();ctx.moveTo(sa[0],sa[1]);ctx.lineTo(sb[0],sb[1]);ctx.stroke();
}

// ---------- 2D world ----------
const STYLE2D={
  cartoon:{sky:['#5fb2ef','#cfe9fb'],grass:['#4caf50','#43a047'],park:'#5aa04a',stand:'#59606e',line:.14,ui:1},
  pixel:{sky:['#0099db','#c0cbdc'],grass:['#63c74d','#3e8948'],park:'#3e8948',stand:'#5a6988',line:.3,ui:.5},
};
function drawSky(ctx,c,st){
  const g=ctx.createLinearGradient(0,0,0,c.H);g.addColorStop(0,st.sky[0]);g.addColorStop(1,st.sky[1]);
  ctx.fillStyle=g;ctx.fillRect(0,0,c.W,c.H);
  for(const cl of CLOUDS){
    const q=project(c,[cl.x,cl.y,cl.z]);if(!q)continue;const r=c.F*cl.s/q[2];
    ctx.fillStyle='#ffffff';ctx.beginPath();
    [[-.9,.1,.55],[-.3,-.25,.7],[.4,-.1,.6],[1,.15,.45]].forEach(([dx,dy,s])=>{ctx.moveTo(q[0]+dx*r+s*r,q[1]+dy*r);ctx.arc(q[0]+dx*r,q[1]+dy*r,s*r,0,7)});
    ctx.fill();
  }
}
function drawTree(ctx,c,t,style){
  if(style==='pixel'){const q=project(c,[t.x,t.y,0]);if(q)drawSprite2D(ctx,pixelTree(),q[0],q[1],c.F*t.s/q[2]);return}
  line3(ctx,c,[t.x,t.y,0],[t.x,t.y,t.s*.45],0.45,'#6b4a2b');
  for(const[dx,dy,hz,rr,col]of[[0,0,.62,.36,'#2e7d32'],[-.22,.1,.5,.26,'#388e3c'],[.22,.05,.52,.27,'#33873a'],[0,0,.8,.24,'#43a047']]){
    const q=project(c,[t.x+dx*t.s*.5,t.y+dy*t.s*.5,t.s*hz]);if(!q)continue;
    ctx.fillStyle=col;ctx.beginPath();ctx.arc(q[0],q[1],c.F*t.s*rr/q[2],0,7);ctx.fill();
  }
}
function drawStands(ctx,c,st,crowd){
  const vis=WALLS.map((w,i)=>({w,i,d:Math.hypot((w.a[0]+w.b[0])/2-c.eye[0],(w.a[1]+w.b[1])/2-c.eye[1])}))
    .filter(({w})=>(c.eye[0]-w.a[0])*w.o[0]+(c.eye[1]-w.a[1])*w.o[1]<0).sort((x,y)=>y.d-x.d);
  for(const{w,i}of vis){
    const o=w.o,A=w.a,B=w.b,off=(d,z)=>[[A[0]+o[0]*d,A[1]+o[1]*d,z],[B[0]+o[0]*d,B[1]+o[1]*d,z]];
    const[a1,b1]=off(0,0.9),[a2,b2]=off(rowOff(ROWS)+.5,rowZ(ROWS)+.4);
    poly(ctx,c,[a1,b1,b2,a2],st.stand);
    poly(ctx,c,[a2,b2,[b2[0],b2[1],b2[2]+1.2],[a2[0],a2[1],a2[2]+1.2]],'#262b44');
    const N=8,ADS=['#124e89','#feae34','#ffffff','#e43b44','#3e8948'];
    for(let k=0;k<N;k++){const p0=[lerp(A[0],B[0],k/N),lerp(A[1],B[1],k/N)],p1=[lerp(A[0],B[0],(k+1)/N),lerp(A[1],B[1],(k+1)/N)];
      poly(ctx,c,[[...p0,0],[...p1,0],[...p1,.9],[...p0,.9]],ADS[k%ADS.length])}
    for(let r=ROWS-1;r>=0;r--)for(const s of SEATS){
      if(s.wall!==i||s.r!==r)continue;
      const q=project(c,[s.x,s.y,s.z]);if(!q)continue;const k=c.F/q[2];
      ctx.fillStyle=s.color;ctx.fillRect(q[0]-.22*k,q[1]-.3*k,.44*k,.3*k);
      if(crowd&&s.occ){ctx.fillStyle=s.shirt;ctx.fillRect(q[0]-.2*k,q[1]-.68*k,.4*k,.5*k);ctx.fillStyle=s.skin;ctx.fillRect(q[0]-.12*k,q[1]-.92*k,.24*k,.24*k)}
    }
  }
}
function drawPitch(ctx,c,style){
  const st=STYLE2D[style];drawSky(ctx,c,st);
  const R=S.env==='park'?[-80,120,-80,104]:[-6,42,-6,30];
  poly(ctx,c,[[R[0],R[2],0],[R[1],R[2],0],[R[1],R[3],0],[R[0],R[3],0]],S.env==='park'?st.park:'#3e8948');
  for(let i=0;i<12;i++)poly(ctx,c,[[i*3,0,0],[i*3+3,0,0],[i*3+3,24,0],[i*3,24,0]],st.grass[i%2]);
  const L=(a,b)=>groundLine(ctx,c,a,b,st.line);
  L([0,0],[36,0]);L([36,0],[36,24]);L([36,24],[0,24]);L([0,24],[0,0]);L([18,0],[18,24]);
  for(const gx of[0,36]){const d=gx?-1:1;L([gx,8],[gx+4*d,8]);L([gx+4*d,8],[gx+4*d,16]);L([gx+4*d,16],[gx,16])}
  for(let i=0;i<32;i++){const a=i/32*Math.PI*2,b=(i+1)/32*Math.PI*2;L([18+3*Math.cos(a),12+3*Math.sin(a)],[18+3*Math.cos(b),12+3*Math.sin(b)])}
  if(S.env==='park')TREES.map(t=>({t,d:Math.hypot(t.x-c.eye[0],t.y-c.eye[1])})).sort((a,b)=>b.d-a.d).forEach(({t})=>drawTree(ctx,c,t,style));
  else drawStands(ctx,c,st,S.env==='crowd');
}
function drawGoal(ctx,c,gx,dir){
  const y0=9.5,y1=14.5,h=1.8,bx=gx+1.3*dir,net='rgba(255,255,255,.22)';
  poly(ctx,c,[[bx,y0,0],[bx,y1,0],[bx,y1,h*.7],[bx,y0,h*.7]],net);
  poly(ctx,c,[[gx,y0,h],[gx,y1,h],[bx,y1,h*.7],[bx,y0,h*.7]],net);
  for(const[a,b]of[[[gx,y0,0],[gx,y0,h]],[[gx,y1,0],[gx,y1,h]],[[gx,y0,h],[gx,y1,h]]])line3(ctx,c,a,b,0.12,'#fff');
}
function drawSprite2D(ctx,img,x,y,h){
  if(h>=24)h=img.height*Math.max(1,Math.round(h/img.height));
  const w=h*img.width/img.height;ctx.imageSmoothingEnabled=false;
  ctx.drawImage(img,Math.round(x-w/2),Math.round(y-h),Math.round(w),Math.round(h));
}

// cartoon sprite (from round 1)
function seg(ctx,x1,y1,x2,y2,w,col){ctx.strokeStyle=col;ctx.lineWidth=w;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}
function drawCartoon(ctx,x,y,h,p,kit,back,swing,o){
  const u=h/110,body=kit.colors[0];
  ctx.fillStyle='rgba(0,0,0,.28)';ctx.beginPath();ctx.ellipse(x,y,20*u,5.5*u,0,0,7);ctx.fill();
  if(o.ring){ctx.strokeStyle=o.ring;ctx.lineWidth=Math.max(2.5,3.5*u);ctx.beginPath();ctx.ellipse(x,y,27*u*o.ringScale,8.5*u*o.ringScale,0,0,7);ctx.stroke()}
  const hipY=y-36*u-Math.abs(swing)*2*u;
  for(const s of[-1,1]){const a=swing*.55*s,hx=x+s*6*u,fx=hx+Math.sin(a)*34*u,fy=hipY+Math.cos(a)*34*u;
    seg(ctx,hx,hipY,fx,fy,8*u,p.skin);seg(ctx,lerp(hx,fx,.45),lerp(hipY,fy,.45),fx,fy-2*u,9*u,kit.socks);
    ctx.fillStyle=p.id==='hero'?'#f59e0b':'#15171c';ctx.beginPath();ctx.ellipse(fx,fy,6*u,3.6*u,0,0,7);ctx.fill()}
  ctx.fillStyle=kit.shorts;ctx.beginPath();ctx.roundRect(x-16*u,hipY-12*u,32*u,16*u,4*u);ctx.fill();
  const ty=hipY-40*u;
  for(const s of[-1,1]){const a=-swing*.6*s,sx=x+s*15*u,sy=ty+6*u,ex=sx+s*5*u+Math.sin(a)*22*u,ey=sy+Math.cos(a)*22*u;
    seg(ctx,sx,sy,ex,ey,8*u,p.skin);seg(ctx,sx,sy,lerp(sx,ex,.42),lerp(sy,ey,.42),10*u,body)}
  const tx=x-17*u,tw=34*u,th=31*u;
  ctx.save();ctx.beginPath();ctx.roundRect(tx,ty,tw,th,7*u);ctx.clip();ctx.fillStyle=body;ctx.fillRect(tx,ty,tw,th);
  if(kit.pattern==='stripes'){ctx.fillStyle=kit.colors[1];for(let i=1;i<5;i+=2)ctx.fillRect(tx+i*tw/5,ty,tw/5,th)}
  ctx.restore();
  if(back&&u>0.3){ctx.textAlign='center';ctx.textBaseline='middle';ctx.font=`900 ${15*u}px system-ui`;ctx.lineWidth=2.4*u;ctx.strokeStyle='rgba(0,0,0,.45)';
    ctx.strokeText(p.num,x,ty+19*u);ctx.fillStyle=kit.num;ctx.fillText(p.num,x,ty+19*u)}
  const hy=ty-19*u,r=17*u;
  ctx.fillStyle=p.skin;ctx.beginPath();ctx.arc(x,hy,r,0,7);ctx.fill();
  ctx.fillStyle=p.hair;ctx.beginPath();
  if(back)ctx.arc(x,hy,r*1.04,Math.PI*.82,Math.PI*2.18);else ctx.arc(x,hy-2.5*u,r*1.04,Math.PI*1.04,Math.PI*1.96);ctx.fill();
  if(!back){ctx.fillStyle='#1d1410';ctx.beginPath();ctx.arc(x-6*u,hy+2*u,2.3*u,0,7);ctx.arc(x+6*u,hy+2*u,2.3*u,0,7);ctx.fill()}
  return hy-r;
}
function bubble(ctx,x,y,r,emoji){
  ctx.fillStyle='#fff';ctx.strokeStyle='#ffd23f';ctx.lineWidth=Math.max(1.5,r*.2);
  ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();ctx.stroke();
  ctx.font=`${r*1.15}px system-ui`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(emoji,x,y+1);
}

function renderScene(ctx,W,H,style,snap){
  const st=STYLE2D[style],spec=camSpec(snap,S.look),c=makeCam(spec.eye,spec.tgt,Math.min(W,H)*spec.Ff,W,H);
  drawPitch(ctx,c,style);
  const opts=S.look>0.9,pulse=1+0.12*Math.sin(S.time*6),ui=st.ui;
  if(opts){
    const h=snap.P.hero,col=style==='pixel'?'#feae34':`rgba(255,210,63,${0.55+0.3*Math.sin(S.time*6)})`;
    poly(ctx,c,[[h.x+1,h.y-.35,.02],[h.x+3.3,h.y-.35,.02],[h.x+3.3,h.y+.35,.02],[h.x+1,h.y+.35,.02]],col);
    poly(ctx,c,[[h.x+3.3,h.y-.9,.02],[h.x+4.6,h.y,.02],[h.x+3.3,h.y+.9,.02]],col);
  }
  const objs=[];
  for(const p of PLAYERS){const s=snap.P[p.id],q=project(c,[s.x,s.y,0]);if(q)objs.push({z:q[2],draw:()=>{
    const h=c.F*1.6/q[2],back=s.face[0]*c.f[0]+s.face[1]*c.f[1]>0,moving=s.sp>0.5,swing=Math.sin(S.time*11+p.num)*clamp(s.sp/4,0,1);
    const opt=opts&&(p.id==='raph'||p.id==='lewy');let top;
    if(style==='pixel'){
      const rs=(opt?pulse:1)*h*.28;
      if(p.id==='hero'||opt){ctx.strokeStyle=p.id==='hero'?'#feae34':'#ffffff';ctx.lineWidth=Math.max(1,h*.03);ctx.beginPath();ctx.ellipse(q[0],q[1],rs,rs*.32,0,0,7);ctx.stroke()}
      ctx.fillStyle='#181425';ctx.globalAlpha=.35;ctx.beginPath();ctx.ellipse(q[0],q[1],h*.2,h*.06,0,0,7);ctx.fill();ctx.globalAlpha=1;
      const img=pixelSprite(p,KITS[p.team],back,moving?1+Math.floor(S.time*8+p.num)%2:0);drawSprite2D(ctx,img,q[0],q[1]+h/32,h);top=q[1]-h;
    }else top=drawCartoon(ctx,q[0],q[1],h,p,KITS[p.team],back,swing,{ring:p.id==='hero'?'#ffd23f':opt?'rgba(255,255,255,.95)':null,ringScale:opt?pulse:1});
    if(opt)bubble(ctx,q[0],top-Math.max(12*ui,h*.12)-8*ui,Math.max(12*ui,h*.12),'⚽');
  }})}
  const b=snap.ball,bq=project(c,[b.x,b.y,b.z+0.22]),bs=project(c,[b.x,b.y,0]);
  if(bq&&bs)objs.push({z:bq[2]-0.05,draw:()=>{const r=c.F*0.22/bq[2];ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(bs[0],bs[1],r,r*.35,0,0,7);ctx.fill();
    ctx.fillStyle='#fff';ctx.strokeStyle='#181425';ctx.lineWidth=Math.max(1,r*.15);ctx.beginPath();ctx.arc(bq[0],bq[1],r,0,7);ctx.fill();ctx.stroke();
    ctx.fillStyle='#181425';ctx.beginPath();ctx.arc(bq[0]+Math.cos(S.time*3)*r*.3,bq[1]+Math.sin(S.time*3)*r*.3,r*.35,0,7);ctx.fill()}});
  for(const[gx,d]of[[36,1],[0,-1]]){const q=project(c,[gx,12,0]);if(q)objs.push({z:q[2],draw:()=>drawGoal(ctx,c,gx,d)})}
  objs.sort((a,b)=>b.z-a.z).forEach(o=>o.draw());
  if(opts){const h=snap.P.hero,t=project(c,[h.x+4,h.y,0]);if(t)bubble(ctx,t[0],t[1]-26*ui,14*ui,'💨')}
  const down=1-smooth(S.look);
  if(down>0.01){const g=ctx.createRadialGradient(W/2,H*.6,Math.min(W,H)*.3,W/2,H*.6,Math.max(W,H)*.7);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,`rgba(0,0,0,${.4*down})`);ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}
}

// ---------- palette quantize for hi-bit pixel art (Endesga 32 + kit colors, 4x4 ordered dither) ----------
const PAL=['#be4a2f','#d77643','#ead4aa','#e4a672','#b86f50','#733e39','#3e2731','#a22633','#e43b44','#f77622','#feae34','#fee761','#63c74d','#3e8948','#265c42','#193c3e','#124e89','#0099db','#2ce8f5','#ffffff','#c0cbdc','#8b9bb4','#5a6988','#3a4466','#262b44','#181425','#ff0044','#68386c','#b55088','#f6757a','#e8b796','#c28569','#a50044','#004d98','#f4f4f2','#22306b','#f6c344','#0b2a6b','#f59e0b','#b07a52','#7a4e30','#6b4429']
  .map(hexRgb);
const LUT=new Int16Array(32768).fill(-1),BAYER=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
function nearest(r,g,b){const k=(r>>3)<<10|(g>>3)<<5|(b>>3);let v=LUT[k];if(v<0){let bd=1e9;for(let i=0;i<PAL.length;i++){const p=PAL[i],d=(p[0]-r)**2*.3+(p[1]-g)**2*.59+(p[2]-b)**2*.11;if(d<bd){bd=d;v=i}}LUT[k]=v}return PAL[v]}
function quantize(ctx,w,h){
  const im=ctx.getImageData(0,0,w,h),d=im.data;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=(y*w+x)*4,o=(BAYER[(y&3)*4+(x&3)]/16-.5)*20;
    const p=nearest(clamp(d[i]+o,0,255),clamp(d[i+1]+o,0,255),clamp(d[i+2]+o,0,255));d[i]=p[0];d[i+1]=p[1];d[i+2]=p[2];d[i+3]=255}
  ctx.putImageData(im,0,0);
}

// ---------- 2D views ----------
const views=[...document.querySelectorAll('.screen')].map(el=>{
  const hud=document.createElement('div');hud.className='hud';
  hud.innerHTML=`<div class="score"><span class="badge barca"></span>BAR 0 – 0 RMA<span class="badge madrid"></span></div>
    <div class="look"><span>👀</span>Look up!</div><div class="ask">What should Yamal do?</div>`;
  el.appendChild(hud);
  el.addEventListener('pointerdown',()=>setLook(S.lookTarget?0:1));
  const canvas=el.querySelector('canvas'),style=el.dataset.style;
  return{el,style,canvas,ctx:STYLE2D[style]?canvas.getContext('2d',{willReadFrequently:style==='pixel'}):null};
});
const PIXEL=2; // CSS px per art pixel
function render2D(v,snap){
  const cv=v.canvas,W=cv.clientWidth,H=cv.clientHeight;
  if(v.style==='pixel'){
    const w=Math.ceil(W/PIXEL),h=Math.ceil(H/PIXEL);
    if(cv.width!==w){cv.width=w;cv.height=h}
    v.ctx.setTransform(1,0,0,1,0,0);renderScene(v.ctx,w,h,'pixel',snap);quantize(v.ctx,w,h);return;
  }
  const dpr=Math.min(devicePixelRatio||1,2);
  if(cv.width!==Math.round(W*dpr)){cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr)}
  v.ctx.setTransform(dpr,0,0,dpr,0,0);renderScene(v.ctx,W,H,v.style,snap);
}

document.querySelectorAll('[data-env]').forEach(b=>b.onclick=()=>{S.env=b.dataset.env;document.querySelectorAll('[data-env]').forEach(x=>x.classList.toggle('on',x===b));window.SIM.onEnv.forEach(f=>f())});
document.getElementById('lookBtn').onclick=()=>setLook(S.lookTarget?0:1);
document.getElementById('closeBtn').onclick=e=>{S.closeup=!S.closeup;e.target.classList.toggle('on',S.closeup)};
document.getElementById('pause').onclick=e=>{S.paused=!S.paused;e.target.textContent=S.paused?'▶ Play':'⏸ Pause'};
window.SIM={S,camSpec,PLAYERS,KITS,TREES,SEATS,WALLS,ROWS,rowOff,rowZ,clamp,lerp,pixelSprite,pixelTree,rand,onEnv:[]};
let last=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  update(dt);const snap=snapshot();window.SIM.snap=snap;
  views.forEach(v=>{if(v.ctx)render2D(v,snap)});
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const SIM=window.SIM,{S,camSpec,PLAYERS,KITS,TREES,SEATS,WALLS,ROWS,rowOff,rowZ,clamp,lerp}=SIM;

const canvasTex=(w,h,draw,nearest)=>{const cv=document.createElement('canvas');cv.width=w;cv.height=h;draw(cv.getContext('2d'));return texFrom(cv,nearest)};
function texFrom(cv,nearest){const t=new THREE.CanvasTexture(cv);t.colorSpace=THREE.SRGBColorSpace;
  if(nearest){t.magFilter=t.minFilter=THREE.NearestFilter;t.generateMipmaps=false}else t.anisotropy=8;return t}
const toonRamp=(()=>{const t=new THREE.DataTexture(new Uint8Array([90,170,255]),3,1,THREE.RedFormat);t.minFilter=t.magFilter=THREE.NearestFilter;t.needsUpdate=true;return t})();
const inkMat=new THREE.MeshBasicMaterial({color:'#15131f',side:THREE.BackSide});
inkMat.onBeforeCompile=sh=>{sh.vertexShader=sh.vertexShader.replace('#include <begin_vertex>','vec3 transformed = position + normal * 0.022;')};

const STYLES={
  anime3d:{sky:'#3d8cf0',fog:'#bfe3ff',park:'#45b84a',grass:['#4ccf52','#3fbe47'],sun:2.2,hemi:.9,ink:true,
    mat:(c,o={})=>new THREE.MeshToonMaterial({color:c,gradientMap:toonRamp,...o}),rig:{L:.5,headR:.23,eyes:'anime',hair:'spiky'}},
  toy3d:{sky:'#8ccdf5',fog:'#cfeafb',park:'#5a9e4a',grass:['#4caf50','#43a047'],sun:1.8,hemi:1.1,
    mat:(c,o={})=>new THREE.MeshStandardMaterial({color:c,roughness:.55,...o}),rig:{L:.42,headR:.27,eyes:'dot',hair:'cap'}},
  lowpoly:{sky:'#ffc89a',fog:'#ffd9b3',fogNear:35,fogFar:130,park:'#a9d67a',grass:['#9fd36e','#92c862'],sun:1.6,sunColor:'#ffe2b8',hemi:1.0,hemiSky:'#ffd2a8',hemiGround:'#6e9a5a',
    mat:(c,o={})=>new THREE.MeshLambertMaterial({color:c,flatShading:true,...o}),rig:{L:.42,headR:.26,eyes:'dot',hair:'cap',low:true}},
  hd2d:{sky:'#79c6f2',fog:'#d8eefb',park:'#3e8948',grass:['#63c74d','#57b545'],sun:1.7,hemi:1.0,pixelGround:true,sprites:true,
    mat:(c,o={})=>new THREE.MeshStandardMaterial({color:c,roughness:.8,...o})},
};

function bodyTex(kit,p){
  return canvasTex(512,256,g=>{
    g.fillStyle=kit.colors[0];g.fillRect(0,0,512,256);
    if(kit.pattern==='stripes'){g.fillStyle=kit.colors[1];for(let i=0;i<16;i+=2)g.fillRect(i*32+16,0,32,256)}
    g.fillStyle=kit.shorts;g.fillRect(0,178,512,78);g.fillStyle=kit.trim;g.fillRect(0,0,512,12);
    g.textAlign='center';g.textBaseline='middle';g.lineJoin='round';
    g.font='900 92px system-ui,sans-serif';g.lineWidth=10;g.strokeStyle='rgba(0,0,0,.45)';g.strokeText(p.num,384,112);g.fillStyle=kit.num;g.fillText(p.num,384,112);
    g.font='800 28px system-ui,sans-serif';g.lineWidth=6;g.strokeText(p.name,384,48,170);g.fillText(p.name,384,48,170);
    g.fillStyle=kit.trim;g.beginPath();g.arc(150,64,12,0,7);g.fill();
  });
}

// One-piece rounded body (lathe), capsule legs and arms, sphere head.
function makeRig(p,cfg){
  const o=cfg.rig,M=cfg.mat,kit=KITS[p.team],g=new THREE.Group(),meshes=[],legs=[],arms=[];
  const sg=o.low?{cap:[1,5],sph:[7,5],lathe:7}:{cap:[4,12],sph:[28,20],lathe:28};
  const cap=(r,l)=>new THREE.CapsuleGeometry(r,l,sg.cap[0],sg.cap[1]).rotateX(Math.PI/2);
  const sph=r=>new THREE.SphereGeometry(r,sg.sph[0],sg.sph[1]);
  const add=(parent,m)=>{parent.add(m);meshes.push(m);return m};
  const L=o.L,hipZ=L+.06,skin=M(p.skin);
  for(const s of[-1,1]){
    const piv=new THREE.Group();piv.position.set(0,s*.09,hipZ);g.add(piv);legs.push(piv);
    add(piv,new THREE.Mesh(cap(.062,L*.3),skin)).position.z=-L*.22;
    add(piv,new THREE.Mesh(cap(.07,L*.36),M(kit.socks))).position.z=-L*.62;
    const bt=add(piv,new THREE.Mesh(sph(.085),M(p.id==='hero'?'#f59e0b':'#15171c')));bt.scale.set(1.5,.95,.7);bt.position.set(.05,0,-L+.03);
  }
  const pts=[[0,0],[.15,.01],[.2,.08],[.215,.22],[.205,.4],[.185,.55],[.13,.66],[.05,.7],[0,.705]].map(([r,y])=>new THREE.Vector2(r,y));
  const body=add(g,new THREE.Mesh(new THREE.LatheGeometry(pts,sg.lathe).rotateX(Math.PI/2),M('#ffffff',{map:bodyTex(kit,p)})));
  body.position.z=hipZ-.12;body.scale.x=.8;
  const top=hipZ-.12+.7;
  for(const s of[-1,1]){
    const piv=new THREE.Group();piv.position.set(0,s*.2,top-.14);piv.rotation.x=s*.2;g.add(piv);arms.push(piv);
    add(piv,new THREE.Mesh(cap(.072,.05),M(kit.colors[0]))).position.z=-.05;
    add(piv,new THREE.Mesh(cap(.052,.17),skin)).position.z=-.21;
  }
  const R=o.headR,hz=top+R*.8;
  add(g,new THREE.Mesh(sph(R),skin)).position.z=hz;
  const hairM=M(p.hair);
  const capG=new THREE.SphereGeometry(R*1.06,sg.sph[0],sg.sph[1],0,Math.PI*2,0,Math.PI*.5).rotateX(Math.PI/2).rotateY(-.4);
  add(g,new THREE.Mesh(capG,hairM)).position.set(-.01,0,hz+.01);
  if(o.hair==='spiky'){
    const cone=new THREE.ConeGeometry(R*.3,R*1.05,5).translate(0,R*.5,0),Y=new THREE.Vector3(0,1,0);
    const dirs=[];
    for(let i=0;i<9;i++){const az=(115+i*16)*Math.PI/180,el=(i%2?30:58)*Math.PI/180;dirs.push([Math.cos(el)*Math.cos(az),Math.cos(el)*Math.sin(az),Math.sin(el)])}
    for(const az of[-28,0,28]){const a=az*Math.PI/180,el=.35;dirs.push([Math.cos(el)*Math.cos(a)*.9,Math.cos(el)*Math.sin(a),Math.sin(el)+.25])}
    for(const d of dirs){const v=new THREE.Vector3(...d).normalize(),m=add(g,new THREE.Mesh(cone,hairM));m.quaternion.setFromUnitVectors(Y,v);m.position.set(v.x*R*.72,v.y*R*.72,hz+v.z*R*.72)}
  }
  if(o.eyes==='anime'){
    for(const s of[-1,1]){
      const w=add(g,new THREE.Mesh(sph(.07),new THREE.MeshBasicMaterial({color:'#ffffff'})));w.scale.set(.3,.72,1.05);w.position.set(R*.95,s*R*.36,hz-.005);
      const iris=add(g,new THREE.Mesh(sph(.052),new THREE.MeshBasicMaterial({color:'#3b2516'})));iris.scale.set(.3,.68,.95);iris.position.set(R*.99,s*R*.36,hz-.012);
      const hl=add(g,new THREE.Mesh(sph(.014),new THREE.MeshBasicMaterial({color:'#ffffff'})));hl.position.set(R*1.04,s*R*.36-.012,hz+.02);
    }
  }else for(const s of[-1,1]){const e=add(g,new THREE.Mesh(sph(.038),M('#1d1410')));e.position.set(R*.93,s*R*.33,hz+R*.05)}
  for(const m of meshes){m.castShadow=true;m.receiveShadow=true;if(cfg.ink&&m.material.type!=='MeshBasicMaterial')m.add(new THREE.Mesh(m.geometry,inkMat))}
  g.userData={p,legs,arms};return g;
}
function makeSpritePlayer(p){
  const g=new THREE.Group(),tex={};
  const get=(back,f)=>tex[back+''+f]||(tex[back+''+f]=texFrom(SIM.pixelSprite(p,KITS[p.team],back,f),true));
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:get(true,0),alphaTest:.5}));sp.center.set(.5,1/32);sp.scale.set(1.2,1.6,1);g.add(sp);
  const sh=new THREE.Mesh(new THREE.CircleGeometry(.34,16),new THREE.MeshBasicMaterial({color:0x181425,transparent:true,opacity:.35,depthWrite:false}));sh.scale.y=.55;sh.position.z=.015;g.add(sh);
  g.userData={p,sprite:sp,get};return g;
}

function makeWorld(el,cfg){
  const canvas=el.querySelector('canvas');let renderer;
  try{renderer=new THREE.WebGLRenderer({canvas,antialias:true})}catch(e){el.insertAdjacentHTML('beforeend','<div class="err">WebGL is not available here</div>');return}
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  const scene=new THREE.Scene();scene.background=new THREE.Color(cfg.sky);scene.fog=new THREE.Fog(cfg.fog,cfg.fogNear||70,cfg.fogFar||190);
  const camera=new THREE.PerspectiveCamera(40,2,0.1,500);camera.up.set(0,0,1);
  const hemi=new THREE.HemisphereLight(cfg.hemiSky||0xffffff,cfg.hemiGround||0x4a7a3a,cfg.hemi);hemi.position.set(0,0,1);scene.add(hemi);
  const sun=new THREE.DirectionalLight(cfg.sunColor||0xffffff,cfg.sun);sun.position.set(34,-18,40);sun.target.position.set(18,12,0);scene.add(sun.target);
  sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-32,right:32,top:32,bottom:-32,near:1,far:140});scene.add(sun);
  const M=cfg.mat;

  // pitch
  const ppm=cfg.pixelGround?8:40;
  const pitchTex=canvasTex(48*ppm,36*ppm,g=>{
    const X=x=>Math.round((x+6)*ppm),Y=y=>Math.round((30-y)*ppm);
    g.fillStyle=cfg.park;g.fillRect(0,0,48*ppm,36*ppm);
    for(let i=0;i<12;i++){g.fillStyle=cfg.grass[i%2];g.fillRect(X(i*3),Y(24),3*ppm,24*ppm)}
    if(cfg.pixelGround){for(let i=0;i<2600;i++){g.fillStyle=SIM.rand()<.5?'#3e8948':'#7fd06a';g.fillRect(Math.floor(SIM.rand()*48*ppm),Math.floor(SIM.rand()*36*ppm),1,1)}}
    g.fillStyle='#ffffff';const lw=cfg.pixelGround?1:Math.round(.14*ppm);
    const hl=(x0,x1,y)=>g.fillRect(X(x0),Y(y),X(x1)-X(x0),lw),vl=(x,y0,y1)=>g.fillRect(X(x),Y(y1),lw,Y(y0)-Y(y1));
    hl(0,36,0);hl(0,36,24);vl(0,0,24);vl(36,0,24);vl(18,0,24);hl(0,4,8);hl(0,4,16);vl(4,8,16);hl(32,36,8);hl(32,36,16);vl(32,8,16);
    for(let a=0;a<360;a+=cfg.pixelGround?3:.5){const r=a*Math.PI/180;g.fillRect(X(18+3*Math.cos(r)),Y(12+3*Math.sin(r)),lw,lw)}
  },cfg.pixelGround);
  const pitch=new THREE.Mesh(new THREE.PlaneGeometry(48,36),new THREE.MeshLambertMaterial({map:pitchTex}));pitch.position.set(18,12,0);pitch.receiveShadow=true;scene.add(pitch);
  const outer=new THREE.Mesh(new THREE.PlaneGeometry(400,400),new THREE.MeshLambertMaterial({color:cfg.park}));outer.position.set(18,12,-.02);outer.receiveShadow=true;scene.add(outer);

  // goals
  for(const[gx,dir]of[[36,1],[0,-1]]){
    const white=M('#ffffff'),net=new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.25,side:THREE.DoubleSide,depthWrite:false});
    const parts=[];const post=new THREE.CylinderGeometry(.06,.06,1.8,12).rotateX(Math.PI/2);
    for(const y of[9.5,14.5]){const m=new THREE.Mesh(post,white);m.position.set(gx,y,.9);parts.push(m)}
    const bar=new THREE.Mesh(new THREE.CylinderGeometry(.06,.06,5,12),white);bar.position.set(gx,12,1.8);parts.push(bar);
    const back=new THREE.Mesh(new THREE.PlaneGeometry(5,1.3).rotateX(Math.PI/2).rotateZ(Math.PI/2),net);back.position.set(gx+1.3*dir,12,.65);scene.add(back);
    parts.forEach(m=>{m.castShadow=true;if(cfg.ink)m.add(new THREE.Mesh(m.geometry,inkMat));scene.add(m)});
  }

  const people=PLAYERS.map(p=>{const g=cfg.sprites?makeSpritePlayer(p):makeRig(p,cfg);scene.add(g);return g});
  const ball=new THREE.Mesh(new THREE.SphereGeometry(.2,cfg.rig?.low?8:24,cfg.rig?.low?6:18),M('#ffffff',{map:canvasTex(256,128,g=>{g.fillStyle='#fff';g.fillRect(0,0,256,128);g.fillStyle='#222';for(let i=0;i<10;i++){g.beginPath();g.arc((i*53)%256,(i*37)%128,14,0,7);g.fill()}})}));
  ball.castShadow=true;if(cfg.ink)ball.add(new THREE.Mesh(ball.geometry,inkMat));scene.add(ball);

  // option markers
  const gold=new THREE.MeshBasicMaterial({color:0xffd23f,transparent:true,opacity:.9,depthWrite:false});
  const heroRing=new THREE.Mesh(new THREE.RingGeometry(.48,.62,40),gold);scene.add(heroRing);
  const optRings=[0,1].map(()=>{const m=new THREE.Mesh(new THREE.RingGeometry(.5,.66,40),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,depthWrite:false}));scene.add(m);return m});
  const bubbleTex=e=>canvasTex(128,128,g=>{g.fillStyle='#fff';g.strokeStyle='#ffd23f';g.lineWidth=10;g.beginPath();g.arc(64,64,56,0,7);g.fill();g.stroke();g.font='64px system-ui';g.textAlign='center';g.textBaseline='middle';g.fillText(e,64,68)});
  const optBubbles=[0,1].map(()=>{const s=new THREE.Sprite(new THREE.SpriteMaterial({map:bubbleTex('⚽'),depthTest:false}));s.scale.set(.7,.7,1);scene.add(s);return s});
  const dribBubble=new THREE.Sprite(new THREE.SpriteMaterial({map:bubbleTex('💨'),depthTest:false}));dribBubble.scale.set(.6,.6,1);scene.add(dribBubble);
  const sh=new THREE.Shape();[[1,-.35],[3.3,-.35],[3.3,-.9],[4.6,0],[3.3,.9],[3.3,.35],[1,.35]].forEach(([x,y],i)=>i?sh.lineTo(x,y):sh.moveTo(x,y));
  const arrow=new THREE.Mesh(new THREE.ShapeGeometry(sh),gold.clone());scene.add(arrow);

  // environment
  const park=new THREE.Group(),stands=new THREE.Group(),crowd=new THREE.Group();
  if(cfg.sprites){
    const tm=new THREE.SpriteMaterial({map:texFrom(SIM.pixelTree(),true),alphaTest:.5});
    TREES.forEach(t=>{const s=new THREE.Sprite(tm);s.center.set(.5,0);s.scale.set(t.s*.8,t.s,1);s.position.set(t.x,t.y,0);park.add(s)});
  }else{
    const low=cfg.rig.low,trunkG=new THREE.CylinderGeometry(.18,.25,1,low?5:8).rotateX(Math.PI/2);
    const leafG=low?new THREE.ConeGeometry(1,2.2,6).rotateX(Math.PI/2):new THREE.IcosahedronGeometry(1,cfg.ink?1:2);
    const leafM=low?[M('#5fae7a'),M('#7cc58a'),M('#3f8f6e')]:[M('#2e7d32'),M('#388e3c')];
    TREES.forEach((t,i)=>{const tr=new THREE.Mesh(trunkG,M('#6b4a2b'));tr.scale.z=t.s*.45;tr.position.set(t.x,t.y,t.s*.225);
      const lf=new THREE.Mesh(leafG,leafM[i%leafM.length]);lf.scale.setScalar(t.s*(low?.32:.34));lf.position.set(t.x,t.y,t.s*(low?.75:.68));
      [tr,lf].forEach(m=>{m.castShadow=true;if(cfg.ink)m.add(new THREE.Mesh(m.geometry,inkMat))});park.add(tr,lf)});
  }
  const ADS=['#1e88e5','#fdd835','#ffffff','#e53935','#00a86b'];
  WALLS.forEach(w=>{
    const alongY=!!w.o[0],L=Math.hypot(w.b[0]-w.a[0],w.b[1]-w.a[1]),mid=[(w.a[0]+w.b[0])/2,(w.a[1]+w.b[1])/2];
    for(let r=0;r<ROWS;r++){const h=rowZ(r)-.18,len=L+2*rowOff(r),m=new THREE.Mesh(alongY?new THREE.BoxGeometry(1.1,len,h):new THREE.BoxGeometry(len,1.1,h),M(cfg.rig?.low?'#d8b4a0':'#7b8190'));
      m.position.set(mid[0]+w.o[0]*rowOff(r),mid[1]+w.o[1]*rowOff(r),h/2);m.receiveShadow=true;stands.add(m)}
    for(let k=0;k<8;k++){const t=(k+.5)/8,len=L/8,b=new THREE.Mesh(alongY?new THREE.BoxGeometry(.1,len,.9):new THREE.BoxGeometry(len,.1,.9),M(ADS[k%ADS.length]));
      b.position.set(lerp(w.a[0],w.b[0],t)+w.o[0]*.2,lerp(w.a[1],w.b[1],t)+w.o[1]*.2,.45);stands.add(b)}
  });
  const mtx=new THREE.Matrix4(),col=new THREE.Color();
  const seatMesh=new THREE.InstancedMesh(new THREE.BoxGeometry(.45,.45,.3),M('#ffffff'),SEATS.length);
  SEATS.forEach((s,i)=>{mtx.makeTranslation(s.x,s.y,s.z);seatMesh.setMatrixAt(i,mtx);seatMesh.setColorAt(i,col.set(s.color))});stands.add(seatMesh);
  const fans=SEATS.filter(s=>s.occ),bodyMesh=new THREE.InstancedMesh(new THREE.CapsuleGeometry(.2,.3,2,8).rotateX(Math.PI/2),M('#ffffff'),fans.length),headMesh=new THREE.InstancedMesh(new THREE.SphereGeometry(.14,10,8),M('#ffffff'),fans.length);
  fans.forEach((s,i)=>{mtx.makeTranslation(s.x,s.y,s.z+.45);bodyMesh.setMatrixAt(i,mtx);bodyMesh.setColorAt(i,col.set(s.shirt));mtx.makeTranslation(s.x,s.y,s.z+.85);headMesh.setMatrixAt(i,mtx);headMesh.setColorAt(i,col.set(s.skin))});
  crowd.add(bodyMesh,headMesh);scene.add(park,stands,crowd);
  const setEnv=()=>{park.visible=S.env==='park';stands.visible=S.env!=='park';crowd.visible=S.env==='crowd';outer.material.color.set(S.env==='park'?cfg.park:cfg.grass[1])};
  setEnv();SIM.onEnv.push(setEnv);

  const camDir=new THREE.Vector3();
  return function render(snap){
    const W=canvas.clientWidth,H=canvas.clientHeight;
    if(canvas.width!==Math.round(W*renderer.getPixelRatio()))renderer.setSize(W,H,false);
    const spec=camSpec(snap,S.look),F=Math.min(W,H)*spec.Ff;
    camera.aspect=W/H;camera.fov=2*Math.atan(H/2/F)*180/Math.PI;camera.updateProjectionMatrix();
    camera.position.set(...spec.eye);camera.lookAt(...spec.tgt);camera.getWorldDirection(camDir);
    people.forEach(g=>{
      const u=g.userData,s=snap.P[u.p.id];g.position.set(s.x,s.y,0);
      if(u.sprite){const back=s.face[0]*camDir.x+s.face[1]*camDir.y>0,f=s.sp>.5?1+Math.floor(S.time*8+u.p.num)%2:0;u.sprite.material.map=u.get(back,f);return}
      g.rotation.z=Math.atan2(s.face[1],s.face[0]);
      const sw=Math.sin(S.time*11+u.p.num)*clamp(s.sp/4,0,1);
      u.legs.forEach((l,i)=>l.rotation.y=sw*.6*(i?1:-1));u.arms.forEach((a,i)=>a.rotation.y=-sw*.7*(i?1:-1));
    });
    ball.position.set(snap.ball.x,snap.ball.y,.2);ball.rotation.y=snap.ball.x*3;
    const h=snap.P.hero,opts=S.look>.9,pulse=1+.12*Math.sin(S.time*6);
    heroRing.position.set(h.x,h.y,.02);
    ['raph','lewy'].forEach((id,i)=>{const q=snap.P[id];optRings[i].visible=optBubbles[i].visible=opts;optRings[i].position.set(q.x,q.y,.02);optRings[i].scale.setScalar(pulse);optBubbles[i].position.set(q.x,q.y,2.1)});
    arrow.visible=dribBubble.visible=opts;arrow.position.set(h.x,h.y,.03);arrow.material.opacity=.55+.3*Math.sin(S.time*6);dribBubble.position.set(h.x+4,h.y,.9);
    renderer.render(scene,camera);
  };
}

const renders=[...document.querySelectorAll('.screen')].filter(el=>STYLES[el.dataset.style]).map(el=>makeWorld(el,STYLES[el.dataset.style])).filter(Boolean);
function frame(){if(SIM.snap)renders.forEach(r=>r(SIM.snap));requestAnimationFrame(frame)}
requestAnimationFrame(frame);
</script>
</body>
