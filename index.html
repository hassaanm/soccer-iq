<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Heads Up!">
<meta name="theme-color" content="#ffc89a">
<title>Heads Up! Soccer</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }</script>
</head>
<body>
<canvas id="view"></canvas>
<div id="tunnel"></div>

<div id="hud" class="hidden" data-phase="idle" data-step="none" data-mode="home">
  <button id="homeBtn" class="btn btn-glass btn-icon top-left" aria-label="Home">⌂</button>
  <button id="skipBtn" class="btn btn-glass top-right">Skip ⏭</button>
  <div id="topbar"><div id="dots"></div><div id="score" class="hidden"></div></div>
  <div id="prompt"></div>
  <div id="caption"></div>
  <div id="toast"></div>
  <div id="banner"><span></span></div>
  <div id="seenNote"></div>
  <div id="rate"><div class="title"></div><div class="stars"></div><div class="txt"></div><div class="btns"><button id="rateWatch" class="btn btn-gold">▶ Watch the 3★ play</button><button id="rateNext" class="btn btn-ghost">Next</button></div></div>
  <div id="touchPick"><button id="touchSmall" class="btn btn-gold"><i>👟</i><span>Small touches</span><small>keep it close</small></button><button id="touchBig" class="btn btn-gold"><i>💨</i><span>Big push</span><small>kick it ahead &amp; run</small></button></div>
  <button class="btn btn-gold btn-round" id="lookBtn"><i>👀</i><span>LOOK UP</span></button>
  <button class="btn btn-blue btn-round" id="passBtn"><i>⚽</i><span>PASS</span></button>
  <button class="btn btn-gold btn-round" id="shootBtn"><i>🥅</i><span>SHOOT</span></button>
  <button class="btn btn-green btn-round" id="dribBtn"><i>👟</i><span>DRIBBLE</span></button>
</div>

<section id="home" class="screen">
  <header class="brand"><svg class="logo" viewBox="0 0 100 100" aria-hidden="true"><defs><clipPath id="ballclip"><circle cx="50" cy="50" r="45"/></clipPath><radialGradient id="ballshade" cx="38%" cy="32%" r="75%"><stop offset="0" stop-color="#fff"/><stop offset=".75" stop-color="#f1ece6"/><stop offset="1" stop-color="#d8d0c8"/></radialGradient></defs><circle cx="50" cy="50" r="45" fill="url(#ballshade)"/><g clip-path="url(#ballclip)"><polygon points="50.0,35.0 64.3,45.4 58.8,62.1 41.2,62.1 35.7,45.4" fill="#24193a"/><polygon points="50.0,27.0 36.7,17.3 41.8,1.7 58.2,1.7 63.3,17.3" fill="#24193a"/><polygon points="71.9,42.9 77.0,27.2 93.4,27.2 98.5,42.9 85.2,52.6" fill="#24193a"/><polygon points="63.5,68.6 80.0,68.6 85.1,84.3 71.7,93.9 58.4,84.3" fill="#24193a"/><polygon points="36.5,68.6 41.6,84.3 28.3,93.9 14.9,84.3 20.0,68.6" fill="#24193a"/><polygon points="28.1,42.9 14.8,52.6 1.5,42.9 6.6,27.2 23.0,27.2" fill="#24193a"/><g stroke="#24193a" stroke-width="2.4" stroke-linecap="round"><line x1="50.0" y1="35.0" x2="50.0" y2="27.0"/><line x1="63.3" y1="17.3" x2="77.0" y2="27.2"/><line x1="64.3" y1="45.4" x2="71.9" y2="42.9"/><line x1="85.2" y1="52.6" x2="80.0" y2="68.6"/><line x1="58.8" y1="62.1" x2="63.5" y2="68.6"/><line x1="58.4" y1="84.3" x2="41.6" y2="84.3"/><line x1="41.2" y1="62.1" x2="36.5" y2="68.6"/><line x1="20.0" y1="68.6" x2="14.8" y2="52.6"/><line x1="35.7" y1="45.4" x2="28.1" y2="42.9"/><line x1="23.0" y1="27.2" x2="36.7" y2="17.3"/></g></g><circle cx="50" cy="50" r="45" fill="none" stroke="#24193a" stroke-width="5"/></svg><h1>Heads Up! <span>Soccer</span></h1></header>
  <button id="gear" class="btn btn-glass btn-icon top-right" aria-label="Grown-ups: hold">⚙︎</button>
  <div id="gearTip">Grown-ups: hold for 1 second</div>
  <div class="matchup">
    <div class="team" data-side="us">
      <div class="tag">YOUR TEAM</div>
      <div class="kind"><button data-type="club">Clubs</button><button data-type="country">Countries</button></div>
      <div class="carousel">
        <button class="btn btn-glass btn-icon prev" aria-label="Previous team">‹</button>
        <div class="shirts"><canvas class="side l" width="160" height="160"></canvas><canvas class="main" width="320" height="320"></canvas><canvas class="side r" width="160" height="160"></canvas></div>
        <button class="btn btn-glass btn-icon next" aria-label="Next team">›</button>
      </div>
      <div class="tname"></div>
      <div class="roster"></div>
    </div>
    <div class="vs">VS</div>
    <div class="team" data-side="them">
      <div class="tag">OTHER TEAM</div>
      <div class="kind"><button data-type="club">Clubs</button><button data-type="country">Countries</button></div>
      <div class="carousel">
        <button class="btn btn-glass btn-icon prev" aria-label="Previous team">‹</button>
        <div class="shirts"><canvas class="side l" width="160" height="160"></canvas><canvas class="main" width="320" height="320"></canvas><canvas class="side r" width="160" height="160"></canvas></div>
        <button class="btn btn-glass btn-icon next" aria-label="Next team">›</button>
      </div>
      <div class="tname"></div>
      <div class="roster"></div>
    </div>
  </div>
  <div id="version"></div>
  <div class="home-foot">
    <div class="lessonbox"><div id="lessonName"></div><div id="lessons"></div></div>
    <button id="playBtn" class="btn btn-green btn-xl">PLAY</button>
    <div class="freebox"><button id="freeBtn" class="btn btn-blue">⚽ Free play</button></div>
  </div>
</section>

<section id="card" class="screen hidden"><div class="panel"><div class="emoji"></div><h2></h2><p></p><div class="btns"><button id="cardMain" class="btn btn-green btn-lg"></button><button id="cardAlt" class="btn btn-ghost"></button></div></div></section>

<section id="results" class="screen hidden"><div class="panel">
  <div class="emoji"></div><h2></h2><div class="roundsrow"></div><div class="roundsnote"></div><p></p>
  <div class="btns"><button id="nextLessonBtn" class="btn btn-green btn-lg">Next lesson ▶</button><button id="againBtn" class="btn btn-blue">↺ Play again</button><button id="resultsHome" class="btn btn-ghost">⌂ Home</button></div>
</div></section>

<section id="menu" class="screen hidden"><div class="panel wide">
  <h2>Grown-ups</h2>
  <label>Lesson <select id="skillSel"></select></label>
  <label>Rounds per session <select id="roundsSel"><option>4</option><option>6</option><option>8</option></select></label>
  <label class="chk"><input type="checkbox" id="voiceChk"> Voice narration</label>
  <label class="chk"><input type="checkbox" id="soundChk"> Sounds</label>
  <div id="progressList"></div>
  <div class="btns"><button id="menuClose" class="btn btn-green btn-lg">Done</button><button id="resetBtn" class="btn btn-ghost danger">Reset progress</button></div>
</div></section>

<div id="rotate"><div>📱↻</div><p>Turn your phone sideways</p></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
